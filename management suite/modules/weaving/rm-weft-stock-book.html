    <script>
        (function () {
            /* clear check disabled */
            const isDark = localStorage.getItem('vishwa_fashions_theme') === 'true' ||
                (localStorage.getItem('vishwa_fashions_theme') === null && true);
            if (isDark) {
                document.documentElement.classList.add('dark-mode');
            } else {
                document.documentElement.classList.remove('dark-mode');
            }
            const isCollapsed = localStorage.getItem('vf_sidebar_collapsed') === 'true';
            if (isCollapsed) {
                document.documentElement.classList.add('vf-sidebar-collapsed');
            }
        })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RM Weft Stock Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

        :root {
            --bg: #f8f7fc;
            --surface: #ffffff;
            --fg: #1a1a2e;
            --muted: #8b8fa3;
            --border: #e8e7f1;
            --accent: #8b5cf6;
            --accent2: #ec4899;
            --accent3: #f97316;
            --error: #ef4444;
            --success: #10b981;

            --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, monospace;
            --primary-gradient: linear-gradient(135deg, var(--accent), var(--accent2));

            --radius: 16px;
            --container: 1450px;

            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.12);

            --transition-fast: 0.15s ease;
            --transition-base: 0.25s ease;
            --transition-slow: 0.4s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 4px;
            border: 2px solid var(--bg);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--accent2), var(--accent));
        }

        body {
            background: linear-gradient(135deg, #f8f7fc 0%, #faf5ff 50%, #f0f4ff 100%);
            color: var(--fg);
            font-family: var(--font-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            transition: background 0.3s ease;
            overflow-x: hidden;
            width: 100%;
        }

        .dark-mode body {
            background: linear-gradient(135deg, #000000 0%, #0a0a0a 50%, #0f0f1a 100%);
            --bg: #000000;
            --surface: #0a0a0a;
            --fg: #ffffff;
            --muted: #a1a1aa;
            --border: #27272a;
            --card-bg: #18181b;
            --accent: #7c3aed;
            --accent2: #a855f7;
            --accent3: #f97316;
            --error: #ef4444;
            --success: #10b981;
            --accent-light: rgba(124, 58, 237, 0.15);
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: var(--font-display);
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        h1 {
            font-size: 2rem;
        }

        h2 {
            font-size: 1.4rem;
        }

        h3 {
            font-size: 1.1rem;
        }

        h4 {
            font-size: 1rem;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: min(1000px, 100%);
            margin: 0 auto;
            padding: 1.5rem 1.5rem 2rem 1.5rem;
            min-height: 100vh;
            transition: background 0.3s ease;
            box-sizing: border-box;
            min-width: 0;
            overflow-x: hidden;
        }

        @media (max-width: 1024px) {
            .app-container {
                max-width: 100%;
                padding: 0.75rem 1.25rem 2rem 1.25rem;
                width: 100%;
                min-width: 0;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
                padding: 0.75rem 0 1.25rem;
                margin-bottom: 1.5rem;
            }

            .logo {
                font-size: clamp(1.35rem, 4.5vw, 1.7rem);
                line-height: 1.2;
            }

            .breadcrumb-container {
                margin-bottom: 1.25rem;
                max-width: 100%;
            }

            .nav-tabs {
                width: 100%;
                margin-top: 0.5rem;
            }
        }

        @media (max-width: 768px) {
            .app-container {
                padding: 0.5rem 0.85rem 1.5rem;
            }

            .logo {
                font-size: 1.35rem;
            }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2.5rem 0 2rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
            opacity: 0.5;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            cursor: default;
            transition: transform var(--transition-base);
        }

        .logo:hover {
            transform: scale(1.02);
        }

        .nav-tabs {
            display: flex;
            gap: 0.75rem;
            margin-top: 2rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            flex-wrap: wrap;
            position: relative;
        }

        .nav-tab {
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 0.65rem 1.25rem;
            border-bottom: 2px solid transparent;
            color: var(--muted);
            background: transparent;
            border: none;
            border-radius: 8px;
            transition: all var(--transition-base);
            white-space: nowrap;
            font-family: var(--font-body);
            position: relative;
            overflow: hidden;
        }

        .nav-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left var(--transition-slow);
        }

        .nav-tab:hover::before {
            left: 100%;
        }

        .nav-tab:hover {
            color: var(--accent);
            background: rgba(139, 92, 246, 0.08);
            transform: translateY(-1px);
        }

        .nav-tab.active {
            color: var(--accent);
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.12), rgba(236, 72, 153, 0.06));
            border-bottom-color: var(--accent);
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.15);
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-md);
            transition: all var(--transition-base);
            position: relative;
            max-width: 100%;
            width: 100%;
            box-sizing: border-box;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            opacity: 0;
            transition: opacity var(--transition-base);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
            border-color: rgba(139, 92, 246, 0.2);
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-base);
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity var(--transition-base);
        }

        .stat-card:hover::after {
            opacity: 1;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .stat-card.gradient-purple {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.08), rgba(139, 92, 246, 0.02));
            border-color: rgba(139, 92, 246, 0.25);
        }

        .stat-card.gradient-pink {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.08), rgba(236, 72, 153, 0.02));
            border-color: rgba(236, 72, 153, 0.25);
        }

        .stat-card.gradient-orange {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.08), rgba(249, 115, 22, 0.02));
            border-color: rgba(249, 115, 22, 0.25);
        }

        .stat-card h4 {
            font-family: var(--font-body);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .stat-card .value {
            font-family: var(--font-display);
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .table-container {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            max-height: 70vh;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            position: relative;
            box-sizing: border-box;
        }

        .table-responsive-container {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            box-sizing: border-box;
        }

        .table-container::-webkit-scrollbar {
            height: 10px;
        }

        .table-container::-webkit-scrollbar-track {
            background: var(--bg);
            border-radius: 5px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 5px;
        }

        .table-container::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .table-container table {
            width: 100%;
            border-collapse: collapse;
        }

        .table-container th,
        .table-container td {
            padding: 0.75rem 0.75rem !important;
            font-size: 0.85rem !important;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            text-align: left;
            padding: 1.1rem 1rem;
            border-bottom: 1.5px solid var(--border);
            font-family: var(--font-body);
            font-weight: 600;
            color: var(--fg);
            background: linear-gradient(to bottom, rgba(139, 92, 246, 0.04), transparent);
            position: sticky;
            top: 0;
            z-index: 10;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
            white-space: normal;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            transition: background-color var(--transition-fast);
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
            max-width: 300px;
            overflow: hidden;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(139, 92, 246, 0.04) !important;
        }

        .tag {
            display: inline-block;
            padding: 0.35rem 0.8rem;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.12), rgba(236, 72, 153, 0.06));
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 6px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            font-weight: 600;
            transition: all var(--transition-base);
        }

        .tag:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.2);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--fg);
            margin-bottom: 0.6rem;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-family: var(--font-body);
            color: var(--fg);
            outline: none;
            transition: all var(--transition-base);
            font-size: 0.95rem;
        }

        input:hover,
        select:hover,
        textarea:hover {
            border-color: rgba(139, 92, 246, 0.4);
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
            background: rgba(139, 92, 246, 0.02);
        }

        button {
            padding: 0.85rem 2rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            border: none;
            border-radius: 10px;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all var(--transition-base);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left var(--transition-slow);
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .search-bar {
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: flex-end;
            flex-wrap: wrap;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .search-bar>div {
            flex: 1 1 220px;
            min-width: 0;
            box-sizing: border-box;
        }

        .search-bar input,
        .search-bar select {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        /* Tablet & Halved Viewport: search full width, filters wrap neatly */
        @media (max-width: 1200px) {
            .search-bar {
                gap: 0.85rem;
                margin-bottom: 1.5rem;
            }

            .search-bar>div {
                flex: 1 1 200px !important;
                min-width: 0 !important;
            }

            .search-bar>div:first-child {
                flex: 1 1 100% !important;
            }

            .search-bar label {
                white-space: normal;
                line-height: 1.25;
            }
        }

        /* Phone: stack every field full width */
        @media (max-width: 640px) {
            .search-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 0.85rem;
            }

            .search-bar>div,
            .search-bar>div:first-child {
                flex: 1 1 auto !important;
                width: 100%;
            }
        }

        .success-toast {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-family: var(--font-body);
            font-weight: 600;
            z-index: 2000;
            animation: slideInRight 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.4);
            backdrop-filter: blur(10px);
        }

        @keyframes slideInRight {
            from {
                transform: translateX(120%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            to {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-overlay .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .csv-actions {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 1rem;
            margin: 1rem 0;
        }

        .csv-summary {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .subtle-button {
            background: var(--surface) !important;
            color: var(--fg) !important;
            border: 1.5px solid var(--border) !important;
            box-shadow: var(--shadow-sm) !important;
        }

        .subtle-button:hover {
            border-color: var(--accent) !important;
            background: rgba(139, 92, 246, 0.05) !important;
            transform: translateY(-1px);
        }

        .danger-button {
            background: var(--surface) !important;
            color: var(--fg) !important;
            border: 1.5px solid var(--border) !important;
            box-shadow: var(--shadow-sm) !important;
        }

        .danger-button:hover {
            border-color: var(--error) !important;
            background: rgba(239, 68, 68, 0.05) !important;
            transform: translateY(-1px);
        }

        .mini-button {
            padding: 0.5rem 1rem !important;
            font-size: 0.85rem !important;
            border-radius: 8px !important;
            box-shadow: var(--shadow-sm) !important;
            transition: all var(--transition-fast) !important;
        }

        .mini-button:hover {
            transform: translateY(-1px);
        }

        .error-note {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 0.75rem;
            padding: 0.75rem 1rem;
            background: rgba(239, 68, 68, 0.05);
            border-left: 3px solid var(--error);
            border-radius: 6px;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }

        .csv-input {
            min-width: 90px;
            padding: 0.45rem 0.5rem;
            border-color: transparent;
            background: transparent;
        }

        .csv-input:focus {
            background: var(--surface);
            border-color: var(--accent);
        }

        .csv-details-input {
            min-width: 100px;
        }



        .clickable-row {
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .clickable-row:hover td {
            background: rgba(139, 92, 246, 0.07) !important;
        }

        .clickable-row:active td {
            background: rgba(139, 92, 246, 0.12) !important;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            gap: 1.5rem;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }

        .detail-title {
            font-size: clamp(2rem, 5vw, 4rem);
            line-height: 0.95;
        }

            padding: 0.4rem 0.8rem;
            border-radius: 12px;

            flex-wrap: wrap;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-sm);

        .app-container.dark-mode .breadcrumb-container {

        .breadcrumb-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;

            color: var(--muted);

            font-weight: 600;
            font-size: 0.82rem;

            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            padding: 0.35rem 0.65rem;
            border-radius: 8px;
        }

        .breadcrumb-link:hover {
            color: var(--accent);
            background: rgba(139, 92, 246, 0.08);
            transform: translateY(-1px);
        }

        .breadcrumb-separator {
            color: var(--border);
            display: flex;
            align-items: center;
            opacity: 0.8;
        }

        .breadcrumb-current {
            color: var(--fg);
            font-weight: 600;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            padding: 0.35rem 0.65rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);

            display: flex;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;

            background: rgba(139, 92, 246, 0.1);

            border-radius: 8px;

            border: 1px solid rgba(139, 92, 246, 0.15);

        @media (max-width: 1024px) {
            .optional-column {
                display: none !important;
            }

            /* The desktop flex-row table trick squeezes cells until text overlaps
               once the global mobile rules force nowrap. Use a real table + scroll. */
            .table-container {
                overflow-x: auto !important;
                -webkit-overflow-scrolling: touch;
            }

            .table-container table {
                width: max-content !important;
                min-width: 100% !important;
                display: table !important;
            }

            .table-container tr {
                display: table-row !important;
                width: auto !important;
            }

            .table-container th,
            .table-container td {
                display: table-cell !important;
                flex: none !important;
                width: auto !important;
                max-width: none !important;
                vertical-align: middle;
                padding: 0.75rem 0.9rem !important;
                font-size: 0.82rem !important;
                word-break: normal !important;
                overflow-wrap: normal !important;
            }

            /* Card-mode log table must stay stacked, not table-cell */
            .log-issue-table,
            .log-issue-table tr,
            .log-issue-table td {
                display: block !important;
            }

            .log-issue-table thead {
                display: none !important;
            }
        }

        /* Item-wise Ledger v2 filter toolbar */
        @media (max-width: 1024px) {
            .ledger-v2-toolbar {
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 0.85rem !important;
            }

            .ledger-v2-filters {
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 0.85rem !important;
                width: 100%;
            }

            .ledger-v2-filter {
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 0.35rem !important;
                width: 100%;
            }

            .ledger-v2-filter select {
                width: 100% !important;
                min-width: 0 !important;
            }

            .ledger-v2-count {
                align-self: flex-start;
            }

            .tree-zoom-pan-container {
                height: 60vh;
                min-height: 320px;
            }
        }

        @media (max-width: 640px) {
            .tree-zoom-pan-container {
                height: 52vh;
                min-height: 280px;
            }

            .log-form-actions {
                flex-direction: column !important;
                align-items: stretch !important;
            }

            .log-form-actions button {
                width: 100% !important;
                flex: none !important;
            }

            .search-bar>button {
                width: 100%;
                align-self: stretch;
            }
        }

        /* Tablet (641px - 1024px): log entry fields as a 2-col card grid per entry */
        @media (min-width: 641px) and (max-width: 1024px) {
            .log-issue-table {
                display: block !important;
                width: 100% !important;
                min-width: 0 !important;
            }

            .log-issue-table thead {
                display: none !important;
            }

            .log-issue-table tbody {
                display: flex !important;
                flex-direction: column !important;
                gap: 1.25rem !important;
                width: 100% !important;
            }

            .log-issue-table tr {
                display: grid !important;
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                gap: 0.85rem 1rem !important;
                width: 100% !important;
                padding: 1.25rem !important;
                background: var(--surface) !important;
                border: 1.5px solid var(--border) !important;
                border-radius: 16px !important;
                box-shadow: var(--shadow-sm) !important;
                box-sizing: border-box !important;
            }

            .log-issue-table td {
                display: block !important;
                width: 100% !important;
                margin-bottom: 0 !important;
                padding: 0 !important;
            }

            .log-issue-table td::before {
                content: attr(data-label);
                display: block;
                font-size: 0.7rem;
                font-weight: 700;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.05em;
                margin-bottom: 0.35rem;
            }

            .log-issue-table td[data-label="Action"],
            .log-issue-table td[data-label="Details"] {
                grid-column: 1 / -1 !important;
            }

            .search-bar>button {
                align-self: flex-end;
                min-height: 44px;
            }
        }


        .app-container.full-screen-wide {
            max-width: 98% !important;
            width: 98% !important;
        }

        /* ==========================================================================
           WEFT STOCK DASHBOARD STYLES (MATCHING YARN RM STOCK DASHBOARD)
           ========================================================================== */
        .dash-kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.25rem;
            margin-bottom: 1.75rem;
        }

        @media (max-width: 1024px) {
            .dash-kpi-grid { grid-template-columns: repeat(2, 1fr); }

        @media (max-width: 640px) {
            .dash-kpi-grid { grid-template-columns: 1fr; }

        .dash-kpi-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: var(--shadow-sm);

            height: 3px;
            background: var(--primary-gradient);

        .dash-kpi-card.success::before { background: var(--success); }
        .dash-kpi-card.info::before { background: #3b82f6; }

        .dash-kpi-sub {

        /* Dashboard Toolbar & Filter Controls */

            z-index: 100000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;

        window.onerror = function (msg, url, line, col, error) {

                '<p><strong>Message:</strong> ' + msg + '</p>' +
                '<p><strong>Location:</strong> ' + url + ':' + line + ':' + col + '</p>' +

            document.body.appendChild(errorDiv);

    <script type="text/babel">
        const getFinancialYearForDate = (dateStr) => {
            if (!dateStr) return null;
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return null;
            const year = date.getFullYear();
            const month = date.getMonth();
            if (month >= 3) {
                return `${year}-${(year + 1).toString().slice(-2)}`;
            } else {
                return `${year - 1}-${year.toString().slice(-2)}`;
            }
        };

        const getFYDateRange = (fy) => {
            if (!fy || fy === 'All') return { start: null, end: null };
            const parts = fy.split('-');
            const startYear = parseInt(parts[0]);
            return {
                start: `${startYear}-04-01`,
                end: `${startYear + 1}-03-31`
            };
        };

        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        const SearchableDropdown = ({ options = [], value, onChange, placeholder = "Search...", label, showEmpty = true, emptyLabel = "-- All --", className = "" }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [search, setSearch] = useState('');
            const dropdownRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                        setIsOpen(false);
                        setSearch('');
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const filteredOptions = useMemo(() => {
                if (!search.trim()) return options;
                return options.filter(opt => {
                    const searchStr = typeof opt === 'object' ? opt.label : opt;
                    return (searchStr || '').toString().toLowerCase().includes(search.toLowerCase());
                });
            }, [options, search]);

            const getDisplayValue = () => {
                if (isOpen) return search;
                const found = options.find(o => (o && typeof o === 'object' ? o.value : o) === value);
                if (found && typeof found === 'object') return found.label;
                return found || value || '';
            };

            if (className === 'log-input') {
                return (
                    <div className="input-group" style={{ marginBottom: 0, position: 'relative', zIndex: isOpen ? 10001 : 1 }} ref={dropdownRef}>
                        {label && <label>{label}</label>}
                        <div className="select-input-wrapper" onClick={() => setIsOpen(!isOpen)}>
                            <input
                                type="text"
                                placeholder={placeholder}
                                value={getDisplayValue()}
                                onChange={(e) => {
                                    if (!isOpen) setIsOpen(true);
                                    setSearch(e.target.value);
                                }}
                                onClick={(e) => e.stopPropagation()}
                                onFocus={() => {
                                    setIsOpen(true);
                                    setSearch('');
                                }}
                                autoComplete="off"
                                className={className}
                                style={{ cursor: 'text' }}
                            />
                            <i>{isOpen ? '▴' : '▾'}</i>
                        </div>

                        {isOpen && (
                            <div className="dropdown-list" style={{ zIndex: 10002 }}>
                                {showEmpty && (
                                    <div
                                        className={`dropdown-item ${!value ? 'selected' : ''}`}
                                        onClick={() => {
                                            onChange('');
                                            setIsOpen(false);
                                            setSearch('');
                                        }}
                                    >
                                        {emptyLabel}
                                    </div>
                                )}
                                {filteredOptions.map((opt, idx) => {
                                    const optValue = typeof opt === 'object' ? opt.value : opt;
                                    const optLabel = typeof opt === 'object' ? opt.label : opt;
                                    return (
                                        <div
                                            key={`${optValue}-${idx}`}
                                            className={`dropdown-item ${value === optValue ? 'selected' : ''}`}
                                            onClick={() => {
                                                onChange(optValue);
                                                setIsOpen(false);
                                                setSearch('');
                                            }}
                                        >
                                            {optLabel}
                                        </div>
                                    );
                                })}
                                {filteredOptions.length === 0 && (
                                    <div className="dropdown-empty">No options found</div>
                                )}
                            </div>
                        )}
                    </div>
                );
            }

            const selectedDisplay = () => {
                const found = options.find(o => (o && typeof o === 'object' ? o.value : o) === value);
                if (found && typeof found === 'object') return found.label;
                return (found || value) ? String(found || value) : emptyLabel;

            return (
                <div className="input-group" ref={dropdownRef} style={{ position: 'relative', marginBottom: 0 }}>

                    <div

        const VfDatePicker = ({ value, onChange, placeholder = "Select date", label, className = "", style = {}, required = false }) => {
            const dateInputRef = React.useRef(null);

            const getFormattedDisplay = (val) => {
                if (!val) return placeholder;
                const dateOnly = val.includes('T') ? val.split('T')[0] : val.split(' ')[0];
                const parts = dateOnly.split('-');
                if (parts.length === 3) {
                    const y = parts[0];
                    const m = parts[1].padStart(2, '0');
                    const d = parts[2].padStart(2, '0');
                    return `${d}/${m}/${y}`;
                }
                return val;
            };

            const triggerPicker = () => {
                if (dateInputRef.current) {
                    try {
                        if (typeof dateInputRef.current.showPicker === 'function') {
                            dateInputRef.current.showPicker();
                        } else {
                            dateInputRef.current.click();
                        }
                    } catch (_) {
                        dateInputRef.current.focus();

                }
            };

                    <div className="select-input-wrapper" onClick={triggerPicker} style={{ cursor: 'pointer', position: 'relative', width: '100%' }}>

                                cursor: 'pointer',
                                zIndex: 5,
                                border: 'none',
                                background: 'transparent'
                            }}
                        />
                    </div>
                </div>
            );

        // Custom Hook for LocalStorage
        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    if (!item) return initialValue;
                    try {
                        const parsed = JSON.parse(item);
                        if (Array.isArray(initialValue) && !Array.isArray(parsed)) {
                            return initialValue;
                        }
                        return parsed;
                    } catch (e) {
                        if (Array.isArray(initialValue)) {
                            return initialValue;
                        }
                        return item;
                    }
                } catch (error) {
                    console.log(error);
                    return initialValue;
                }
            });

            useEffect(() => {
                const handleStorageChange = (e) => {
                    if (!e || e.key === key || !e.key) {
                        try {
                            const item = window.localStorage.getItem(key);
                            if (!item) {
                                setStoredValue(initialValue);
                            } else {
                                try {
                                    const parsed = JSON.parse(item);
                                    if (Array.isArray(initialValue) && !Array.isArray(parsed)) {
                                        setStoredValue(initialValue);
                                    } else {
                                        setStoredValue(parsed);
                                    }
                                } catch (e) {
                                    if (Array.isArray(initialValue)) {
                                        setStoredValue(initialValue);
                                    } else {
                                        setStoredValue(item);
                                    }
                                }
                            }
                        } catch (error) {
                            console.error('Error parsing storage change:', error);
                        }
                    }
                };

                const handleSupabaseSync = (e) => {
                    if (!e || !e.detail || e.detail.key === key || !e.detail.key) {
                        handleStorageChange({ key });
                    }
                };
                const handleOrderUpdated = () => {
                    if (key === 'yarn-orders') {
                        handleStorageChange({ key });
                    }
                };

                window.addEventListener('storage', handleStorageChange);
                window.addEventListener('supabase-sync', handleSupabaseSync);
                window.addEventListener('supabase-ready', handleStorageChange);
                window.addEventListener('supabase-item-deleted', handleStorageChange);
                window.addEventListener('yarn-order-updated', handleOrderUpdated);
                window.addEventListener('weaving-order-updated', handleOrderUpdated);

                return () => {
                    window.removeEventListener('storage', handleStorageChange);
                    window.removeEventListener('supabase-sync', handleSupabaseSync);
                    window.removeEventListener('supabase-ready', handleStorageChange);
                    window.removeEventListener('supabase-item-deleted', handleStorageChange);
                    window.removeEventListener('yarn-order-updated', handleOrderUpdated);
                    window.removeEventListener('weaving-order-updated', handleOrderUpdated);
                };
            }, [key, initialValue]);

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.log(error);
                }
            };

            return [storedValue, setValue];
        }

        // Helper to process RM Order Book data into Stock Book format
        function processData(orders, qualities, issues, selectedFY) {
            const inventoryMap = new Map();
            const { start, end } = getFYDateRange(selectedFY);

            // Filter for Weft orders only
            const weftOrders = (orders || []).filter(o => o.type && o.type.trim().toLowerCase() === 'weft');

            // Add boxes from weft orders (challans/batches)
            for (const order of weftOrders) {
                const key = `${order.quality}|${order.supplier}|${order.code}|${order.color}`;

                let orderHasVisibleBox = false;
                const tempBoxes = [];

                for (const batch of (order.batches || [])) {
                    for (const box of (batch.boxes || [])) {
                        const arrivalDate = batch.receiveDate || order.orderDate || (order.createdAt ? order.createdAt.split('T')[0] : '');

                        // If it's a future year box, skip it
                        if (end && arrivalDate > end) continue;

                        const weight = parseFloat(box.weight) || 0;
                        const rawReturnedWeight = parseFloat(box.returnedWeight) || 0;
                        const inCones = parseInt(box.cones) || 0;
                        const grCones = (rawReturnedWeight && weight && inCones) ? Math.round(rawReturnedWeight / (weight / inCones)) : 0;
                        const kgPerCone = inCones > 0 ? weight / inCones : 0;
                        const grWeight = grCones * kgPerCone;
                        const inKg = weight - grWeight;

                        let isCarriedForward = false;
                        let openingStockKg = inKg;
                        let openingStockCones = inCones - grCones;

                        // If it arrived in a previous year, calculate opening stock
                        if (start && arrivalDate < start) {
                            isCarriedForward = true;
                            const boxIssuesBefore = (issues || []).filter(i =>
                                i.quality === order.quality &&
                                (!i.supplier || i.supplier === order.supplier) &&
                                i.code === order.code &&
                                i.box === box.boxNumber &&
                                i.challan === batch.challanNumber &&
                                i.date < start
                            );
                            const issuedKgBefore = boxIssuesBefore.reduce((s, i) => s + (parseFloat(i.net) || 0), 0);
                            const issuedConesBefore = boxIssuesBefore.reduce((s, i) => s + (parseInt(i.cones) || 0), 0);

                            openingStockKg = Math.max(0, inKg - issuedKgBefore);
                            openingStockCones = Math.max(0, inCones - grCones - issuedConesBefore);

                            // If opening stock is zero, it's fully consumed. Don't carry it forward.
                            if (openingStockKg <= 0 && openingStockCones <= 0) continue;
                        }

                        orderHasVisibleBox = true;

                        tempBoxes.push({
                            id: `${batch.id}-${box.boxNumber}`,
                            boxNumber: box.boxNumber,
                            lotNumber: batch.lotNumber,
                            cones: inCones,
                            totalWeight: weight,
                            returnedWeight: rawReturnedWeight,
                            grCones: grCones,
                            grWeight: grWeight,
                            returnedDate: box.returnedDate,
                            stock: inKg,
                            challan: batch.challanNumber,
                            challanId: batch.id,
                            orderId: order.id,
                            arrivalDate: batch.receiveDate,
                            isCarriedForward,
                            openingStockKg,
                            openingStockCones,
                            issues: []
                        });
                    }
                }

                if (orderHasVisibleBox) {
                    if (!inventoryMap.has(key)) {
                        inventoryMap.set(key, {
                            id: order.id,
                            quality: order.quality,
                            company: order.supplier,
                            code: order.code,
                            color: order.color,
                            lastArrivalDate: order.orderDate || (order.createdAt ? order.createdAt.split('T')[0] : ''),
                            cones: 0,
                            stock: 0,
                            totalGrCones: 0,
                            totalGrWeight: 0,
                            boxes: []
                        });
                    }
                    const item = inventoryMap.get(key);
                    const currentOrderDate = order.orderDate || (order.createdAt ? order.createdAt.split('T')[0] : '');
                    if (currentOrderDate > item.lastArrivalDate) {
                        item.lastArrivalDate = currentOrderDate;
                    }

                    for (const tb of tempBoxes) {
                        item.boxes.push(tb);
                        item.cones += tb.isCarriedForward ? tb.openingStockCones : (tb.cones - tb.grCones);
                        item.stock += tb.isCarriedForward ? tb.openingStockKg : tb.stock;
                        item.totalGrCones += tb.isCarriedForward ? 0 : tb.grCones;
                        item.totalGrWeight += tb.isCarriedForward ? 0 : tb.grWeight;
                    }
                }
            }

            // Link issues and calculate remaining amounts
            for (const item of inventoryMap.values()) {
                let itemIssuedKg = 0;
                let itemIssuedCones = 0;

                for (const box of item.boxes) {
                    box.issues = (issues || []).filter(i =>
                        i.quality === item.quality &&
                        (!i.supplier || i.supplier === item.company) &&
                        i.code === item.code &&
                        i.box === box.boxNumber &&
                        i.challan === box.challan &&
                        (!start || i.date >= start) &&
                        (!end || i.date <= end)
                    );

                    const boxIssuedKg = box.issues.reduce((s, i) => s + (parseFloat(i.net) || 0), 0);
                    const boxIssuedCones = box.issues.reduce((s, i) => s + (parseInt(i.cones) || 0), 0);

                    box.issuedKg = boxIssuedKg;
                    box.issuedCones = boxIssuedCones;
                    box.remainingKg = box.openingStockKg - boxIssuedKg;
                    box.remainingCones = box.openingStockCones - boxIssuedCones;

                    itemIssuedKg += boxIssuedKg;
                    itemIssuedCones += boxIssuedCones;
                }

                item.issuedKg = itemIssuedKg;
                item.issuedCones = itemIssuedCones;
                item.remainingKg = item.stock - itemIssuedKg;
                item.remainingCones = item.cones - itemIssuedCones;
            }

            return Array.from(inventoryMap.values());
        }

        const WeftStockChart = ({ items = [] }) => {
            const canvasRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || typeof Chart === 'undefined') return;

                // Top 10 qualities by available weight
                const topQualities = [...items]

                    .sort((a, b) => (b.availWeight || b.remainingKg || 0) - (a.availWeight || a.remainingKg || 0))
                    .slice(0, 10);

                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                    chartInstanceRef.current = null;
                }

                if (topQualities.length === 0) return;

                const ctx = canvasRef.current.getContext('2d');
                const isDark = document.documentElement.classList.contains('dark-mode');

                const labels = topQualities.map(q => {
                    const supp = q.company ? ` (${q.company})` : '';
                    return `${q.quality || ''}${supp}`;
                });
                const dataWeights = topQualities.map(q => parseFloat(((q.availWeight !== undefined ? q.availWeight : q.remainingKg) || 0).toFixed(2)));

                const bgCol = isDark ? 'rgba(139, 92, 246, 0.75)' : 'rgba(139, 92, 246, 0.85)';
                const borderCol = '#8b5cf6';

                chartInstanceRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Available Weight (Kg)',
                            data: dataWeights,
                            backgroundColor: bgCol,
                            borderColor: borderCol,
                            borderWidth: 1,

                                grid: { color: isDark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.05)' },

                });

                return () => {
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();
                        chartInstanceRef.current = null;
                    }
                };
            }, [items]);

            return (
                <div className="chart-card" style={{ marginBottom: '1.5rem' }}>
                    <div className="chart-card-header">
                        <div className="chart-title-group">
                            <h3>Top Weft Qualities by Available Stock (Kg)</h3>

                        <canvas ref={canvasRef}></canvas>
                    </div>

            const sortData = (data, tableId, columns) => {

                    const isNum = (typeof aVal === 'number' || (typeof aVal === 'string' && /^-?\d+(\.\d+)?$/.test(aVal))) &&
                        (typeof bVal === 'number' || (typeof bVal === 'string' && /^-?\d+(\.\d+)?$/.test(bVal)));
                    const cmp = isNum
                        ? parseFloat(aVal) - parseFloat(bVal)

            const addTimestampToDate = (dateStr) => {

                const now = new Date();
                const pad = (num) => String(num).padStart(2, '0');
                const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}.${String(now.getMilliseconds()).padStart(3, '0')}`;
                return `${dateStr}T${timeStr}`;

            const formatDate = (dateStr) => {

                if (dateOnly.includes('/')) {
                    const parts = dateOnly.split('/');
                    if (parts.length === 3) {
                        if (parts[0].length === 4) return `${parts[2]}/${parts[1]}/${parts[0]}`;
                        return `${parts[0]}/${parts[1]}/${parts[2]}`;
                    }
                }
                const parts = dateOnly.split('-');
                if (parts.length === 3) {
                    if (parts[0].length === 4) return `${parts[2]}/${parts[1]}/${parts[0]}`;
                    return `${parts[0]}/${parts[1]}/${parts[2]}`;

                // Availability dropdown filter

            const handleDashSort = (field) => {

            // ====================================================================
            // ITEM-WISE WEFT STOCK BOOK ENGINE (MATCHING YARN RM STOCK BOOK)
            // ====================================================================
            const sbQualityOptions = useMemo(() => {

                return [...new Set(list.map(i => i.quality).filter(Boolean))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

            const sbCodeOptions = useMemo(() => {

                if (sbItemTypeFilter !== 'all') list = list.filter(i => (i.itemType || '').toLowerCase() === sbItemTypeFilter.toLowerCase());
                if (sbQualityFilter !== 'all') list = list.filter(i => (i.quality || '').toLowerCase() === sbQualityFilter.toLowerCase());
                if (sbColorFilter !== 'all') list = list.filter(i => (i.color || '').toLowerCase() === sbColorFilter.toLowerCase());
                if (sbSupplierFilter !== 'all') list = list.filter(i => (i.company || '').toLowerCase() === sbSupplierFilter.toLowerCase());
                return [...new Set(list.map(i => i.code).filter(Boolean))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            }, [enrichedInventory, sbItemTypeFilter, sbQualityFilter, sbColorFilter, sbSupplierFilter]);

            const sbColorOptions = useMemo(() => {
                let list = enrichedInventory || [];
                if (sbItemTypeFilter !== 'all') list = list.filter(i => (i.itemType || '').toLowerCase() === sbItemTypeFilter.toLowerCase());
                if (sbQualityFilter !== 'all') list = list.filter(i => (i.quality || '').toLowerCase() === sbQualityFilter.toLowerCase());
                if (sbCodeFilter !== 'all') list = list.filter(i => (i.code || '').toLowerCase() === sbCodeFilter.toLowerCase());
                if (sbSupplierFilter !== 'all') list = list.filter(i => (i.company || '').toLowerCase() === sbSupplierFilter.toLowerCase());
                return [...new Set(list.map(i => i.color).filter(Boolean))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            }, [enrichedInventory, sbItemTypeFilter, sbQualityFilter, sbCodeFilter, sbSupplierFilter]);

            const sbSupplierOptions = useMemo(() => {
                let list = enrichedInventory || [];
                if (sbItemTypeFilter !== 'all') list = list.filter(i => (i.itemType || '').toLowerCase() === sbItemTypeFilter.toLowerCase());
                if (sbQualityFilter !== 'all') list = list.filter(i => (i.quality || '').toLowerCase() === sbQualityFilter.toLowerCase());
                if (sbCodeFilter !== 'all') list = list.filter(i => (i.code || '').toLowerCase() === sbCodeFilter.toLowerCase());
                if (sbColorFilter !== 'all') list = list.filter(i => (i.color || '').toLowerCase() === sbColorFilter.toLowerCase());
                return [...new Set(list.map(i => i.company).filter(Boolean))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            }, [enrichedInventory, sbItemTypeFilter, sbQualityFilter, sbCodeFilter, sbColorFilter]);

            const stockBookGrouped = useMemo(() => {
                const rawSearch = (sbSearch || '').toLowerCase().trim();
                const searchTerms = rawSearch ? rawSearch.split(',').map(s => s.trim()).filter(Boolean) : [];
                const groups = [];

                (enrichedInventory || []).forEach(item => {
                    // Item type filter
                    if (sbItemTypeFilter !== 'all' && (item.itemType || '').toLowerCase() !== sbItemTypeFilter.toLowerCase()) return;

                    // Quality filter
                    if (sbQualityFilter !== 'all' && (item.quality || '').toLowerCase() !== sbQualityFilter.toLowerCase()) return;

                    // Code filter
                    if (sbCodeFilter !== 'all' && (item.code || '').toLowerCase() !== sbCodeFilter.toLowerCase()) return;

                    // Color filter
                    if (sbColorFilter !== 'all' && (item.color || '').toLowerCase() !== sbColorFilter.toLowerCase()) return;

                    // Supplier filter
                    if (sbSupplierFilter !== 'all' && (item.company || '').toLowerCase() !== sbSupplierFilter.toLowerCase()) return;

                    // Group boxes by challan + lotNumber
                    const lotsMap = new Map();

                    (item.boxes || []).forEach(box => {
                        const ch = box.challan || box.challanNumber || 'Unknown';
                        const lotNo = box.lotNumber || '—';
                        const lotKey = `${ch}___${lotNo}`;

                        if (!lotsMap.has(lotKey)) {
                            lotsMap.set(lotKey, {
                                id: lotKey,
                                challan: ch,
                                lotNumber: lotNo,
                                supplier: item.company || '—',
                                receiveDate: box.arrivalDate || '',
                                boxes: []
                            });
                        }

                        const gross = parseFloat(box.totalWeight || box.stock) || 0;
                        const gr = parseFloat(box.returnedWeight || box.grWeight) || 0;
                        const remaining = Math.max(0, parseFloat(box.remainingKg !== undefined ? box.remainingKg : (gross - (box.issuedKg || 0) - gr)) || 0);
                        const issued = parseFloat(box.issuedKg) || 0;
                        const cones = parseInt(box.cones, 10) || 0;
                        const grCones = parseInt(box.grCones, 10) || 0;
                        const remainingCones = Math.max(0, parseInt(box.remainingCones !== undefined ? box.remainingCones : (cones - grCones - (parseInt(box.issuedCones, 10) || 0)), 10) || 0);

                        const isFullyGr = (gr > 0 && gr >= gross - 0.001 && gross > 0) || (remaining <= 0.001 && issued <= 0.001 && gr > 0.001);
                        const isPartialGr = gr > 0.001 && !isFullyGr;
                        const effectiveStatus = isFullyGr ? 'gr' : (remaining <= 0.001 && issued > 0.001 ? 'issued' : 'available');

                        const lastIssue = (box.issues && box.issues.length > 0) ? box.issues[box.issues.length - 1] : null;

                        lotsMap.get(lotKey).boxes.push({
                            ...box,
                            uniqueKey: `${item.id}-${ch}-${box.boxNumber}`,
                            quality: item.quality,
                            code: item.code,
                            color: item.color,
                            supplier: item.company,
                            grossWeight: gross,
                            grWeight: gr,
                            remainingWeight: remaining,
                            issuedWeight: issued,
                            cones,
                            grCones,
                            remainingCones,
                            effectiveStatus,
                            isFullyGr,
                            isPartialGr,
                            issueDate: lastIssue ? (lastIssue.date ? lastIssue.date.split('T')[0] : '') : '',
                            issuedTo: lastIssue ? (lastIssue.details || 'Weaving Dept') : '',
                            grDate: box.returnedDate || ''
                        });
                    });

                    const filteredLots = [];
                    let qTotalBoxes = 0;
                    let qAvailBoxes = 0;
                    let qAvailWeight = 0;
                    let qIssuedWeight = 0;
                    let qGrWeight = 0;

                    for (const lot of lotsMap.values()) {
                        const matchingBoxes = lot.boxes.filter(b => {
                            if (sbStatusFilter === 'available' && b.effectiveStatus !== 'available') return false;
                            if (sbStatusFilter === 'issued' && b.effectiveStatus !== 'issued') return false;
                            if (sbStatusFilter === 'gr' && b.effectiveStatus !== 'gr' && !b.isPartialGr) return false;

                            if (sbMobileFilter === 'available' && b.effectiveStatus !== 'available') return false;
                            if (sbMobileFilter === 'issued' && b.effectiveStatus !== 'issued') return false;
                            if (sbMobileFilter === 'gr' && b.effectiveStatus !== 'gr' && !b.isPartialGr) return false;

                            if (sbFromDate || sbToDate) {
                                const boxDates = [
                                    lot.receiveDate,
                                    b.arrivalDate,
                                    b.issueDate,
                                    b.grDate
                                ].filter(Boolean);

                                const matchesRange = boxDates.some(dStr => {
                                    const d = dStr.includes('T') ? dStr.split('T')[0] : dStr.split(' ')[0];
                                    if (sbFromDate && d < sbFromDate) return false;
                                    if (sbToDate && d > sbToDate) return false;
                                    return true;
                                });

                                if (!matchesRange) return false;
                            }

                            if (searchTerms.length > 0) {
                                const boxMatches = searchTerms.some(term => {
                                    return (item.quality || '').toLowerCase().includes(term) ||
                                           (item.code || '').toLowerCase().includes(term) ||
                                           (item.color || '').toLowerCase().includes(term) ||
                                           (item.company || '').toLowerCase().includes(term) ||
                                           (lot.lotNumber || '').toLowerCase().includes(term) ||
                                           (lot.challan || '').toLowerCase().includes(term) ||
                                           String(b.boxNumber || '').toLowerCase().includes(term);

                                if (!boxMatches) return false;
                            }

                            return true;
                        });

                        if (matchingBoxes.length > 0) {
                            let lotAvailWeight = 0;
                            let lotAvailBoxes = 0;
                            let lotGrWeight = 0;
                            let lotIssuedWeight = 0;

                            matchingBoxes.forEach(b => {

                                if (b.effectiveStatus === 'available') {
                                    lotAvailBoxes++;
                                    lotAvailWeight += b.remainingWeight;
                                    qAvailBoxes++;
                                    qAvailWeight += b.remainingWeight;
                                } else if (b.effectiveStatus === 'issued') {
                                    lotIssuedWeight += (b.issuedWeight || b.remainingWeight);
                                    qIssuedWeight += (b.issuedWeight || b.remainingWeight);
                                } else if (b.effectiveStatus === 'gr') {
                                    lotGrWeight += (b.grWeight || b.grossWeight);
                                    qGrWeight += (b.grWeight || b.grossWeight);
                                }
                                if (b.isPartialGr && b.effectiveStatus !== 'gr') {
                                    lotGrWeight += b.grWeight;
                                    qGrWeight += b.grWeight;
                                }
                            });

                            filteredLots.push({
                                ...lot,
                                boxes: matchingBoxes,
                                lotAvailWeight,
                                lotAvailBoxes,
                                lotGrWeight,
                                lotIssuedWeight
                            });
                        }
                    }

                    if (filteredLots.length > 0) {
                        groups.push({
                            ...item,
                            lots: filteredLots,
                            qTotalBoxes,
                            qAvailBoxes,
                            qAvailWeight,
                            qIssuedWeight,
                            qGrWeight,
                            isCompleted: qAvailBoxes === 0 && qTotalBoxes > 0
                        });
                    }
                });

                return groups.sort((a, b) => {
                    if (a.qAvailBoxes > 0 && b.qAvailBoxes === 0) return -1;
                    if (a.qAvailBoxes === 0 && b.qAvailBoxes > 0) return 1;
                    return (a.quality || '').localeCompare(b.quality || '', undefined, { numeric: true, sensitivity: 'base' });

            }, [enrichedInventory, sbSearch, sbFromDate, sbToDate, sbStatusFilter, sbItemTypeFilter, sbQualityFilter, sbCodeFilter, sbColorFilter, sbSupplierFilter, sbMobileFilter]);

            const stockBookKPIs = useMemo(() => {

                let grBoxesCount = 0;
                let grBoxesWeight = 0;
                let activeQualitiesCount = 0;
                const activeLotsSet = new Set();

                    if (group.qAvailBoxes > 0) activeQualitiesCount++;

                        activeLotsSet.add(lot.id);

                            totalBoxesCount++;
                            totalBoxesWeight += b.grossWeight;

                            if (b.isPartialGr && b.effectiveStatus !== 'gr') {

                            }
                        });
                    });
                });

                            updated.box = boxNumber;

            const getFilteredOptionsForRow = (row, field) => {
                let filtered = inventory;
                if (row.quality && field !== 'quality') filtered = filtered.filter(i => i.quality === row.quality);
                if (row.supplier && field !== 'supplier') filtered = filtered.filter(i => i.company === row.supplier);
                if (row.code && field !== 'code') filtered = filtered.filter(i => i.code === row.code);
                if (row.color && field !== 'color') filtered = filtered.filter(i => i.color === row.color);

                if (field === 'box') {
                    const options = [];
                    const seen = new Set();
                    filtered.flatMap(item => item.boxes || [])
                        .map(box => {
                            const issuedCones = (box.issues || []).reduce((sum, issue) => sum + (parseInt(issue.cones) || 0), 0);
                            const remainingCones = (parseInt(box.openingStockCones) || 0) - issuedCones;
                            return { ...box, remainingCones };
                        })
                        .filter(box => box.remainingCones > 0)
                        .forEach(box => {
                            const label = `${box.boxNumber} [${box.remainingCones} cones]`;
                            if (!seen.has(label)) {
                                options.push({ label, value: box.boxNumber });
                                seen.add(label);
                            }
                        });
                    return options;
                }

                const valueField = field === 'supplier' ? 'company' : field;
                return [...new Set(filtered.map(i => i[valueField]).filter(Boolean))].sort();
            };

            const handleAddIndividualIssue = (e) => {
                e.preventDefault();

                const newIssues = [];
                const boxUsage = {}; // Track cones used in this batch per box

                for (const row of multiIssueForm) {
                    if (!row.box || !row.date || !row.quality || !row.code || !row.supplier) {
                        alert('Please fill in all required fields (Date, Quality, Supplier, Code, Box) for all entries.');
                        return;
                    }

                    let foundBox = null;
                    for (const item of inventory) {
                        if (item.quality === row.quality && item.company === row.supplier && item.code === row.code && item.color === row.color) {
                            const box = item.boxes?.find(b => b.boxNumber === row.box);
                            if (box) { foundBox = box; break; }
                        }
                    }

                    if (!foundBox) {
                        alert(`Box number "${row.box}" not found for quality "${row.quality}" from supplier "${row.supplier}" code "${row.code}".`);
                        return;
                    }

                    const boxKey = `${row.quality}|${row.supplier}|${row.code}|${row.box}`;
                    const existingIssuedCones = (foundBox.issues || []).reduce((sum, issue) => sum + (parseInt(issue.cones) || 0), 0);
                    const remainingCones = (parseInt(foundBox.openingStockCones) || 0) - existingIssuedCones;

                    const newIssueCones = parseFloat(row.cones) || 0;
                    const batchUsedSoFar = boxUsage[boxKey] || 0;

                    if (newIssueCones + batchUsedSoFar > remainingCones) {
                        alert(`Insufficient stock in Box "${row.box}" for one of the entries (Remaining: ${remainingCones}, requested in batch: ${newIssueCones + batchUsedSoFar}).`);
                        return;
                    }

                    boxUsage[boxKey] = batchUsedSoFar + newIssueCones;

                    newIssues.push({
                        id: (Date.now() + Math.random()).toString(),
                        date: addTimestampToDate(row.date),
                        quality: row.quality,
                        supplier: row.supplier,
                        code: row.code,
                        color: row.color,
                        box: row.box,
                        challan: foundBox.challan,
                        cones: parseFloat(row.cones) || 0,
                        net: parseFloat(row.net) || 0,
                        details: row.details || ''
                    });
