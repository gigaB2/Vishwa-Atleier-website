<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../../assets/config.js"></script>
    <script src="../../assets/supabase-client.js"></script>
    <script src="../../assets/fy-engine.js"></script>


    <script>
        (function () {
            /* clear check disabled */
            const isDark = localStorage.getItem('vishwa_fashions_theme') === 'true' ||
                (localStorage.getItem('vishwa_fashions_theme') === null && true);
            if (isDark) {
                document.documentElement.classList.add('dark-mode');
            } else {
                document.documentElement.classList.remove('dark-mode');
            }
            const isCollapsed = localStorage.getItem('vf_sidebar_collapsed') === 'true';
            if (isCollapsed) {
                document.documentElement.classList.add('vf-sidebar-collapsed');
            }
        })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RM Warp Stock Book — Vishwa Fashions</title>
    <!-- React & Babel Standalone -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg: #F9FAFB;
            --surface: #ffffff;
            --fg: #1a1a2e;
            --muted: #8b8fa3;
            --border: #e8e7f1;
            --accent: #8b5cf6;
            --accent2: #ec4899;
            --accent3: #f97316;
            --error: #ef4444;
            --success: #10b981;

            --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;

            --radius: 16px;
            --container: 1300px;

            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.12);

            --transition-fast: 0.15s ease;
            --transition-base: 0.25s ease;
            --transition-slow: 0.4s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 4px;
            border: 2px solid var(--bg);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--accent2), var(--accent));
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            transition: background 0.3s ease;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #000000 0%, #0a0a0a 50%, #0f0f1a 100%);
            --bg: #000000;
            --surface: #0a0a0a;
            --fg: #ffffff;
            --muted: #a1a1aa;
            --border: #27272a;
            --accent: #7c3aed;
        }

        /* Dark Mode for Inputs, Textareas, and Dropdowns */
        body.dark-mode input:not([type="checkbox"]):not([type="radio"]):not(.bg-transparent),
        body.dark-mode textarea:not(.bg-transparent),
        body.dark-mode select:not(.bg-transparent),
        body.dark-mode .input-field {
            background-color: var(--surface) !important;
            color: var(--fg) !important;
            border-color: var(--border) !important;
        }

        body.dark-mode input,
        body.dark-mode select,
        body.dark-mode textarea,
        body.dark-mode .input-field {
            color-scheme: dark !important;
        }

        body.dark-mode select option {
            background-color: #0a0a0a !important;
            color: var(--fg) !important;
        }

        body.dark-mode input::placeholder,
        body.dark-mode textarea::placeholder {
            color: var(--muted) !important;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            max-width: var(--container);
            margin: 0 auto;
            padding: 1rem 2rem;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0 1.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
            opacity: 0.5;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .nav-tabs {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .nav-tab {
            padding: 0.6rem 1.25rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            border: 1px solid transparent;
            font-family: var(--font-body);
            color: var(--muted);
        }

        .nav-tab:hover {
            color: var(--accent);
            background: rgba(139, 92, 246, 0.05);
        }

        .nav-tab.active {
            color: var(--accent);
            background: rgba(139, 92, 246, 0.1);
            border-color: var(--accent);
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            transition: transform var(--transition-base), box-shadow var(--transition-base);
            position: relative;
            margin-bottom: 1.5rem;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            border: none;
            font-family: var(--font-body);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--fg);
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 2px solid var(--border);
            background: var(--surface);
            color: var(--fg);
            font-family: var(--font-body);
            transition: all var(--transition-fast);
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }

        /* Tables */
        .table-container {
            overflow: hidden;
            position: relative;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .table-container::-webkit-scrollbar {
            height: 10px;
        }

        .table-container::-webkit-scrollbar-track {
            background: var(--bg);
            border-radius: 5px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 5px;
        }

        .table-container::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .table-container table {
            width: 100%;
        }

        .table-container tr {
            display: flex;
            width: 100%;
        }

        .table-container th,
        .table-container td {
            flex: 1;
            min-width: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6rem 0.4rem !important;
            font-size: 0.8rem !important;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .table-container th {
            white-space: normal;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: center;
            padding: 0.5rem;
            border-bottom: 2px solid var(--border);
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--muted);
            background: rgba(139, 92, 246, 0.02);
        }

        td {
            padding: 0.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            text-align: center;
        }

        .badge {
            display: inline-flex;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .badge-available {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .badge-on-loom {
            background: rgba(139, 92, 246, 0.1);
            color: var(--accent);
        }

        .badge-completed {
            background: rgba(139, 143, 163, 0.1);
            color: var(--muted);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 26, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: var(--surface);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 800px;
            box-shadow: var(--shadow-xl);
            max-height: 90vh;
            overflow-y: auto;
        }

        .double-bezel {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--border);
            padding: 6px;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(16px);
            transition: all 0.6s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .double-bezel-inner {
            background: var(--surface);
            border-radius: 18px;
            border: 1px solid var(--border);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.03);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .timeline {
            position: relative;
            padding: 1.5rem 0;
            margin: 1.5rem 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            top: 20px;
            bottom: 20px;
            left: 25px;
            width: 4px;
            background: var(--border);
            border-radius: 2px;
        }

        .timeline-item {
            position: relative;
            margin: 2rem 0;
            clear: both;
        }

        .timeline-item::after {
            content: '';
            display: table;
            clear: both;
        }

        .timeline-item:first-child {
            margin-top: 0;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            top: 10px;
            left: 12px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 4px solid var(--surface) !important;
            box-shadow: 0 0 0 1px var(--border), 0 4px 10px rgba(0, 0, 0, 0.1);
            z-index: 2;
        }

        .timeline-content {
            position: relative;
            margin-left: 60px;
            background: var(--surface) !important;
            border: 1px solid var(--border) !important;
            border-radius: 12px !important;
            padding: 1.25rem !important;
            box-shadow: var(--shadow-sm);
        }

        .timeline-content::before {
            content: '';
            position: absolute;
            top: 18px;
            left: -6px;
            width: 10px;
            height: 10px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            transform: rotate(45deg);
            z-index: 1;
        }

        .timeline-date {
            display: inline-block;
            color: var(--muted);
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            font-family: monospace;
        }

        /* End timeline styles */

        /* Searchable Dropdown Styles (from Weft) */
        .select-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .select-input-wrapper i {
            position: absolute;
            right: 1.25rem;
            pointer-events: none;
            color: var(--muted);
            font-size: 1rem;
            font-style: normal;
        }

        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 12px;
            margin-top: 0.5rem;
            box-shadow: var(--shadow-xl);
            z-index: 10000;
            max-height: 250px;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .dropdown-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            color: var(--fg);
            border-bottom: 1px solid var(--border);
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background: rgba(139, 92, 246, 0.1);
            color: var(--accent);
        }

        .dropdown-item.clear-item {
            color: var(--muted);
            font-style: italic;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.02);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .search-bar {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
            align-items: flex-end;
            flex-wrap: wrap;
            width: 100%;
            max-width: 100%;
        }

        .search-bar>div {
            flex: 1;
            min-width: 0;
        }

        .search-bar input,
        .search-bar select {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        /* --- Clickable Row Hover Highlights --- */
        .clickable-row {
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .clickable-row:hover td {
            background: rgba(99, 102, 241, 0.08) !important;
        }

        .clickable-row:active td {
            background: rgba(99, 102, 241, 0.16) !important;
        }

        .app-container.dark-mode .clickable-row:hover td {
            background: rgba(99, 102, 241, 0.18) !important;
        }

        .app-container.dark-mode .clickable-row:active td {
            background: rgba(99, 102, 241, 0.28) !important;
        }

        .warp-filter-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .warp-filter-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .warp-filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            width: 100%;
            max-width: 100%;
        }

        .warp-ledger-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .warp-tracker-layout {
            display: flex;
            gap: 1.5rem;
            height: calc(100vh - 160px);
            min-height: 480px;
            width: 100%;
            max-width: 100%;
        }

        .warp-tracker-sidebar {
            width: 310px;
            display: flex;
            flex-direction: column;
            margin: 0;
            flex-shrink: 0;
        }

        .warp-loom-card {
            box-sizing: border-box;
            width: 100%;
            max-width: 100%;
            min-width: 0;
        }

        .warp-loom-card.has-beam {
            min-height: 390px;
            padding-bottom: 0.65rem;
        }

        .warp-loom-card:not(.has-beam) {
            min-height: 280px;
        }

        .warp-loom-card.has-beam .warp-loom-card-actions {
            position: relative;
            z-index: 2;
        }

        .warp-loom-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
            gap: 1rem;
            justify-content: stretch;
            width: 100%;
        }

        .warp-loom-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 10px 1.5rem;
            min-width: 0;
        }

        .warp-loom-toolbar {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
            width: 100%;
        }

        .warp-loom-toolbar h3 {
            margin: 0;
            text-align: center;
        }

        .warp-status-toggle {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            min-width: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        .warp-status-toggle .btn {
            flex: 1 1 0;
            min-width: 0;
            min-height: 40px;
            padding: 0.45rem 0.5rem;
            font-size: 0.78rem;
            background: transparent;
            border: none;
            box-shadow: none;
            color: var(--muted);
            border-radius: 8px;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .warp-status-toggle .btn.active {
            background: var(--surface);
            color: var(--accent);
            box-shadow: var(--shadow-sm);
            font-weight: 700;
        }

        .warp-tracker-beam-card {
            padding: 1rem;
            border-radius: 16px;
            border: 2px dashed var(--border);
            background: var(--bg);
            transition: all 0.2s ease;
            width: 100%;
            max-width: 100%;
            margin: 0 0 1rem 0;
            display: flex;
            flex-direction: column;
            position: relative;
            box-sizing: border-box;
            min-height: 250px;
            height: auto;
            overflow: visible;
        }

        .warp-tracker-beam-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 10px 1.5rem;
            min-width: 0;
        }

        .warp-beam-cards {
            display: none;
        }

        @media (max-width: 1024px) {
            .app-container {
                padding: 0.5rem 1rem 2rem;
                max-width: 100%;
                min-width: 0;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
                padding: 0.75rem 0 1.25rem;
                margin-bottom: 1.25rem;
            }

            .logo-section {
                flex-direction: column;
                align-items: flex-start;
                width: 100%;
                gap: 0.5rem;
            }

            .logo {
                font-size: clamp(1.25rem, 4.5vw, 1.7rem);
                line-height: 1.2;
            }

            .nav-tabs {
                display: none;
                /* sidebar drawer owns navigation on tablet/phone */
            }

            .warp-filter-toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 0.85rem;
            }

            .warp-filter-actions {
                width: 100%;
            }

            .warp-filter-actions .btn {
                flex: 1 1 calc(50% - 0.5rem);
                justify-content: center;
                min-height: 40px;
            }

            .warp-filter-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            }

            .warp-ledger-head {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1rem;
            }

            .warp-dashboard .stats-grid .card {
                padding: 1rem 1.1rem;
            }

            .warp-dashboard-search {
                padding: 0.85rem !important;
                margin-bottom: 1rem !important;
            }

            .warp-dashboard-search input {
                width: 100% !important;
                max-width: 100% !important;
                box-sizing: border-box !important;
                font-size: 16px !important;
            }

            /* Dashboard beam lists: cards on tablet/phone, table on desktop */
            .warp-dashboard .table-container.warp-desktop-table {
                display: none !important;
            }

            .warp-beam-cards {
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
            }

            .warp-beam-card {
                border: 1.5px solid var(--border);
                border-radius: 12px;
                padding: 0.9rem 1rem;
                background: var(--surface);
                cursor: pointer;
                transition: border-color 0.15s ease, box-shadow 0.15s ease;
            }

            .warp-beam-card:active {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
            }

            .warp-beam-card-top {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 0.75rem;
                margin-bottom: 0.45rem;
            }

            .warp-beam-no {
                font-weight: 700;
                color: var(--accent);
                font-size: 1rem;
            }

            .warp-beam-meters {
                font-weight: 600;
                color: var(--fg);
                font-size: 0.9rem;
                white-space: nowrap;

        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // --- Debugging & Error Handling ---
        window.onerror = function (message, source, lineno, colno, error) {
            const errorDiv = document.createElement('div');
            errorDiv.style.padding = '20px';
            errorDiv.style.background = '#fee2e2';
            errorDiv.style.color = '#991b1b';
            errorDiv.style.border = '2px solid #ef4444';
            errorDiv.style.margin = '20px';
            errorDiv.style.borderRadius = '8px';
            errorDiv.style.fontFamily = 'monospace';
            errorDiv.style.whiteSpace = 'pre-wrap';
            errorDiv.innerHTML = `<h3>⚠️ Application Error</h3><p>${message}</p><small>at ${source}:${lineno}:${colno}</small>`;
            document.body.prepend(errorDiv);
            return false;
        };

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{ padding: '40px', textAlign: 'center' }}>
                            <h2 style={{ color: '#ef4444' }}>Something went wrong.</h2>
                            <p style={{ color: '#666', margin: '10px 0' }}>{this.state.error?.message}</p>
                            <button className="btn btn-primary" onClick={() => window.location.reload()}>Reload Page</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // Custom Hook for LocalStorage
        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    if (!item) return window.localStorage.getItem('vishwa_fashions_factory_reset_active') === 'true' && Array.isArray(initialValue) ? [] : initialValue;
                    let parsed = JSON.parse(item);
                    if (window.localStorage.getItem('vishwa_fashions_factory_reset_active') !== 'true') {
                        if (Array.isArray(parsed) && parsed.length === 0 && Array.isArray(initialValue) && initialValue.length > 0) {
                            return initialValue;
                        }
                    }
                    if (key === 'warp-beams' && Array.isArray(parsed)) {
                        parsed = parsed.map(b => {
                            if (b.machineNumber && b.status === 'Available') {
                                return { ...b, status: 'On Loom' };
                            }
                            return b;
                        });
                    }
                    return (parsed !== null && parsed !== undefined) ? parsed : initialValue;
                } catch (error) {
                    return initialValue;
                }
            });

            useEffect(() => {
                const handleStorageChange = (e) => {
                    if (e.key === key) {
                        try {
                            const item = window.localStorage.getItem(key);
                            let newValue = item ? JSON.parse(item) : initialValue;
                            if (key === 'warp-beams' && Array.isArray(newValue)) {
                                newValue = newValue.map(b => {
                                    if (b.machineNumber && b.status === 'Available') {
                                        return { ...b, status: 'On Loom' };
                                    }
                                    return b;
                                });
                            }
                            setStoredValue(newValue);
                        } catch (error) {
                            console.error('Error parsing storage change:', error);
                        }
                    }
                };
                window.addEventListener('storage', handleStorageChange);
                return () => window.removeEventListener('storage', handleStorageChange);
            }, [key, initialValue]);

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    let processedValue = valueToStore;
                    if (key === 'warp-beams' && Array.isArray(processedValue)) {
                        processedValue = processedValue.map(b => {
                            if (b.machineNumber && b.status === 'Available') {
                                return { ...b, status: 'On Loom' };
                            }
                            return b;
                        });
                    }
                    setStoredValue(processedValue);
                    window.localStorage.setItem(key, JSON.stringify(processedValue));
                } catch (error) { }
            };

            return [storedValue, setValue];
        }

        const addTimestampToDate = (dateStr) => {
            if (!dateStr) return dateStr;
            if (dateStr.includes('T') || dateStr.includes(':') || dateStr.length > 10) {
                return dateStr;
            }
            const now = new Date();
            const pad = (num) => String(num).padStart(2, '0');
            const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}.${String(now.getMilliseconds()).padStart(3, '0')}`;
            return `${dateStr}T${timeStr}`;
        };

        const formatDate = (dateStr) => {
            if (!dateStr || dateStr === '—') return '—';
            const dateOnly = dateStr.includes('T') ? dateStr.split('T')[0] : dateStr.split(' ')[0];
            const parts = dateOnly.split(/[-/]/);
            if (parts.length !== 3) return dateStr;
            if (parts[0].length === 4) {
                // yyyy-mm-dd -> dd-mm-yyyy
                return `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
            return dateOnly;

        const SearchableDropdown = ({ options, value, onChange, placeholder, label }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [search, setSearch] = useState('');
            const dropdownRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
                        setIsOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const filteredOptions = options.filter(opt =>
                (opt || '').toString().toLowerCase().includes(search.toLowerCase())
            );

            return (
                <div className="input-group" ref={dropdownRef} style={{ position: 'relative' }}>
                    <label>{label}</label>
                    <div className="select-input-wrapper">
                        <input
                            type="text"
                            placeholder={placeholder}
                            value={isOpen ? search : (value || '')}
                            onChange={(e) => setSearch(e.target.value)}
                            onClick={() => {
                                if (!isOpen) {
                                    setIsOpen(true);
                                    setSearch('');
                                }
                            }}
                            readOnly={!isOpen}
                            style={{ cursor: 'pointer' }}
                        />
                        <i style={{ cursor: 'pointer' }} onClick={() => setIsOpen(!isOpen)}>{isOpen ? '▴' : '▾'}</i>
                    </div>
                    {isOpen && (
                        <div className="dropdown-list">
                            <div className="dropdown-item clear-item" onClick={() => { onChange(''); setIsOpen(false); }}>-- Clear Selection --</div>
                            {filteredOptions.map(opt => (
                                <div key={opt} className="dropdown-item" onClick={() => { onChange(opt); setIsOpen(false); }}>{opt}</div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const getFinancialYearForDate = (dateStr) => {
            if (!dateStr) return null;
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return null;
            const year = date.getFullYear();
            const month = date.getMonth();
            if (month >= 3) {
                return `${year}-${(year + 1).toString().slice(-2)}`;
            } else {
                return `${year - 1}-${year.toString().slice(-2)}`;
            }
        };

        const getFYDateRange = (fy) => {
            if (!fy || fy === 'All') return { start: null, end: null };
            const parts = fy.split('-');
            const startYear = parseInt(parts[0]);
            return {
                start: `${startYear}-04-01`,
                end: `${startYear + 1}-03-31`
            };
        };

                if (undoStack.length === 0) return;
                const lastSnapshot = undoStack[undoStack.length - 1];
                const { beams: prevBeams, issues: prevIssues, beamLoadings: prevBeamLoadings } = JSON.parse(lastSnapshot);

                setBeams(prevBeams);
                setIssues(prevIssues);
                if (prevBeamLoadings) setBeamLoadings(prevBeamLoadings);
                setUndoStack(prev => prev.slice(0, -1));
                console.log("Undo performed");
            };

            const getPissingDetails = (beam) => {
                if (!beam) return { date: '—', person: '—' };
                const hist = beam.history || [];
                let lastLoad = null;
                for (let i = hist.length - 1; i >= 0; i--) {
                    const e = (hist[i].event || '').toLowerCase();
                    if (e.includes('loaded on') || e.includes('pissing on') || e.includes('piecing on') || e.includes('jala piecing')) {
                        lastLoad = hist[i];
                        break;
                    }
                }
                if (!lastLoad) return { date: '—', person: '—' };
                let person = '—';
                if (lastLoad.event) {
                    const eventText = lastLoad.event;
                    if (/jala piecing by/i.test(eventText)) {
                        const match = eventText.match(/Jala Piecing by (.+?) on (?:Machine\s+)?(.+)$/i);
                        if (match && match[1]) person = match[1].trim();
                    } else {
                        const match = eventText.match(/(?:Loaded on|Pissing on|Jala Piecing on) (?:Machine\s+)?(.+?)(?:\s+by\s+(.+))?$/i);
                        if (match && match[2]) person = match[2].trim();
                    }
                }
                return { date: lastLoad.date, person };
            };

            const getBeamTimeline = (beam) => {
                if (!beam) return [];

                const beamNumStr = String(beam.beamNumber);

                const beamLogs = (productionLogs || []).filter(l => String(l.beamNumber) === beamNumStr);
                const loadingsList = (beamLoadings || []).filter(bl => String(bl.beamNumber) === beamNumStr);

                // 1. Structured derived setup events from Beam Loading module
                const loadingEvents = [];
                loadingsList.forEach(bl => {
                    const roles = [];
                    if (bl.piecein) roles.push({ role: 'Piece In', worker: bl.piecein });
                    if (bl.drawingIn) roles.push({ role: 'Drawing In', worker: bl.drawingIn });
                    if (bl.fani) roles.push({ role: 'Fani (Reed)', worker: bl.fani });
                    if (bl.dropPinJog) roles.push({ role: 'Drop pin/Jog', worker: bl.dropPinJog });

                    if (roles.length === 0) {
                        roles.push({ role: 'Beam Loading', worker: bl.workerName || 'Worker' });
                    }

                    const mNameStr = String(bl.machineNumber || '');
                    const mDisp = mNameStr ? (mNameStr.toLowerCase().includes('machine') ? mNameStr : `Machine ${mNameStr}`) : 'Machine';

                    roles.forEach(r => {
                        loadingEvents.push({
                            date: bl.date,
                            event: `${r.role} by ${r.worker} on ${mDisp}`,
                            type: 'beam-loading',
                            category: 'derived',
                            machineNumber: bl.machineNumber
                        });
                    });
                });

                // 2. Format history events (Beam Creation, Beam Loaded, Beam Cut Off)
                const historyEvents = (beam.history || [])
                    .map((h, idx) => ({ ...h, historyIndex: idx, category: 'history', type: h.type || 'system' }))
                    .filter(h => {
                        const e = (h.event || '').toLowerCase();
                        if (e.includes('sync from production sheet')) return false;
                        if (e.includes('was removed') || e.includes('returned to available')) return false;
                        if (e.includes('limbo')) return false;
                        return true;
                    })
                    .map(h => {
                        let event = h.event || '';
                        if (event === 'Beam Created' || event === 'Beam manufactured') {
                            event = `Beam manufactured by ${beam.warpingPerson || 'Unknown'}`;
                        }

                        const metaParts = [];
                        if (h.reason && !event.toLowerCase().includes(h.reason.toLowerCase())) {
                            metaParts.push(`Reason: ${h.reason}`);
                        }
                        if (h.decisionBy && !event.toLowerCase().includes(h.decisionBy.toLowerCase())) {
                            metaParts.push(`Decision By: ${h.decisionBy}`);
                        }

                        if (metaParts.length > 0) {
                            const metaStr = metaParts.join(' | ');
                            if (!event.includes(metaStr)) {
                                if (event.includes('(')) {
                                    event = `${event.slice(0, -1)} | ${metaStr})`;
                                } else {
                                    event = `${event} (${metaStr})`;
                                }
                            }
                        }
                        return { ...h, event };
                    });

                const normMach = s => String(s || '').toLowerCase().replace(/^machine\s*/i, '').trim();

                const matchMachine = (mNum, mach) => {
                    if (!mNum || !mach) return false;
                    const target = normMach(mNum);
                    const mId = normMach(mach.id);
                    const mName = normMach(mach.name);
                    if (target === mId || target === mName) return true;

                    const allMachines = typeof machines !== 'undefined' && machines.length > 0 ? machines : JSON.parse(localStorage.getItem('machines') || '[]');
                    const found = allMachines.find(m => normMach(m.id) === target || normMach(m.name) === target);
                    if (found) {
                        const fId = normMach(found.id);
                        const fName = normMach(found.name);
                        return fId === mId || fName === mId || fId === mName || fName === mName;
                    }
                    return false;
                };

                // Helper to extract machine object or name from event text
                const getMachineFromEvent = (eventStr) => {
                    if (!eventStr) return null;
                    const lower = eventStr.toLowerCase();
                    const allMachines = typeof machines !== 'undefined' && machines.length > 0 ? machines : JSON.parse(localStorage.getItem('machines') || '[]');
                    const sortedMachines = [...allMachines].sort((a, b) => (b.name || '').length - (a.name || '').length);
                    for (const m of sortedMachines) {
                        const mNameEscaped = String(m.name).replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                        const mIdEscaped = String(m.id).replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                        const regex1 = new RegExp(`(?:machine|loom|no\\.?|on|from|completed on|unloaded from)\\s*(?:machine\\s+)?(?:\\b${mNameEscaped}\\b|\\b${mIdEscaped}\\b)`, 'i');
                        const regex2 = new RegExp(`(?:\\b${mNameEscaped}\\b|\\b${mIdEscaped}\\b)`, 'i');
                        if (regex1.test(lower) || regex2.test(lower)) {
                            return m;
                        }
                    }
                    const match = lower.match(/(?:machine|loom|no\.?)\s*(\w+)/i);
                    if (match) {
                        const found = allMachines.find(m => normMach(m.id) === normMach(match[1]) || normMach(m.name) === normMach(match[1]));
                        return found || { id: match[1], name: match[1] };
                    }
                    return null;
                };

                // 3. Separate history into pre-cycle events (Creation/Warping) and cycles
                const preCycleEvents = [];
                const cycles = [];

                historyEvents.forEach(item => {
                    const evt = (item.event || '').toLowerCase();
                    const isManufacturing = evt.includes('manufactured') || evt.includes('manufacture') || evt.includes('created') || evt.includes('warped') || evt.includes('warping') || item.type === 'warp';
                    const isLoad = (evt.includes('beam loaded') || evt.includes('loaded on') || evt.includes('assigned to') || evt.includes('jala piecing') || evt.includes('pissing')) && !evt.includes('unloaded') && !evt.includes('cut off') && !evt.includes('cut from');

                    if (isManufacturing) {
                        preCycleEvents.push(item);
                    } else if (isLoad) {
                        const mach = getMachineFromEvent(item.event) || { id: 'Unknown', name: 'Unknown' };
                        cycles.push({
                            machine: mach,
                            startEvent: item,
                            startDate: item.date,
                            endDate: null,
                            setupEvents: [],
                            logs: [],
                            cutEvents: []
                        });
                    }
                });

                // Fallback & Auto-Discovery of Cycles for machines with loading events or production logs
                loadingEvents.forEach(le => {
                    const leMNum = le.machineNumber || (le.machine ? le.machine.name : '');
                    if (!leMNum) return;
                    const leDate = le.date || beam.createdAt || '2026-01-01';
                    const exists = cycles.some(c => matchMachine(leMNum, c.machine) && (leDate >= c.startDate && (!c.endDate || c.endDate === '9999-12-31' || leDate <= c.endDate)));
                    if (!exists) {
                        const mach = getMachineFromEvent(`Machine ${leMNum}`) || { id: String(leMNum), name: String(leMNum) };
                        cycles.push({
                            machine: mach,
                            startEvent: { date: leDate, event: `Beam Assigned / Setup on Machine ${mach.name}`, type: 'machine', historyIndex: 900 },
                            startDate: leDate,
                            endDate: null,
                            setupEvents: [],
                            logs: [],
                            cutEvents: []
                        });
                        cycles.sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));
                    }
                });

                beamLogs.forEach(log => {
                    const logMNum = log.machineNumber;
                    if (!logMNum) return;
                    const logDate = log.productionDate || log.pissingDate || log.date || beam.createdAt || '2026-01-01';
                    const exists = cycles.some(c => matchMachine(logMNum, c.machine) && (logDate >= c.startDate && (!c.endDate || c.endDate === '9999-12-31' || logDate <= c.endDate)));
                    if (!exists) {
                        const mach = getMachineFromEvent(`Machine ${logMNum}`) || { id: String(logMNum), name: String(logMNum) };
                        cycles.push({
                            machine: mach,
                            startEvent: { date: logDate, event: `Production Cycle on Machine ${mach.name}`, type: 'machine', historyIndex: 901 },
                            startDate: logDate,
                            endDate: null,
                            setupEvents: [],
                            logs: [],
                            cutEvents: []
                        });
                        cycles.sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));
                    }
                });

                // Ensure cycles are strictly sorted in chronological order
                cycles.sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));

                // Assign end dates and collect all events in each cycle (cuts, unloads, completion & setup items)
                cycles.forEach((cycle, cIdx) => {
                    const nextCycle = cycles[cIdx + 1];
                    const startIdx = historyEvents.indexOf(cycle.startEvent);
                    const endIdx = (nextCycle && historyEvents.indexOf(nextCycle.startEvent) !== -1)
                        ? historyEvents.indexOf(nextCycle.startEvent)
                        : historyEvents.length;

                    if (startIdx !== -1) {
                        for (let i = startIdx + 1; i < endIdx; i++) {
                            const hItem = historyEvents[i];
                            const evt = (hItem.event || '').toLowerCase();
                            const isCut = evt.includes('cut off') || evt.includes('unloaded') || evt.includes('completed') || evt.includes('complete') || evt.includes('removed');
                            if (isCut) {
                                cycle.cutEvents.push(hItem);
                                if (!cycle.endDate) {
                                    cycle.endDate = hItem.date;
                                }
                            } else {
                                cycle.setupEvents.push(hItem);
                            }
                        }
                    }
                    if (nextCycle && (!cycle.endDate || cycle.endDate === '9999-12-31' || cycle.endDate > nextCycle.startDate)) {
                        cycle.endDate = nextCycle.startDate;
                    }
                    if (!cycle.endDate) cycle.endDate = '9999-12-31';
                });

                // Assign setup events to cycles
                loadingEvents.forEach(le => {
                    const leMNum = le.machineNumber || (le.machine ? le.machine.name : '');

                    let matchedCycle = [...cycles].reverse().find(cycle => {
                        const sameMachine = matchMachine(leMNum, cycle.machine);
                        return sameMachine && le.date >= cycle.startDate && le.date <= cycle.endDate;
                    });

                    if (!matchedCycle && leMNum) {
                        const sameMachineCycles = cycles.filter(cycle => matchMachine(leMNum, cycle.machine));
                        if (sameMachineCycles.length > 0) {
                            matchedCycle = sameMachineCycles.find(c => le.date >= c.startDate) || sameMachineCycles[sameMachineCycles.length - 1];
                        }
                    }

                    if (!matchedCycle && !leMNum) {
                        matchedCycle = [...cycles].reverse().find(cycle => le.date >= cycle.startDate && le.date <= cycle.endDate);
                    }

                    if (matchedCycle) {
                        const alreadyExists = matchedCycle.setupEvents.some(se => (se.event || '').toLowerCase() === (le.event || '').toLowerCase() && se.date === le.date);
                        if (!alreadyExists) {
                            matchedCycle.setupEvents.push(le);
                        }
                    }
                });

                // Assign production logs to cycles
                beamLogs.forEach(log => {
                    let bestCycle = null;
                    const logMNum = log.machineNumber;
                    cycles.forEach(cycle => {
                        if (matchMachine(logMNum, cycle.machine)) {
                            if (log.productionDate >= cycle.startDate && log.productionDate <= cycle.endDate) {
                                if (!bestCycle || cycle.startDate > bestCycle.startDate) {
                                    bestCycle = cycle;
                                }
                            }
                        }
                    });

                    const logMeters = parseFloat(log.totalMeters || log.meters) || 0;
                    const logWeight = parseFloat(log.takaWeight || log.weight) || 0;

                    if (bestCycle) {
                        bestCycle.logs.push({
                            productionDate: log.productionDate,
                            foldingDate: log.foldingDate,
                            takaSerial: log.takaSerial || 'Pending',
                            meters: logMeters,
                            weight: logWeight
                        });
                    } else if (cycles.length > 0 && logMNum) {
                        const sameMachineCycles = cycles.filter(itemCycle => matchMachine(logMNum, itemCycle.machine));
                        if (sameMachineCycles.length > 0) {
                            sameMachineCycles[sameMachineCycles.length - 1].logs.push({
                                productionDate: log.productionDate,
                                foldingDate: log.foldingDate,
                                takaSerial: log.takaSerial || 'Pending',
                                meters: logMeters,
                                weight: logWeight
                            });
                        }
                    }
                });

                // Assemble final timeline in exact chronological cycle sequence
                const finalTimeline = [];

                const processedHistoryIndices = new Set();
                preCycleEvents.forEach(item => processedHistoryIndices.add(item.historyIndex));

                // Consolidate preCycleEvents so there is ONLY 1 warping/manufacturing origin event at the top
                if (preCycleEvents.length > 0) {
                    const explicitWarp = preCycleEvents.find(h => {
                        const e = (h.event || '').toLowerCase();
                        return e.includes('warped by') || e.includes('warping by') || e.includes('manufactured by');
                    });
                    const primaryOrigin = explicitWarp || preCycleEvents[0];

                    const wPerson = beam.warpingPerson || 'Unknown';
                    let cleanEvent = primaryOrigin.event || '';
                    if (cleanEvent === 'Beam Created' || cleanEvent === 'Beam manufactured' || cleanEvent.toLowerCase() === 'beam created') {
                        cleanEvent = `Warped by ${wPerson}`;
                    }

                    finalTimeline.push({
                        ...primaryOrigin,
                        event: cleanEvent
                    });
                }

                cycles.forEach((cycle, cIdx) => {
                    const cycleNumber = cIdx + 1;
                    const mNameStr = String(cycle.machine.name || 'Machine');
                    const mDisp = mNameStr.toLowerCase().includes('machine') ? mNameStr : `Machine ${mNameStr}`;
                    const hasCut = cycle.cutEvents.length > 0;
                    let cStatus = 'Cut Off';
                    if (hasCut) {
                        const lastCutText = (cycle.cutEvents[cycle.cutEvents.length - 1].event || '').toLowerCase();
                        cStatus = (lastCutText.includes('completed') || lastCutText.includes('complete')) ? 'Completed' : 'Cut Off';
                    } else if (cIdx === cycles.length - 1) {
                        cStatus = beam.status || 'On Loom';
                    }

                    // 1. Cycle Start (Beam Loaded)
                    finalTimeline.push({
                        ...cycle.startEvent,
                        cycleNumber,
                        cycleMachine: mDisp,
                        cycleStatus: cStatus,
                        isCycleStart: true
                    });
                    processedHistoryIndices.add(cycle.startEvent.historyIndex);

                    // 2. Setup Events
                    cycle.setupEvents.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
                    cycle.setupEvents.forEach(se => {
                        finalTimeline.push({
                            ...se,
                            cycleNumber,
                            cycleMachine: mDisp,
                            cycleStatus: cStatus
                        });
                    });

                    // 3. Production Details
                    if (cycle.logs.length > 0) {
                        cycle.logs.sort((a, b) => (a.productionDate || '').localeCompare(b.productionDate || ''));
                        const subTotalMeters = cycle.logs.reduce((acc, l) => acc + l.meters, 0);
                        const uniqueTakas = {};
                        cycle.logs.forEach(l => {
                            if (l.takaSerial && l.takaSerial !== 'Pending') {
                                uniqueTakas[l.takaSerial] = l.weight;
                            }
                        });
                        const subTotalWeight = Object.values(uniqueTakas).reduce((acc, w) => acc + w, 0);
                        const prodDate = cycle.logs[0].productionDate;

                        finalTimeline.push({
                            date: prodDate,
                            event: `Production Details for ${mDisp}`,
                            type: 'production',
                            category: 'derived',
                            cycleNumber,
                            cycleMachine: mDisp,
                            cycleStatus: cStatus,
                            details: {
                                machineNumber: cycle.machine.name,
                                logs: cycle.logs,
                                subTotalMeters,
                                subTotalWeight
                            }
                        });
                    }

                    // 4. Cut / Unload / Completion Events
                    cycle.cutEvents.forEach(ce => {
                        finalTimeline.push({
                            ...ce,
                            cycleNumber,
                            cycleMachine: mDisp,
                            cycleStatus: cStatus,
                            isCycleEnd: true
                        });
                        processedHistoryIndices.add(ce.historyIndex);
                    });
                });

                // 5. Any post-cycle or unassigned history events
                historyEvents.forEach(item => {
                    const evt = (item.event || '').toLowerCase();
                    const isMfg = evt.includes('manufactured') || evt.includes('manufacture') || evt.includes('created') || evt.includes('warped') || evt.includes('warping') || item.type === 'warp';
                    if (!isMfg && !processedHistoryIndices.has(item.historyIndex)) {
                        finalTimeline.push(item);
                    }
                });

                // Guarantee: Filter finalTimeline so that ANY warping/manufacturing origin event appears ONLY ONCE at index 0!
                let originSeen = false;
                return finalTimeline.filter(item => {
                    const evt = (item.event || '').toLowerCase();
                    if (evt.includes('limbo') || evt.includes('displaced') || evt.includes('unassigned') || evt.includes('returned to available') || evt.includes('was removed')) return false;
                    const isMfg = evt.includes('manufactured') || evt.includes('manufacture') || evt.includes('created') || evt.includes('warped') || evt.includes('warping') || item.type === 'warp';
                    if (isMfg) {
                        if (!originSeen) {
                            originSeen = true;
                            return true;
                        }
                        return false;
                    }
                    return true;
                });

                return finalTimeline;
            };

            const getMachineTimelineData = (machine) => {
                if (!machine) return [];
                const machineEvents = [];
                const mNameEscaped = machine.name.toString().replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                const regex1 = new RegExp('(?:machine|no\\.?|on|from|completed on|unloaded from)\\s*(?:machine\\s+)?\\b' + mNameEscaped + '\\b', 'i');
                const regex2 = new RegExp('\\b' + mNameEscaped + '\\b', 'i');

                const matchesMachine = (eventStr) => {
                    if (!eventStr) return false;
                    const lower = eventStr.toLowerCase();
                    return regex1.test(lower) || regex2.test(lower);
                };

                (machine.history || []).forEach(h => {
                    machineEvents.push({
                        date: h.date,
                        event: h.event,
                        type: h.type || 'machine',
                        beam: null,
                        beamNumber: null,
                        category: 'machine-config'
                    });
                });

                beams.forEach(beam => {
                    (beam.history || []).forEach(h => {
                        if (matchesMachine(h.event)) {
                            machineEvents.push({
                                date: h.date,
                                event: h.event,
                                type: h.type || 'system',
                                beam: beam,
                                beamNumber: beam.beamNumber,
                                category: 'history'
                            });
                        }
                    });
                });

                (beamLoadings || []).forEach(bl => {
                    if (String(bl.machineNumber).trim() === String(machine.id).trim() || String(bl.machineNumber).trim() === String(machine.name).trim()) {
                        let roleLabel = '';
                        let workerName = '';
                        if (bl.piecein) { roleLabel = 'Piece In'; workerName = bl.piecein; }
                        else if (bl.drawingIn) { roleLabel = 'Drawing In'; workerName = bl.drawingIn; }
                        else if (bl.fani) { roleLabel = 'Fani (Reed)'; workerName = bl.fani; }
                        else if (bl.dropPinJog) { roleLabel = 'Drop pin/Jog'; workerName = bl.dropPinJog; }

                        const beam = beams.find(b => b.beamNumber === bl.beamNumber);
                        machineEvents.push({
                            date: bl.date,
                            event: roleLabel + " by " + workerName,
                            type: 'beam-loading',
                            beam: beam,
                            beamNumber: bl.beamNumber,
                            category: 'derived'
                        });
                    }
                });

                machineEvents.sort((a, b) => a.date.localeCompare(b.date));

                const configEvents = machineEvents.filter(e => e.category === 'machine-config');
                const beamEvents = machineEvents.filter(e => e.category !== 'machine-config');

                const cycles = [];
                let currentCycle = null;

                beamEvents.forEach(item => {
                    const eventText = (item.event || '').toLowerCase();
                    const isLoad = eventText.includes('pissing') || eventText.includes('piecing') || eventText.includes('loaded') || item.type === 'beam-loading';
                    const isUnload = eventText.includes('unloaded') || eventText.includes('completed') || eventText.includes('removed');

                    if (isLoad) {
                        if (!currentCycle || currentCycle.beamNumber !== item.beamNumber) {
                            if (currentCycle) {
                                currentCycle.endDate = item.date;
                            }
                            currentCycle = {
                                beam: item.beam,
                                beamNumber: item.beamNumber,
                                startDate: item.date,
                                endDate: null,
                                logs: [],
                                events: [item]
                            };
                            cycles.push(currentCycle);
                        } else {
                            currentCycle.events.push(item);
                        }
                    } else if (isUnload) {
                        if (currentCycle && currentCycle.beamNumber === item.beamNumber) {
                            currentCycle.endDate = item.date;
                            currentCycle.events.push(item);
                            currentCycle = null;
                        } else {
                            const openCycle = cycles.find(c => c.beamNumber === item.beamNumber && !c.endDate);
                            if (openCycle) {
                                openCycle.endDate = item.date;
                                openCycle.events.push(item);
                            } else {
                                cycles.push({
                                    beam: item.beam,
                                    beamNumber: item.beamNumber,
                                    startDate: item.date,
                                    endDate: item.date,
                                    logs: [],
                                    events: [item]
                                });
                            }
                        }
                    } else {
                        if (currentCycle) {
                            currentCycle.events.push(item);
                        } else {
                            const lastCycle = [...cycles].reverse().find(c => c.beamNumber === item.beamNumber);
                            if (lastCycle) {
                                lastCycle.events.push(item);
                            } else {
                                cycles.push({
                                    beam: item.beam,
                                    beamNumber: item.beamNumber,
                                    startDate: item.date,
                                    endDate: item.date,
                                    logs: [],
                                    events: [item]
                                });
                            }
                        }
                    }
                });

                cycles.forEach(c => {
                    if (!c.endDate) {
                        c.endDate = '9999-12-31';
                    }
                });

                const machineLogs = productionLogs.filter(log =>
                    String(log.machineNumber).trim() === String(machine.id).trim() ||
                    String(log.machineNumber).trim() === String(machine.name).trim()
                );

                machineLogs.forEach(log => {
                    let bestCycle = null;
                    cycles.forEach(cycle => {
                        if (cycle.beamNumber === log.beamNumber) {
                            if (log.productionDate >= cycle.startDate && log.productionDate <= cycle.endDate) {
                                if (!bestCycle || cycle.startDate > bestCycle.startDate) {
                                    bestCycle = cycle;
                                }
                            }
                        }
                    });

                    if (bestCycle) {
                        bestCycle.logs.push({
                            productionDate: log.productionDate,
                            foldingDate: log.foldingDate,
                            takaSerial: log.takaSerial || 'Pending',
                            meters: parseFloat(log.totalMeters) || 0,
                            weight: parseFloat(log.takaWeight) || 0
                        });
                    } else {
                        const sameBeamCycles = cycles.filter(c => c.beamNumber === log.beamNumber);
                        if (sameBeamCycles.length > 0) {
                            sameBeamCycles[sameBeamCycles.length - 1].logs.push({
                                productionDate: log.productionDate,
                                foldingDate: log.foldingDate,
                                takaSerial: log.takaSerial || 'Pending',
                                meters: parseFloat(log.totalMeters || log.meters) || 0,
                                weight: parseFloat(log.takaWeight || log.weight) || 0
                            });
                        } else {
                            const beam = beams.find(b => b.beamNumber === log.beamNumber);
                            const newCycle = {
                                beam: beam,
                                beamNumber: log.beamNumber,
                                startDate: log.productionDate,

                        if (isMfg) {

                        const isLoad = event.includes('loaded on') || event.includes('pissing on') || event.includes('jala piecing');

                        if (isLoad) {

                            }

                            finalHistory.push(h);

                    const migratedHistory = finalHistory.map(h => {

                        // 1. "Pissing on Machine X by Person" / "Jala Piecing on Machine X by Person"
                        if (/(?:Pissing on|Jala Piecing on) (?:Machine\s+)?(.+?)\s+by\s+(.+)$/i.test(eventText)) {
                            const match = eventText.match(/(?:Pissing on|Jala Piecing on) (?:Machine\s+)?(.+?)\s+by\s+(.+)$/i);
                            if (match) {

                                const targetEvent = `Jala Piecing by ${person} on ${mDisp}`;
                                if (eventText !== targetEvent) {
                                    historyMigrated = true;
                                    return { ...h, event: targetEvent };

                                const mDisp = machine.toLowerCase().includes('machine') ? machine : `Machine ${machine}`;

                        // 3. "Pissing on Machine X" / "Jala Piecing on Machine X" without "by"
                        if (/(?:Pissing on|Jala Piecing on) (?:Machine\s+)?(.+?)$/i.test(eventText) && !eventText.includes(' by ')) {
                            const match = eventText.match(/(?:Pissing on|Jala Piecing on) (?:Machine\s+)?(.+?)$/i);
                            if (match) {

                                const mDisp = machine.toLowerCase().includes('machine') ? machine : `Machine ${machine}`;

                                if (eventText !== targetEvent) {
                                    historyMigrated = true;
                                    return { ...h, event: targetEvent };
                                }
                            }
                        }
                        return h;
                    });

                        localChanged = true;

                });

                const results = {};
                combinations.forEach(combo => {
                    const [quality, code, color] = combo.split('|');
                    const match = (item) => (item.quality === quality && item.code === code && item.color === color);

                    const itemOrders = warpOrders.filter(match);
                    const itemIssues = issues.filter(match);
                    const itemBeams = beams.filter(match);

                    // Build chronological history
                    const history = [];

                    // Add Arrivals
                    itemOrders.forEach(o => {

                            if (!b.receiveDate) return;

                            history.push({
                                id: b.id,

                            });

                    });

                    // Add Issues
                    itemIssues.forEach(i => {
                        if (!i.date) return;
                        if (end && i.date > end) return;
                        const beam = beams.find(b => b.id === i.beamId);
                        history.push({

                            amount: parseFloat(i.issuedWeight) || 0,
