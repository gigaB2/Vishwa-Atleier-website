        let currentFiltered = (allCombinations || []).filter(c => {
          return (!newFilters.quality || c.quality === newFilters.quality) &&
                 (!newFilters.code || c.code === newFilters.code) &&
                 (!newFilters.color || c.color === newFilters.color) &&
                 (!newFilters.supplier || c.supplier === newFilters.supplier) &&
                 (filterType === 'All' || c.type === filterType);
        });

        const updated = { ...newFilters };
        ['quality', 'supplier', 'code', 'color'].forEach(f => {
          const options = [...new Set(currentFiltered.map(item => item[f]))].filter(Boolean);
          if (options.length === 1) updated[f] = options[0];
        });

        setSelectedQuality(updated.quality || '');
        setSelectedSupplier(updated.supplier || '');
        setSelectedCode(updated.code || '');
        setSelectedColor(updated.color || '');
      };

      const filteredOrders = useMemo(() => {
        return (orders || []).filter(o => {
          const itemCat = o.category || o.type || 'Polyester';
          return (!selectedQuality || o.quality === selectedQuality) &&
                 (!selectedSupplier || o.supplier === selectedSupplier) &&
                 (!selectedCode || o.code === selectedCode) &&
                 (!selectedColor || o.color === selectedColor) &&
                 (filterType === 'All' || itemCat === filterType);
        });
      }, [orders, selectedQuality, selectedSupplier, selectedCode, selectedColor, filterType]);

      const monthData = useMemo(() => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);

        // Normalize ISO / datetime strings to YYYY-MM-DD for day matching
        const toDayKey = (value) => {
          if (!value) return '';
          const raw = String(value).trim();
          if (/^\d{4}-\d{2}-\d{2}/.test(raw)) return raw.slice(0, 10);
          const parsed = new Date(raw);
          if (Number.isNaN(parsed.getTime())) return '';
          const y = parsed.getFullYear();
          const m = String(parsed.getMonth() + 1).padStart(2, '0');
          const d = String(parsed.getDate()).padStart(2, '0');
          return `${y}-${m}-${d}`;
        };
        
        const days = [];
        for (let i = 0; i < firstDay.getDay(); i++) days.push(null);
        
        for (let d = 1; d <= lastDay.getDate(); d++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          
          let ordersPlaced = [];
          let ordersReceived = [];
          let grItems = [];
          
          filteredOrders.forEach(o => {
            const itemCat = o.category || o.type || 'Polyester';
            const oDate = toDayKey(o.orderDate || o.createdAt);
            if (oDate === dateStr) ordersPlaced.push(o);
            
            (o.batches || []).forEach(b => {
              const bDate = toDayKey(b.receiveDate || b.receivedAt);
              if (bDate === dateStr) {
                ordersReceived.push({ 
                  ...b, 
                  orderId: o.id, 
                  quality: o.quality, 
                  code: o.code, 
                  color: o.color, 
                  supplier: o.supplier, 
                  type: itemCat,
                  totalWeight: Number(b.totalWeight) || 0
                });
              }
              
              (b.boxes || []).forEach(box => {
                const retWeight = Number(box.returnedWeight) || 0;
                if (toDayKey(box.returnedDate) === dateStr && retWeight > 0) {
                  const existing = grItems.find(g => g.challanNumber === b.challanNumber && g.orderId === o.id);
                  if (existing) {
                    existing.returnedWeight += retWeight;
                  } else {
                    grItems.push({ 
                      orderId: o.id, 
                      quality: o.quality, 
                      code: o.code, 
                      color: o.color, 
                      supplier: o.supplier, 
                      type: itemCat, 
                      challanNumber: b.challanNumber, 
                      lotNumber: b.lotNumber,
                      returnedWeight: retWeight 
                    });
                  }
                }
              });
            });
          });
          
          days.push({
            day: d,
            date: dateStr,
            ordersPlaced,
            ordersReceived,
            grItems,
            totalWeight: ordersPlaced.reduce((acc, o) => acc + (Number(o.orderedWeight) || 0), 0) +
                         ordersReceived.reduce((acc, b) => acc + (Number(b.totalWeight) || 0), 0) +
                         grItems.reduce((acc, g) => acc + (Number(g.returnedWeight) || 0), 0)
          });
        }
        while (days.length % 7 !== 0) days.push(null);
        return days;
      }, [currentDate, filteredOrders]);

      const weekRows = Math.max(1, Math.ceil(monthData.length / 7));

      const maxWeight = useMemo(() => {
        return Math.max(...monthData.map(d => d?.totalWeight || 0), 100);
      }, [monthData]);

      const getHeatLevel = (weight) => {
        if (weight === 0) return 0;
        const ratio = weight / maxWeight;
        if (ratio < 0.2) return 1;
        if (ratio < 0.4) return 2;
        if (ratio < 0.6) return 3;
        if (ratio < 0.8) return 4;
        return 5;
      };

      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

      return (
        <div className="ob-heatmap-stack">
          <div className={`card ob-heatmap-filters${filtersOpen ? ' is-open' : ' is-collapsed'}`} style={{ overflow: 'visible', zIndex: 100 }}>
            <div className="ob-filter-toolbar">
              <h3 style={{ fontSize: '1.05rem', fontWeight: '700', margin: 0 }}>Heat Map Filters</h3>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem', flexWrap: 'wrap' }}>
                <div className="ob-filter-type-toggle">
                  {['All', ...YARN_CATEGORIES].map(type => (
                    <button 
                      key={type}
                      className="btn" 
                      style={{
                        padding: '0.35rem 0.85rem', 
                        fontSize: '0.8rem',
                        background: filterType === type ? 'var(--surface)' : 'transparent',
                        boxShadow: filterType === type ? 'var(--shadow-sm)' : 'none',
                        color: filterType === type ? 'var(--accent)' : 'var(--muted)'
                      }}
                      onClick={() => {
                        const currentFilters = { quality: selectedQuality, supplier: selectedSupplier, code: selectedCode, color: selectedColor };
                        const newFilters = { ...currentFilters, type: type === 'All' ? null : type };
                        let filtered = (allCombinations || []).filter(c => {
                          return (!newFilters.type || c.type === newFilters.type) &&
                                 (!newFilters.quality || c.quality === newFilters.quality) &&
                                 (!newFilters.code || c.code === newFilters.code) &&
                                 (!newFilters.color || c.color === newFilters.color) &&
                                 (!newFilters.supplier || c.supplier === newFilters.supplier);
                        });
                        
                        const fields = ['quality', 'supplier', 'code', 'color'];
                        fields.forEach(f => {
                          const options = [...new Set(filtered.map(item => item[f]))].filter(Boolean);
                          if (options.length === 1) {
                            if (f === 'quality') setSelectedQuality(options[0]);
                            else if (f === 'supplier') setSelectedSupplier(options[0]);
                            else if (f === 'code') setSelectedCode(options[0]);
                            else if (f === 'color') setSelectedColor(options[0]);
                          }
                        });
                        setFilterType(type);
                      }}
                    >
                      {type}
                    </button>
                  ))}
                </div>
                <button
                  type="button"
                  className="btn btn-outline ob-heatmap-filter-toggle"
                  style={{ padding: '0.35rem 0.75rem', fontSize: '0.78rem' }}
                  onClick={() => setFiltersOpen(v => !v)}
                >
                  {filtersOpen ? 'Hide filters' : 'Show filters'}
                </button>
              </div>
            </div>

            {filtersOpen && (
              <div className="ob-filter-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr) auto', gap: '0.85rem', alignItems: 'end' }}>
                <SearchableDropdown 
                  label="Quality"
                  placeholder="Search quality..."
                  options={getOptions('quality')}
                  value={selectedQuality}
                  onChange={val => handleSelect('quality', val)}
                  emptyLabel="-- All Qualities --"
                />
                <SearchableDropdown 
                  label="Code"
                  placeholder="Search code..."
                  options={getOptions('code')}
                  value={selectedCode}
                  onChange={val => handleSelect('code', val)}
                  emptyLabel="-- All Codes --"
                />
                <SearchableDropdown 
                  label="Color"
                  placeholder="Search color..."
                  options={getOptions('color')}
                  value={selectedColor}
                  onChange={val => handleSelect('color', val)}
                  emptyLabel="-- All Colors --"
                />
                <SearchableDropdown 
                  label="Supplier"
                  placeholder="Search supplier..."
                  options={getOptions('supplier')}
                  value={selectedSupplier}
                  onChange={val => handleSelect('supplier', val)}
                  emptyLabel="-- All Suppliers --"
                />
                <button 
                  className="btn btn-outline" 
                  style={{padding: '0.65rem', borderRadius: '12px', alignSelf: 'end'}}
                  onClick={() => { 
                    setSelectedQuality(''); setSelectedSupplier(''); setSelectedCode(''); setSelectedColor('');
                    setFilterType('All');
                  }}
                  title="Clear Filters"
                >
                  🔄
                </button>
              </div>
            )}
          </div>

          <div className="card heat-map-container">
            <div className="ob-heatmap-month-row">
              <h2 style={{ fontFamily: 'var(--font-display)', fontSize: '1.35rem', background: 'linear-gradient(135deg, var(--accent), var(--accent2))', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', margin: 0 }}>
                {monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}
              </h2>
              <div className="ob-heatmap-nav">
                <button className="btn btn-outline" style={{ padding: '0.4rem 0.75rem' }} onClick={() => { const d = new Date(currentDate); d.setFullYear(d.getFullYear() - 1); setCurrentDate(d); }} title="Previous Year">◀◀</button>
                <button className="btn btn-outline" style={{ padding: '0.4rem 0.75rem' }} onClick={() => { const d = new Date(currentDate); d.setMonth(d.getMonth() - 1); setCurrentDate(d); }} title="Previous Month">◀</button>
                <button className="btn btn-outline" style={{ padding: '0.4rem 0.75rem' }} onClick={() => setCurrentDate(new Date())}>Today</button>
                <button className="btn btn-outline" style={{ padding: '0.4rem 0.75rem' }} onClick={() => { const d = new Date(currentDate); d.setMonth(d.getMonth() + 1); setCurrentDate(d); }} title="Next Month">▶</button>
                <button className="btn btn-outline" style={{ padding: '0.4rem 0.75rem' }} onClick={() => { const d = new Date(currentDate); d.setFullYear(d.getFullYear() + 1); setCurrentDate(d); }} title="Next Year">▶▶</button>
              </div>
            </div>

            <div className="ob-heatmap-legend">
              <div style={{ display: 'flex', gap: '1rem', flexWrap: 'wrap' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '0.35rem' }}>
                  <span style={{ fontSize: '1rem' }}>📦</span>
                  <span style={{ color: 'var(--fg)' }}>Orders</span>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '0.35rem' }}>
                  <span style={{ fontSize: '1rem' }}>🚚</span>
                  <span style={{ color: 'var(--fg)' }}>Received</span>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '0.35rem' }}>
                  <span style={{ fontSize: '1rem' }}>🔄</span>
                  <span style={{ color: 'var(--fg)' }}>Returns</span>
                </div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                <span style={{ fontSize: '0.7rem', color: 'var(--muted)', marginRight: '4px' }}>Activity:</span>
                <div style={{ display: 'flex', gap: '4px' }}>
                  <span className="legend-box heat-level-0" style={{ width: '12px', height: '12px', borderRadius: '3px', border: '1px solid var(--border)', display: 'inline-block' }} title="No Activity"></span>
                  <span className="legend-box heat-level-1" style={{ width: '12px', height: '12px', borderRadius: '3px', border: '1px solid var(--border)', display: 'inline-block' }} title="Low Activity"></span>
                  <span className="legend-box heat-level-3" style={{ width: '12px', height: '12px', borderRadius: '3px', border: '1px solid var(--border)', display: 'inline-block' }} title="Medium Activity"></span>
                  <span className="legend-box heat-level-5" style={{ width: '12px', height: '12px', borderRadius: '3px', border: '1px solid var(--border)', display: 'inline-block' }} title="Peak Activity"></span>
                </div>
              </div>
            </div>

            <div className="calendar-grid-shell">
              <div className="calendar-grid" style={{ ['--weeks']: String(weekRows) }}>
                {["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"].map(d => (
                  <div key={d} className="calendar-weekday">{d}</div>
                ))}
                {monthData.map((day, idx) => {
                  if (!day) return <div key={idx} className="calendar-day-empty" />;
                  const activityCount = day.ordersPlaced.length + day.ordersReceived.length + day.grItems.length;
                  const hasActivity = activityCount > 0;
                  const heat = getHeatLevel(day.totalWeight);
                  return (
                    <div 
                      key={idx} 
                      className={`calendar-day heat-level-${heat}${hasActivity ? ' has-activity' : ''}`}
                      style={{ cursor: hasActivity ? 'pointer' : 'default' }}
                      title={hasActivity ? `${activityCount} activit${activityCount === 1 ? 'y' : 'ies'} · ${day.totalWeight.toFixed(0)} kg` : undefined}
                      onClick={() => {
                        if (hasActivity) setSelectedDate(day);
                      }}
                    >
                      <span className="day-number">{day.day}</span>
                      <div className="day-content">
                        {day.ordersPlaced.length > 0 && (
                          <span className="day-activity-chip item-pill-ordered" title={`${day.ordersPlaced.length} orders`}>
                            📦{day.ordersPlaced.length}
                          </span>
                        )}
                        {day.ordersReceived.length > 0 && (
                          <span className="day-activity-chip item-pill-received" title={`${day.ordersReceived.length} received`}>
                            🚚{day.ordersReceived.length}
                          </span>
                        )}
                        {day.grItems.length > 0 && (
                          <span className="day-activity-chip item-pill-gr" title={`${day.grItems.length} returns`}>
                            🔄{day.grItems.length}
                          </span>
                        )}
                      </div>
                      {hasActivity ? <div className="day-heat-bar" /> : null}
                    </div>
                  );
                })}
              </div>
            </div>

            {selectedDate && (
              <DayDetailModal 
                dateData={selectedDate} 
                onClose={() => setSelectedDate(null)} 
                onNavigate={onNavigate}
                qualities={qualities}
              />
            )}
          </div>
        </div>
      );
    };

    const DayDetailModal = ({ dateData, onClose, onNavigate, qualities = [] }) => {
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        document.addEventListener('keydown', handleKeyDown);
        const prevOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        return () => {
          document.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = prevOverflow;
        };
      }, [onClose]);

      return ReactDOM.createPortal(
        <div 
          className="modal-overlay" 
          onClick={onClose}
          style={{
            position: 'fixed',
            top: 0,
            left: 0,
            right: 0,
            bottom: 0,
            width: '100vw',
            height: '100vh',
            height: '100dvh',
            background: 'rgba(10, 10, 20, 0.75)',
            backdropFilter: 'blur(8px)',
            WebkitBackdropFilter: 'blur(8px)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            padding: '1.25rem',
            zIndex: 999999,
            margin: 0
          }}
        >
          <div 
            className="modal" 
            onClick={e => e.stopPropagation()}
            style={{ 
              maxWidth: '1000px',
              width: '100%',
              maxHeight: 'calc(100dvh - 2.5rem)',
              display: 'flex',
              flexDirection: 'column',
              padding: '1.75rem 2rem',
              borderRadius: '24px',
              boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.35)',
              position: 'relative',
              overflow: 'hidden'
            }}
          >
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem', flexShrink: 0 }}>
              <div>
                <h2 style={{ fontSize: '1.6rem', marginBottom: '0.25rem' }}>Daily Activity Details</h2>
                <p style={{ color: 'var(--muted)', fontWeight: '600', fontSize: '0.9rem' }}>{new Date(dateData.date).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</p>
              </div>
              <button className="btn btn-outline" onClick={onClose} style={{ padding: '0.5rem 1rem', fontSize: '0.85rem' }}>Close ✕</button>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: '2rem', overflowY: 'auto', flex: 1, paddingRight: '0.25rem' }}>
              {dateData.ordersPlaced.length > 0 && (
                <div>
                  <h3 style={{ color: 'var(--accent)', marginBottom: '1.25rem', display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                    <span style={{ fontSize: '1.5rem' }}>📦</span> Orders Placed
                  </h3>
                  <div className="table-responsive">
                    <table>
                      <thead>
                        <tr>
                          <th>Quality</th>
                          <th>Supplier</th>
                          <th>Code</th>
                          <th>Color</th>
                          <th>Type</th>
                          <th>Weight</th>
                          <th>Rate</th>
                          <th>Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        {dateData.ordersPlaced.map(o => {
                          const itemCat = o.category || o.type || 'Polyester';
                          return (
                            <tr key={o.id}>
                              <td>
                                <strong>{o.quality}</strong>
                                {(() => {
                                  const q = (qualities || []).find(x => x.id === o.qualityId || (x.quality === o.quality && x.code === o.code && x.color === o.color));
                                  return q && q.type ? <div style={{ fontSize: '0.75rem', color: 'var(--muted)', marginTop: '2px' }}>{q.type}</div> : null;
                                })()}
                              </td>
                              <td>{o.supplier}</td>
                              <td>{o.code || '-'}</td>
                              <td>{o.color || '-'}</td>
                              <td><span className={`badge badge-${itemCat.toLowerCase()}`}>{itemCat}</span></td>
                              <td style={{ fontWeight: '700' }}>{o.orderedWeight} kg</td>
                              <td>{o.price ? `₹${Number(o.price).toFixed(2)}` : '—'}</td>
                              <td><button className="btn btn-outline" style={{ padding: '4px 8px', fontSize: '0.75rem' }} onClick={() => onNavigate(o.id, { ...o, type: itemCat })}>📈 View Tree</button></td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {dateData.ordersReceived.length > 0 && (
                <div>
                  <h3 style={{ color: 'var(--success)', marginBottom: '1.25rem', display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                    <span style={{ fontSize: '1.5rem' }}>🚚</span> Shipments Received
                  </h3>
                  <div className="table-responsive">
                    <table>
                      <thead>
                        <tr>
                          <th>Quality</th>
                          <th>Supplier</th>
                          <th>Code</th>
                          <th>Color</th>
                          <th>Type</th>
                          <th>Challan #</th>
                          <th>Lot No #</th>
                          <th>Received Weight</th>
                          <th>Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        {dateData.ordersReceived.map(b => {
                          const itemCat = b.type || 'Polyester';
                          return (
                            <tr key={b.id || (b.challanNumber + '-' + b.lotNumber)}>
                              <td>
                                <strong>{b.quality}</strong>
                                {(() => {
                                  const q = (qualities || []).find(x => x.quality === b.quality && x.code === b.code && x.color === b.color);
                                  return q && q.type ? <div style={{ fontSize: '0.75rem', color: 'var(--muted)', marginTop: '2px' }}>{q.type}</div> : null;
                                })()}
                              </td>
                              <td>{b.supplier}</td>
                              <td>{b.code || '-'}</td>
                              <td>{b.color || '-'}</td>
                              <td><span className={`badge badge-${itemCat.toLowerCase()}`}>{itemCat}</span></td>
                              <td>{b.challanNumber}</td>
                              <td>{b.lotNumber}</td>
                              <td style={{ fontWeight: '700', color: 'var(--success)' }}>{(Number(b.totalWeight) || 0).toFixed(2)} kg</td>
                              <td><button className="btn btn-outline" style={{ padding: '4px 8px', fontSize: '0.75rem' }} onClick={() => onNavigate(b.orderId, { ...b, type: itemCat })}>📈 View Tree</button></td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {dateData.grItems.length > 0 && (
                <div>
                  <h3 style={{ color: 'var(--error)', marginBottom: '1.25rem', display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                    <span style={{ fontSize: '1.5rem' }}>🔄</span> Goods Return (GR)
                  </h3>
                  <div className="table-responsive">
                    <table>
                      <thead>
                        <tr>
                          <th>Quality</th>
                          <th>Supplier</th>
                          <th>Code</th>
                          <th>Color</th>
                          <th>Type</th>
                          <th>Challan #</th>
                          <th>Lot No #</th>
                          <th>Returned Weight</th>
                          <th>Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        {dateData.grItems.map((g, idx) => {
                          const itemCat = g.type || 'Polyester';
                          return (
                            <tr key={idx}>
                              <td>
                                <strong>{g.quality}</strong>
                                {(() => {
                                  const q = (qualities || []).find(x => x.quality === g.quality && x.code === g.code && x.color === g.color);
                                  return q && q.type ? <div style={{ fontSize: '0.75rem', color: 'var(--muted)', marginTop: '2px' }}>{q.type}</div> : null;
                                })()}
                              </td>
                              <td>{g.supplier}</td>
                              <td>{g.code || '-'}</td>
                              <td>{g.color || '-'}</td>
                              <td><span className={`badge badge-${itemCat.toLowerCase()}`}>{itemCat}</span></td>
                              <td>{g.challanNumber}</td>
                              <td>{g.lotNumber}</td>
                              <td style={{ fontWeight: '700', color: 'var(--error)' }}>{(Number(g.returnedWeight) || 0).toFixed(2)} kg</td>
                              <td><button className="btn btn-outline" style={{ padding: '4px 8px', fontSize: '0.75rem' }} onClick={() => onNavigate(g.orderId, { ...g, type: itemCat })}>📈 View Tree</button></td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {dateData.ordersPlaced.length === 0 && dateData.ordersReceived.length === 0 && dateData.grItems.length === 0 && (
                <div style={{ textAlign: 'center', padding: '4rem', background: 'var(--bg)', borderRadius: '20px', border: '2px dashed var(--border)' }}>
                  <span style={{ fontSize: '3rem', display: 'block', marginBottom: '1rem' }}>📅</span>
                  <h4 style={{ color: 'var(--muted)' }}>No activity recorded on this date.</h4>
                </div>
              )}
            </div>
          </div>
        </div>,
        document.body
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
