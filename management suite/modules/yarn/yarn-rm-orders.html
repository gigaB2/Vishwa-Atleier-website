        const colors = (qualities || []).filter(q => {
          const qType = q.type || q.itemType || 'Polyester';
          const qQual = q.quality || q.name || '';
          if (orderForm.category && qType !== orderForm.category) return false;
          if (orderForm.quality && qQual !== orderForm.quality) return false;
          return true;
        }).map(q => q.color).filter(Boolean);
        return [...new Set(colors)];
      }, [qualities, orderForm.category, orderForm.quality]);

      const handleModalQualityChange = (selectedQualName) => {
        const match = modalFilteredQualities.find(q => (q.quality || q.name) === selectedQualName);
        setOrderForm(prev => ({
          ...prev,
          quality: selectedQualName,
          code: match?.code || prev.code,
          color: match?.color || prev.color,
          supplier: prev.supplier || match?.supplier || ''
        }));
      };

      const handleSaveOrderDetails = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (!orderForm.orderDate || !orderForm.supplier || !orderForm.category || !orderForm.quality || !orderForm.orderedWeight) {
          alert('Please fill in all required order fields (Date, Supplier, Type, Quality, Order Qty)');
          return;
        }

        const updatedOrder = {
          ...order,
          orderDate: orderForm.orderDate,
          supplier: orderForm.supplier,
          category: orderForm.category,
          type: orderForm.category,
          quality: orderForm.quality,
          code: orderForm.code,
          color: orderForm.color,
          orderedWeight: Number(orderForm.orderedWeight) || 0,
          price: orderForm.price !== '' ? Number(orderForm.price) : ''
        };

        // Sync changes with Yarn RM Stock Book for any linked lots
        try {
          const rawStock = localStorage.getItem(YARN_STOCK_STORAGE_KEY);
          let stockList = rawStock ? JSON.parse(rawStock) : [];
          if (Array.isArray(stockList)) {
            const orderRef = order.orderNumber || order.id;
            let lotUpdated = false;
            stockList = stockList.map(lot => {
              if (lot.orderRef === orderRef) {
                lotUpdated = true;
                return {
                  ...lot,
                  supplier: updatedOrder.supplier,
                  quality: updatedOrder.quality,
                  itemType: updatedOrder.category,
                  code: updatedOrder.code,
                  color: updatedOrder.color,
                  rate: updatedOrder.price
                };
              }
              return lot;
            });
            if (lotUpdated) {
              localStorage.setItem(YARN_STOCK_STORAGE_KEY, JSON.stringify(stockList));
              if (window.VishwaSupabase && typeof window.VishwaSupabase.saveToSupabase === 'function') {
                window.VishwaSupabase.saveToSupabase(YARN_STOCK_STORAGE_KEY, stockList);
              }
            }
          }
        } catch(err) {}

        onUpdate(updatedOrder);
        setOrderSavedToast(true);
        setTimeout(() => setOrderSavedToast(false), 3000);
      };

      const received = (order.batches || []).reduce((acc, b) => acc + (Number(b.totalWeight) || 0), 0);
      const gr = (order.batches || []).reduce((acc, batch) => acc + (batch.boxes || []).reduce((boxAcc, box) => boxAcc + (Number(box.returnedWeight) || 0), 0), 0);
      const grossReceived = received + gr;
      
      const isCompleted = order.status === 'Completed';
      const netDiff = received - Number(order.orderedWeight || 0);

      const handleBatchSubmit = (batchData) => {
        const processed = {
          ...batchData,
          receiveDate: addTimestampToDate(batchData.receiveDate),
          boxes: batchData.boxes ? batchData.boxes.map(box => ({
            ...box,
            returnedDate: box.returnedDate ? addTimestampToDate(box.returnedDate) : ''
          })) : []
        };
        
        let updatedBatches = editingBatch 
          ? order.batches.map(x => x.id === editingBatch.id ? { ...x, ...processed } : x) 
          : [...(order.batches || []), { ...processed, id: Date.now().toString(), receivedAt: new Date().toISOString() }];

        // Sync directly into Yarn RM Stock Book
        try {
          const rawStock = localStorage.getItem(YARN_STOCK_STORAGE_KEY);
          let stockList = rawStock ? JSON.parse(rawStock) : [];
          if (!Array.isArray(stockList)) stockList = [];

          const recDateOnly = (batchData.receiveDate || new Date().toISOString().split('T')[0]).split('T')[0];
          const lotIdVal = batchData.lotNumber || ('LOT-' + (batchData.challanNumber || Date.now().toString().slice(-4)));

          const stockLot = {
            id: lotIdVal,
            lotNumber: batchData.lotNumber || ('LOT-' + (batchData.challanNumber || 'AUTO')),
            challanNo: batchData.challanNumber || '',
            challanNumber: batchData.challanNumber || '',
            receiveDate: recDateOnly,
            date: recDateOnly,
            supplier: order.supplier || '',
            quality: order.quality || '',
            itemType: order.category || order.type || 'Polyester',
            code: order.code || '',
            color: order.color || '',
            rate: order.price || '',
            orderRef: order.orderNumber || order.id,
            boxes: (batchData.boxes || []).map((bx, idx) => {
              const bId = String(bx.boxNumber || `B${idx + 1}`).trim();
              const retWt = Number(bx.returnedWeight) || 0;
              const isGr = retWt > 0;
              return {
                id: bId,
                boxNumber: bId,
                cones: Number(bx.cones) || 0,
                weight: Number(bx.weight) || 0,
                status: isGr ? 'gr' : 'available',
                issueDate: null,
                issuedTo: null,
                grWeight: retWt,
                grDate: bx.returnedDate ? bx.returnedDate.split('T')[0] : '',
                grRemarks: isGr ? 'Returned in Challan GR' : null
              };
            })
          };

          // If lot exists, preserve existing box issue/status records
          const existingLot = stockList.find(s => String(s.id) === String(stockLot.id) || String(s.lotNumber) === String(stockLot.lotNumber));
          if (existingLot && Array.isArray(existingLot.boxes)) {
            const existingBoxMap = new Map(existingLot.boxes.map(b => [String(b.id || b.boxNumber), b]));
            stockLot.boxes = stockLot.boxes.map(b => {
              const oldB = existingBoxMap.get(String(b.id));
              if (oldB && oldB.status === 'issued') {
                return {
                  ...b,
                  status: 'issued',
                  issueDate: oldB.issueDate,
                  issuedTo: oldB.issuedTo
                };
              }
              return b;
            });
          }

          stockList = stockList.filter(s => String(s.id) !== String(stockLot.id) && String(s.lotNumber) !== String(stockLot.lotNumber));
          stockList.unshift(stockLot);
          localStorage.setItem(YARN_STOCK_STORAGE_KEY, JSON.stringify(stockList));
          if (window.VishwaSupabase && typeof window.VishwaSupabase.saveToSupabase === 'function') {
            window.VishwaSupabase.saveToSupabase(YARN_STOCK_STORAGE_KEY, stockList);
          }
        } catch(e) {
          console.error("Stock sync error:", e);
        }

        onUpdate({ ...order, batches: updatedBatches }); 
        setShowBatchForm(false); 
        setEditingBatch(null);
      };

      const handleDeleteBatch = (batchId) => {
        if (confirm('Delete this batch?')) {
          const delBatch = (order.batches || []).find(x => x.id === batchId);
          const updatedBatches = (order.batches || []).filter(x => x.id !== batchId);

          // Clean from stock book
          if (delBatch) {
            try {
              const rawStock = localStorage.getItem(YARN_STOCK_STORAGE_KEY);
              let stockList = rawStock ? JSON.parse(rawStock) : [];
              if (Array.isArray(stockList)) {
                stockList = stockList.filter(s => 
                  String(s.batchId) !== String(batchId) &&
                  String(s.id) !== String(batchId) &&
                  String(s.id) !== String(delBatch.lotNumber) &&
                  String(s.lotNumber) !== String(delBatch.lotNumber) &&
                  String(s.challanNo || s.challanNumber) !== String(delBatch.challanNumber)
                );
                localStorage.setItem(YARN_STOCK_STORAGE_KEY, JSON.stringify(stockList));
                if (window.VishwaSupabase && typeof window.VishwaSupabase.saveToSupabase === 'function') {
                  window.VishwaSupabase.saveToSupabase(YARN_STOCK_STORAGE_KEY, stockList);
                }
              }
            } catch(e) {}
          }

          onUpdate({ ...order, batches: updatedBatches });
        }
      };

      return (
        <div className="modal-overlay">
          <div className="modal" style={{maxWidth: '1200px'}}>
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
              <div>
                <h2>{order.quality} — {order.supplier}</h2>
                <p style={{color: 'var(--muted)'}}>
                  {order.code || '-'} | {order.color || '-'} | {order.category || order.type || 'Polyester'} {order.price ? `| ₹${Number(order.price).toFixed(2)}/kg` : ''}
                </p>
              </div>
              <button className="btn btn-outline" onClick={onClose}>Close</button>
            </div>

            <div className="dashboard-grid" style={{marginTop: '1.5rem', gridTemplateColumns: isCompleted ? 'repeat(6, 1fr)' : 'repeat(5, 1fr)', gap: '1rem', marginBottom: '1.5rem'}}>
              <div className="card" style={{padding: '1.25rem'}}>
                <h3 style={{fontSize: '0.8rem', color: 'var(--muted)', textTransform: 'uppercase'}}>Ordered</h3>
                <div className="value" style={{fontSize: '1.5rem', fontWeight: '700'}}>{order.orderedWeight} kg</div>
              </div>
              <div className="card" style={{padding: '1.25rem'}}>
                <h3 style={{fontSize: '0.8rem', color: 'var(--muted)', textTransform: 'uppercase'}}>Gross Received</h3>
                <div className="value" style={{fontSize: '1.5rem', fontWeight: '700'}}>{grossReceived.toFixed(2)}</div>
              </div>
              <div className="card" style={{padding: '1.25rem'}}>
                <h3 style={{fontSize: '0.8rem', color: 'var(--accent3)', textTransform: 'uppercase'}}>GR</h3>
                <div className="value" style={{fontSize: '1.5rem', color: 'var(--accent3)', fontWeight: '700'}}>{gr.toFixed(2)}</div>
              </div>
              <div className="card" style={{padding: '1.25rem'}}>
                <h3 style={{fontSize: '0.8rem', color: 'var(--success)', textTransform: 'uppercase'}}>Net Received</h3>
                <div className="value" style={{fontSize: '1.5rem', color: 'var(--success)', fontWeight: '700'}}>{received.toFixed(2)}</div>
              </div>
              {isCompleted && (
                <div className="card" style={{ padding: '1.25rem', borderColor: netDiff >= 0 ? '#3b82f6' : 'var(--error)', background: netDiff >= 0 ? 'rgba(59, 130, 246, 0.05)' : 'rgba(239, 68, 68, 0.02)' }}>
                  <h3 style={{ color: netDiff >= 0 ? '#3b82f6' : 'var(--error)', fontSize: '0.8rem', textTransform: 'uppercase' }}>{netDiff >= 0 ? 'Surplus' : 'Shortfall'}</h3>
                  <div className="value" style={{ fontSize: '1.5rem', color: netDiff >= 0 ? '#3b82f6' : 'var(--error)', fontWeight: '700' }}>
                    {Math.abs(netDiff).toFixed(2)} kg
                  </div>
                </div>
              )}
              <div className="card" style={{padding: '1.25rem'}}>
                <h3 style={{fontSize: '0.8rem', color: 'var(--muted)', textTransform: 'uppercase'}}>Status</h3>
                <div className="value" style={{fontSize: '1.5rem', color: 'var(--success)', fontWeight: '700'}}>{order.status || 'Active'}</div>
              </div>
            </div>

            {/* Order Specifications & Rate Edit Card */}
            <div className="card" style={{ padding: '1.25rem', marginBottom: '2rem', border: '1px solid var(--border)', background: 'var(--surface)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem', flexWrap: 'wrap', gap: '0.5rem' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                  <span style={{ fontSize: '1.1rem' }}>✏️</span>
                  <h3 style={{ fontSize: '0.95rem', fontWeight: '600' }}>Edit Order Specifications & Rate</h3>
                  {orderSavedToast && <span className="badge badge-success" style={{ marginLeft: '0.5rem' }}>✓ Saved</span>}
                </div>
                <button 
                  type="button" 
                  className="btn btn-primary" 
                  style={{ padding: '0.45rem 1.1rem', fontSize: '0.85rem' }} 
                  onClick={handleSaveOrderDetails}
                >
                  Save Order Details
                </button>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(130px, 1fr))', gap: '0.75rem', alignItems: 'end' }}>
                <div className="input-group" style={{ marginBottom: 0 }}>
                  <label style={{ fontSize: '0.75rem' }}>Order Date *</label>
                  <input type="date" value={orderForm.orderDate} onChange={e => setOrderForm({ ...orderForm, orderDate: e.target.value })} style={{ padding: '0.45rem 0.6rem', fontSize: '0.85rem', borderRadius: '10px' }} />
                </div>
                <div className="input-group" style={{ marginBottom: 0 }}>
                  <label style={{ fontSize: '0.75rem' }}>Supplier *</label>
                  <select value={orderForm.supplier} onChange={e => setOrderForm({ ...orderForm, supplier: e.target.value })} style={{ padding: '0.45rem 0.6rem', fontSize: '0.85rem', borderRadius: '10px' }}>
                    <option value="">-- Supplier --</option>
                    {(suppliers || []).map((s, idx) => {
                      const sName = s.name || s.supplier;
                      return <option key={idx} value={sName}>{sName}</option>;
                    })}
                  </select>
                </div>
                <div className="input-group" style={{ marginBottom: 0 }}>
                  <label style={{ fontSize: '0.75rem' }}>Yarn Type *</label>
                  <select value={orderForm.category} onChange={e => setOrderForm({ ...orderForm, category: e.target.value, quality: '', code: '', color: '' })} style={{ padding: '0.45rem 0.6rem', fontSize: '0.85rem', borderRadius: '10px' }}>
                    {YARN_CATEGORIES.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                  </select>
                </div>
                <div className="input-group" style={{ marginBottom: 0 }}>
                  <label style={{ fontSize: '0.75rem' }}>Quality *</label>
                  <select value={orderForm.quality} onChange={e => handleModalQualityChange(e.target.value)} style={{ padding: '0.45rem 0.6rem', fontSize: '0.85rem', borderRadius: '10px' }}>
                    <option value="">-- Quality --</option>
                    {modalFilteredQualities.map((q, idx) => {
                      const qName = q.quality || q.name;
                      return <option key={idx} value={qName}>{qName}{q.color ? ` (${q.color})` : ''}</option>;
                    })}
                  </select>
                </div>
                <div className="input-group" style={{ marginBottom: 0 }}>
                  <label style={{ fontSize: '0.75rem' }}>Code</label>
                  {modalAvailableCodes.length > 0 ? (
                    <select value={orderForm.code} onChange={e => setOrderForm({ ...orderForm, code: e.target.value })} style={{ padding: '0.45rem 0.6rem', fontSize: '0.85rem', borderRadius: '10px' }}>
                      <option value="">-- Code --</option>
                      {modalAvailableCodes.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  ) : (
                    <input type="text" placeholder="Code" value={orderForm.code} onChange={e => setOrderForm({ ...orderForm, code: e.target.value })} style={{ padding: '0.45rem 0.6rem', fontSize: '0.85rem', borderRadius: '10px' }} />
                  )}
                </div>
                <div className="input-group" style={{ marginBottom: 0 }}>
                  <label style={{ fontSize: '0.75rem' }}>Color</label>
                  {modalAvailableColors.length > 0 ? (
                    <select value={orderForm.color} onChange={e => setOrderForm({ ...orderForm, color: e.target.value })} style={{ padding: '0.45rem 0.6rem', fontSize: '0.85rem', borderRadius: '10px' }}>
                      <option value="">-- Color --</option>
                      {modalAvailableColors.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  ) : (
                    <input type="text" placeholder="Color" value={orderForm.color} onChange={e => setOrderForm({ ...orderForm, color: e.target.value })} style={{ padding: '0.45rem 0.6rem', fontSize: '0.85rem', borderRadius: '10px' }} />
                  )}
                </div>
                <div className="input-group" style={{ marginBottom: 0 }}>
                  <label style={{ fontSize: '0.75rem' }}>Ordered (Kg) *</label>
                  <input type="number" step="0.01" min="0" value={orderForm.orderedWeight} onChange={e => setOrderForm({ ...orderForm, orderedWeight: e.target.value })} style={{ padding: '0.45rem 0.6rem', fontSize: '0.85rem', borderRadius: '10px' }} />
                </div>
                <div className="input-group" style={{ marginBottom: 0 }}>
                  <label style={{ fontSize: '0.75rem', color: 'var(--accent)', fontWeight: '600' }}>Rate (₹/Kg)</label>
                  <input type="number" step="0.01" min="0" placeholder="e.g. 150.00" value={orderForm.price} onChange={e => setOrderForm({ ...orderForm, price: e.target.value })} style={{ padding: '0.45rem 0.6rem', fontSize: '0.85rem', borderRadius: '10px', borderColor: 'var(--accent)', fontWeight: '600' }} />
                </div>
              </div>
            </div>

            <div style={{marginTop: '2rem'}}>
              <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem'}}>
                <h3>Received Batches</h3>
                {order.status === 'Active' && (
                  <button className="btn btn-primary" onClick={() => { setEditingBatch(null); setShowBatchForm(true); }}>
                    + Add Batch
                  </button>
                )}
              </div>

              {showBatchForm && (
                <BatchForm 
                  order={order} 
                  onCancel={() => setShowBatchForm(false)} 
                  onSubmit={handleBatchSubmit} 
                  initialData={editingBatch} 
                  geminiApiKey={geminiApiKey}
                  selectedGeminiModel={selectedGeminiModel}
                  onOpenSettings={onOpenSettings}
                />
              )}

              <div className="table-responsive">
                <table>
                  <thead>
                    <tr>
                      <th>Received Date</th>
                      <th>Challan #</th>
                      <th>Lot #</th>
                      <th style={{color: 'var(--accent)'}}>Box Number</th>
                      <th style={{color: 'var(--accent)'}}>In cones</th>
                      <th style={{color: 'var(--accent)'}}>In weight(Kg)</th>
                      <th style={{color: 'var(--error)'}}>GR Cones<br/><span style={{fontSize: '0.7rem', fontWeight: 400, opacity: 0.8}}>(Calculated)</span></th>
                      <th style={{color: 'var(--error)'}}>GR (kg)</th>
                      <th style={{color: 'var(--error)'}}>GR Date</th>
                      <th>Net Weight</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {(order.batches || []).length === 0 ? (
                      <tr>
                        <td colSpan="11" style={{textAlign: 'center', padding: '2rem', color: 'var(--muted)'}}>
                          No batches recorded yet. Click "+ Add Batch" to add incoming delivery boxes.
                        </td>
                      </tr>
                    ) : (
                      [...(order.batches || [])].sort((a, b) => new Date(b.receiveDate) - new Date(a.receiveDate)).map((b, bIdx, bArr) => {
                        const grossTotal = (b.boxes || []).reduce((acc, box) => acc + (Number(box.weight) || 0), 0);
                        const grTotal = (b.boxes || []).reduce((acc, box) => acc + (Number(box.returnedWeight) || 0), 0);
                        const conesTotal = (b.boxes || []).reduce((acc, box) => acc + (Number(box.cones) || 0), 0);
                        
                        const calcGRCones = (box) => {
                          if (!box.returnedWeight || !box.weight || !box.cones) return 0;
                          return Math.round(Number(box.returnedWeight) / (Number(box.weight) / Number(box.cones)));
                        };
                        
                        const grConesTotal = (b.boxes || []).reduce((acc, box) => acc + calcGRCones(box), 0);

                        return (
                          <React.Fragment key={b.id}>
                            {(b.boxes || []).map((box, idx) => (
                              <tr key={`${b.id}-${idx}`}>
                                {idx === 0 && (
                                  <React.Fragment>
                                    <td rowSpan={b.boxes.length + 1}>{new Date(b.receiveDate).toLocaleDateString('en-GB')}</td>
                                    <td rowSpan={b.boxes.length + 1}><strong>{b.challanNumber}</strong></td>
                                    <td rowSpan={b.boxes.length + 1}><span style={{fontFamily: 'var(--font-mono)'}}>{b.lotNumber || '-'}</span></td>
                                  </React.Fragment>
                                )}
                                <td style={{fontWeight: '600'}}>{box.boxNumber}</td>
                                <td>{box.cones || '-'}</td>
                                <td>{Number(box.weight || 0).toFixed(2)}</td>
                                <td style={{color: 'var(--error)', fontWeight: '600'}}>{calcGRCones(box) || '-'}</td>
                                <td style={{color: Number(box.returnedWeight) > 0 ? 'var(--error)' : 'inherit'}}>{box.returnedWeight || '0.00'}</td>
                                <td style={{color: 'var(--error)'}}>{box.returnedDate ? new Date(box.returnedDate).toLocaleDateString('en-GB') : '-'}</td>
                                <td>{(Number(box.weight || 0) - (Number(box.returnedWeight) || 0)).toFixed(2)}</td>
                                {idx === 0 && (
                                  <td rowSpan={b.boxes.length + 1}>
                                    <div style={{display: 'flex', gap: '0.4rem', justifyContent: 'center'}}>
                                      <button className="btn btn-outline" style={{padding: '0.3rem 0.6rem'}} onClick={() => { setEditingBatch(b); setShowBatchForm(true); }}>✏️</button>
                                      <button className="btn btn-outline" style={{padding: '0.3rem 0.6rem', color: 'var(--error)', borderColor: 'transparent'}} onClick={() => handleDeleteBatch(b.id)}>🗑️</button>
                                    </div>
                                  </td>
                                )}
                              </tr>
                            ))}
                            <tr key={`${b.id}-total`} style={{background: 'var(--bg)', fontWeight: '700', fontSize: '0.85rem', borderTop: '2px solid var(--border)'}}>
                              <td style={{color: 'var(--muted)', textAlign: 'right', paddingRight: '1rem'}}>BATCH TOTAL</td>
                              <td>{conesTotal || '-'}</td>
                              <td style={{color: 'var(--accent)'}}>{grossTotal.toFixed(2)}</td>
                              <td style={{color: 'var(--error)'}}>{grConesTotal || '-'}</td>
                              <td style={{color: 'var(--error)'}}>{grTotal.toFixed(2)}</td>
                              <td style={{color: 'var(--muted)'}}>-</td>
                              <td style={{color: 'var(--success)', fontSize: '0.95rem'}}>{Number(b.totalWeight || (grossTotal - grTotal)).toFixed(2)} kg</td>
                            </tr>
                            {bIdx < bArr.length - 1 && (
                              <tr key={`${b.id}-sep`}><td colSpan="11" style={{padding: 0, border: 'none', height: '5px', background: '#000000', lineHeight: '0'}}></td></tr>
                            )}
                          </React.Fragment>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>

            {order.status === 'Active' && (
              <div style={{marginTop: '2rem', textAlign: 'right'}}>
                <button 
                  className="btn btn-primary" 
                  style={{background: 'var(--success)'}} 
                  onClick={() => { 
                    if(confirm('Mark this Yarn RM order as Completed?')) { 
                      onComplete(order.id); 
                      onClose(); 
                    } 
                  }}
                >
                  Mark as Completed
                </button>
              </div>
            )}
          </div>
        </div>
      );
    };

    // Component: Batch Form with AI Scan & Mobile QR Upload
    const BatchForm = ({ order, onCancel, onSubmit, initialData, geminiApiKey, selectedGeminiModel, onOpenSettings }) => {
      const [challan, setChallan] = useState(initialData?.challanNumber || '');
      const [receiveDate, setReceiveDate] = useState(initialData?.receiveDate?.split('T')[0] || new Date().toISOString().split('T')[0]);
      const [lotNumber, setLotNumber] = useState(initialData?.lotNumber || '');
      const [boxInputs, setBoxInputs] = useState(initialData?.boxes ? initialData.boxes.map(b => ({...b})) : [{ boxNumber: 'B1', cones: '', weight: '', returnedWeight: '', returnedDate: '' }]);
      const [error, setError] = useState(null);
      const [invalidFields, setInvalidFields] = useState({});
      const [isScanning, setIsScanning] = useState(false);
      const [scanProgress, setScanProgress] = useState(0);
      const [scanStage, setScanStage] = useState('');
      const scanIntervalRef = useRef(null);

      // Mobile QR Upload State
      const [showQrModal, setShowQrModal] = useState(false);
      const [qrSessionId, setQrSessionId] = useState('');
      const [qrStatus, setQrStatus] = useState('waiting');
      const qrPollRef = useRef(null);

      const openQrScanModal = () => {
        const sessionId = 'ch_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now().toString(36);
        setQrSessionId(sessionId);
        setQrStatus('waiting');
        setShowQrModal(true);
      };

      const closeQrScanModal = () => {
        if (qrPollRef.current) {
          clearInterval(qrPollRef.current);
          qrPollRef.current = null;
        }
        setShowQrModal(false);
      };

      useEffect(() => {
        if (!showQrModal || !qrSessionId) return;

        const scanUrl = new URL('../../upload.html', window.location.href).href + `?session=${qrSessionId}&type=challan`;
        
        const t = setTimeout(() => {
          const container = document.getElementById('qr-code-canvas-container-yarn');
          if (container) {
            container.innerHTML = '';
            if (typeof QRCode !== 'undefined') {
              try {
                new QRCode(container, {
                  text: scanUrl,
                  width: 190,
                  height: 190,
                  colorDark: '#0f172a',
                  colorLight: '#ffffff',
                  correctLevel: QRCode.CorrectLevel.M
                });
              } catch(e) {
                const encoded = encodeURIComponent(scanUrl);
                container.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encoded}" alt="QR" style="width:190px;height:190px;border-radius:12px;" />`;
              }
            } else {
              const encoded = encodeURIComponent(scanUrl);
              container.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encoded}" alt="QR" style="width:190px;height:190px;border-radius:12px;" />`;
            }
          }
        }, 60);

        const pollKey = `bl_qr_session_${qrSessionId}`;
        qrPollRef.current = setInterval(async () => {
          let payload = null;
          if (window.VishwaSupabase && typeof window.VishwaSupabase.get === 'function') {
            try {
              payload = await window.VishwaSupabase.get(pollKey);
            } catch(e) {}
          }
          if (!payload) {
            try {
              const raw = localStorage.getItem(pollKey);
              if (raw) payload = JSON.parse(raw);
            } catch(e) {}
          }

          if (payload && payload.imageUrl) {
            clearInterval(qrPollRef.current);
            qrPollRef.current = null;
            setQrStatus('received');
            
            setTimeout(() => {
              setShowQrModal(false);
              setChallan('');
              setLotNumber('');
              setBoxInputs([]);
              setError(null);
              scanChallan(payload.imageUrl);
            }, 600);
          }
        }, 1500);

        return () => {
          clearTimeout(t);
          if (qrPollRef.current) {
            clearInterval(qrPollRef.current);
            qrPollRef.current = null;
          }
        };
      }, [showQrModal, qrSessionId]);

      const scanChallan = async (fileOrDataUrl) => {
        if (!geminiApiKey) {
          setError(
            <span>
              API Key missing. Please configure it in <a href="#" onClick={(e) => { e.preventDefault(); onOpenSettings(); }} style={{ color: 'var(--accent)', textDecoration: 'underline' }}>Settings</a>.
            </span>
          );
          return;
        }

        setIsScanning(true);
        setError(null);
        setScanProgress(8);
        setScanStage('Initializing Gemini AI engine...');

        // Smooth progress animation while in flight
        const startTime = Date.now();
        if (scanIntervalRef.current) clearInterval(scanIntervalRef.current);
        scanIntervalRef.current = setInterval(() => {
          const elapsed = Date.now() - startTime;
          if (elapsed < 1200) {
            setScanProgress(prev => Math.min(28, prev + 3));
            setScanStage('Uploading challan image...');
          } else if (elapsed < 3000) {
            setScanProgress(prev => Math.min(58, prev + 2.5));
            setScanStage('Analyzing challan header & supplier data...');
          } else if (elapsed < 6000) {
            setScanProgress(prev => Math.min(84, prev + 1.5));
            setScanStage('Extracting box weights, lot & cones breakdown...');
          } else {
            setScanProgress(prev => Math.min(94, prev + 0.5));
            setScanStage('Parsing & validating extracted fields...');
          }
        }, 150);

        try {
          let base64 = '';
          let mimeType = 'image/jpeg';

          if (typeof fileOrDataUrl === 'string') {
            if (fileOrDataUrl.startsWith('data:')) {
              const match = fileOrDataUrl.match(/^data:([^;]+);base64,(.+)$/);
              if (match) {
                mimeType = match[1];
                base64 = match[2];
              } else {
                base64 = fileOrDataUrl.split(',')[1] || fileOrDataUrl;
              }
            } else {
              base64 = fileOrDataUrl;
            }
          } else if (fileOrDataUrl instanceof File || fileOrDataUrl instanceof Blob) {
            mimeType = fileOrDataUrl.type || 'image/jpeg';
            base64 = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result.split(',')[1]);
              reader.onerror = reject;
              reader.readAsDataURL(fileOrDataUrl);
            });
          }

          const prompt = `Extract details from this yarn challan image. Return ONLY a JSON object with: 
            {
              "supplier": "Name of supplier",
              "quality": "Quality/Yarn details",
              "challanNumber": "Challan number",
              "receiveDate": "Date in dd-mm-yyyy format",
              "lotNumber": "Lot number",
              "boxes": [{"boxNumber": "B1", "cones": 24, "weight": 60.5}, ...]
            }`;

          const modelConfigs = [
            { id: selectedGeminiModel || 'gemini-2.0-flash', ver: 'v1beta' },
            { id: 'gemini-2.0-flash', ver: 'v1beta' },
            { id: 'gemini-2.5-flash', ver: 'v1beta' },
            { id: 'gemini-flash-latest', ver: 'v1' }
          ];
          
          const uniqueConfigs = [];
          const seenIds = new Set();
          for (const config of modelConfigs) {
            const key = `${config.id}-${config.ver}`;
            if (!seenIds.has(key)) {
              uniqueConfigs.push(config);
              seenIds.add(key);
            }
          }

          let success = false;
          let lastError = "";

          for (const config of uniqueConfigs) {
            try {
              const response = await fetch(`https://generativelanguage.googleapis.com/${config.ver}/models/${config.id}:generateContent?key=${geminiApiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{
                    parts: [
                      { text: prompt },
                      { inline_data: { mime_type: mimeType, data: base64 } }
                    ]
                  }]
                })
              });

              const result = await response.json();
              if (result.error) {
                lastError = `${config.id} (${config.ver}): ${result.error.message}`;
                continue;
              }

              if (!result.candidates || !result.candidates[0]) {
                lastError = `${config.id}: No candidates returned.`;
                continue;
              }

              const text = result.candidates[0].content.parts[0].text;
              const jsonMatch = text.match(/\{[\s\S]*\}/);
              if (!jsonMatch) throw new Error("Could not parse data from image.");
              
              const data = JSON.parse(jsonMatch[0]);

              setChallan(data.challanNumber || '');
              setLotNumber(data.lotNumber || '');
              
              if (data.receiveDate) {
                const parts = data.receiveDate.split('-');
                if (parts.length === 3) {
                  setReceiveDate(`${parts[2]}-${parts[1]}-${parts[0]}`);
                }
              }

              if (data.boxes && Array.isArray(data.boxes)) {
                setBoxInputs(data.boxes.map(b => ({
                  boxNumber: b.boxNumber || '',
                  cones: b.cones || '',
                  weight: b.weight || '',
                  returnedWeight: '',
                  returnedDate: ''
                })));
              }

              success = true;
              break;
            } catch (e) {
              lastError = e.message;
            }
          }

          if (!success) throw new Error(lastError || "All models failed to respond.");

          clearInterval(scanIntervalRef.current);
          setScanProgress(100);
          setScanStage('✨ Extraction complete! Populating details...');
          await new Promise(r => setTimeout(r, 400));

        } catch (err) {
          if (scanIntervalRef.current) clearInterval(scanIntervalRef.current);
          setError("Failed to scan challan: " + err.message);
        } finally {
          if (scanIntervalRef.current) clearInterval(scanIntervalRef.current);
          setIsScanning(false);
        }
      };

      const handleSubmit = () => {
        const errors = [];
        const newInvalids = {};
        
        if (!challan) {
          errors.push('Challan Number is required.');
          newInvalids.challan = true;
        }
        if (!receiveDate) {
          errors.push('Received Date is required.');
          newInvalids.receiveDate = true;
        }

        const validBoxes = boxInputs.filter(b => b.weight !== '');
        if (validBoxes.length === 0) {
          errors.push('Add at least one box weight.');
        }

        boxInputs.forEach((b, i) => {
          const w = b.weight !== '' ? Number(b.weight) : null;
          const c = b.cones !== '' ? Number(b.cones) : null;

          if (w !== null || c !== null || b.returnedWeight !== '' || b.returnedDate !== '') {
            if (w === null || w <= 0) {
              errors.push(`Weight must be > 0 for ${b.boxNumber}`);
              newInvalids[`weight-${i}`] = true;
            }
            if (c === null || c <= 0) {
              errors.push(`Cones must be > 0 for ${b.boxNumber}`);
              newInvalids[`cones-${i}`] = true;
            }
            if (Number(b.returnedWeight) > 0 && !b.returnedDate) {
              errors.push(`Provide GR Date for ${b.boxNumber}`);
              newInvalids[`grDate-${i}`] = true;
            }
            if (w !== null && Number(b.returnedWeight) > w) {
              errors.push(`GR weight cannot exceed Box weight for ${b.boxNumber}`);
              newInvalids[`gr-${i}`] = true;
            }
          }
        });

        if (errors.length > 0) {
          setInvalidFields(newInvalids);
          setError(errors);
          return;
        }

        setError(null);
        setInvalidFields({});
        const boxes = validBoxes.map(b => ({ ...b, cones: Number(b.cones), weight: Number(b.weight), returnedWeight: Number(b.returnedWeight) || 0 }));
        const tw = boxes.reduce((acc, b) => acc + (b.weight - b.returnedWeight), 0);
        onSubmit({ challanNumber: challan, receiveDate, lotNumber, boxes, totalWeight: tw });
      };

      const inputStyle = (isInvalid) => ({
        border: isInvalid ? '1.5px solid var(--error)' : '1px solid var(--border)',
        background: isInvalid ? 'rgba(239, 68, 68, 0.05)' : 'var(--surface)'
      });

      return (
        <div className="card" style={{border: '1.5px solid var(--accent)', marginBottom: '1.5rem', position: 'relative'}}>
          {/* Enhanced Gemini AI Progress Bar Overlay */}
          {isScanning && (
            <div className="loading-overlay" style={{
              background: 'rgba(15, 23, 42, 0.92)',
              backdropFilter: 'blur(8px)',
              WebkitBackdropFilter: 'blur(8px)',
              padding: '2.25rem 1.5rem',
              color: '#ffffff',
              borderRadius: 'var(--radius)',
              zIndex: 30,
              textAlign: 'center'
            }}>
              <div className="ai-scan-glow-ring">
                <span style={{ fontSize: '28px', animation: 'spinSlow 6s linear infinite' }}>✨</span>
              </div>

              <div style={{
                display: 'inline-flex',
                alignItems: 'center',
                gap: '0.45rem',
                padding: '0.3rem 0.9rem',
                borderRadius: '20px',
                background: 'rgba(139, 92, 246, 0.25)',
                border: '1px solid rgba(139, 92, 246, 0.45)',
                fontSize: '0.78rem',
                fontWeight: '700',
                letterSpacing: '0.04em',
                textTransform: 'uppercase',
                color: '#c4b5fd',
                marginBottom: '0.85rem'
              }}>
                <span className="live-dot-pulse"></span>
                Gemini Vision AI
              </div>

              <h4 style={{ margin: '0 0 0.35rem', fontSize: '1.2rem', fontWeight: '700', color: '#ffffff' }}>
                Scanning Challan Document
              </h4>
              
              <div className="scan-progress-bar-bg" style={{ width: '100%', maxWidth: '340px', margin: '0.9rem auto 0.4rem' }}>
                <div 
                  className="scan-progress-bar-fill" 
                  style={{ width: `${Math.max(4, scanProgress)}%` }} 
                />
              </div>

              <div style={{
                display: 'flex',
                justifyContent: 'space-between',
                width: '100%',
                maxWidth: '340px',
                fontSize: '0.82rem',
                margin: '0.25rem auto 0'
              }}>
                <span style={{ color: '#94a3b8', fontWeight: '500' }}>{scanStage}</span>
                <span style={{ fontFamily: 'var(--font-mono)', fontWeight: '700', color: '#a78bfa' }}>
                  {Math.round(scanProgress)}%
                </span>
              </div>

              <button
                type="button"
                className="btn btn-outline"
                style={{
                  marginTop: '1.5rem',
                  padding: '0.35rem 1.1rem',
                  fontSize: '0.8rem',
                  color: '#94a3b8',
                  borderColor: 'rgba(255,255,255,0.2)',
                  borderRadius: '20px'
                }}
                onClick={() => {
                  if (scanIntervalRef.current) clearInterval(scanIntervalRef.current);
                  setIsScanning(false);
                }}
              >
                Cancel
              </button>
            </div>
          )}

          {/* Mobile QR Upload Modal */}
          {showQrModal && (
            <div className="modal-overlay" style={{ zIndex: 10000 }}>
              <div className="modal" style={{ maxWidth: '460px', textAlign: 'center', padding: '2rem 1.75rem' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.25rem' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                    <span style={{ fontSize: '1.4rem' }}>📱</span>
                    <h3 style={{ margin: 0, fontSize: '1.15rem' }}>Scan with Mobile</h3>
                  </div>
                  <button 
                    type="button"
                    className="btn btn-outline" 
                    style={{ border: 'none', padding: '0.3rem 0.6rem', fontSize: '1.1rem', lineHeight: 1 }}
                    onClick={closeQrScanModal}
                  >
                    ✕
                  </button>
                </div>

                <p style={{ fontSize: '0.85rem', color: 'var(--muted)', marginBottom: '1.25rem', lineHeight: 1.4 }}>
                  Scan this QR code with your phone camera to take a photo or select the challan from your gallery.
                </p>

                <div style={{
                  display: 'flex',
                  justifyContent: 'center',
                  alignItems: 'center',
                  margin: '0 auto 1.25rem',
                  padding: '1rem',
                  background: '#ffffff',
                  borderRadius: '16px',
                  boxShadow: '0 8px 24px rgba(0,0,0,0.12)',
                  width: '210px',
                  height: '210px'
                }}>
                  <div id="qr-code-canvas-container-yarn" style={{ width: '190px', height: '190px' }}></div>
                </div>

                <div style={{
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  gap: '0.5rem',
                  padding: '0.6rem 1rem',
                  borderRadius: '10px',
                  background: qrStatus === 'received' ? 'rgba(16, 185, 129, 0.12)' : 'rgba(139, 92, 246, 0.1)',
                  color: qrStatus === 'received' ? 'var(--success)' : 'var(--accent)',
                  fontWeight: '600',
                  fontSize: '0.85rem',
                  marginBottom: '1.25rem'
                }}>
                  <span className={qrStatus === 'received' ? '' : 'live-dot-pulse'}></span>
                  {qrStatus === 'received' ? '✅ Photo received! Analyzing...' : 'Waiting for phone camera upload...'}
                </div>

                <div style={{ display: 'flex', gap: '0.5rem' }}>
                  <button
                    type="button"
                    className="btn btn-outline"
                    style={{ flex: 1, padding: '0.6rem', fontSize: '0.82rem', justifyContent: 'center' }}
                    onClick={() => {
                      const url = new URL('../../upload.html', window.location.href).href + `?session=${qrSessionId}&type=challan`;
                      navigator.clipboard.writeText(url);
                      alert('Upload link copied to clipboard!');
                    }}
                  >
                    📋 Copy Link
                  </button>
                  <button
                    type="button"
                    className="btn btn-outline"
                    style={{ padding: '0.6rem 1rem', fontSize: '0.82rem' }}
                    onClick={() => {
                      const url = new URL('../../upload.html', window.location.href).href + `?session=${qrSessionId}&type=challan`;
                      window.open(url, '_blank');
                    }}
                    title="Open upload form in a new tab"
                  >
                    ↗️ Open Tab
                  </button>
                </div>
              </div>
            </div>
          )}
          
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem', paddingBottom: '1rem', borderBottom: '1px solid var(--border)' }}>
            <h3 style={{ margin: 0 }}>{initialData ? 'Edit Batch' : 'Add New Batch'}</h3>
            <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'center', flexWrap: 'wrap' }}>
              <button 
                type="button"
                className="btn btn-outline" 
                style={{ color: 'var(--error)', borderColor: 'var(--error)', padding: '0.4rem 0.8rem' }}
                onClick={() => {
                  setChallan('');
                  setLotNumber('');
                  setBoxInputs([{ boxNumber: 'B1', cones: '', weight: '', returnedWeight: '', returnedDate: '' }]);
                  setError(null);
                }}
              >
                🔄 Reset
              </button>
              <button 
                type="button"
                className="btn btn-outline"
                style={{ padding: '0.4rem 0.8rem', display: 'inline-flex', alignItems: 'center', gap: '0.35rem' }}
                onClick={openQrScanModal}
                title="Scan QR with phone camera to upload photo"
              >
                📱 Phone Upload
              </button>
              <label className="btn btn-outline" style={{ cursor: 'pointer', margin: 0, padding: '0.4rem 0.8rem', display: 'inline-flex', alignItems: 'center', gap: '0.35rem' }}>
                📷 Scan Challan
                <input 
                  type="file" 
                  accept="image/*" 
                  style={{ display: 'none' }} 
                  onChange={(e) => {
                    if (e.target.files?.[0]) {
                      const file = e.target.files[0];
                      e.target.value = '';
                      setChallan('');
                      setLotNumber('');
                      setBoxInputs([]);
                      setError(null);
                      scanChallan(file);
                    }
                  }} 
                />
              </label>
            </div>
          </div>

          <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '1rem', marginBottom: '1.25rem'}}>
            <div className="input-group" style={{marginBottom: 0}}>
              <label>Received Date</label>
              <input type="date" style={inputStyle(invalidFields.receiveDate)} value={receiveDate} onChange={e => setReceiveDate(e.target.value)} />
            </div>
            <div className="input-group" style={{marginBottom: 0}}>
              <label>Challan Number</label>
              <input type="text" style={inputStyle(invalidFields.challan)} value={challan} onChange={e => setChallan(e.target.value)} placeholder="e.g. CH-9901" />
            </div>
            <div className="input-group" style={{marginBottom: 0}}>
              <label>Lot Number</label>
              <input type="text" value={lotNumber} onChange={e => setLotNumber(e.target.value)} placeholder="e.g. LOT-24A" />
            </div>
          </div>
          
          <div style={{display: 'grid', gridTemplateColumns: '1fr 0.8fr 1fr 1fr 1.5fr auto', gap: '0.5rem', marginBottom: '0.5rem', padding: '0 0.5rem'}}>
            <div style={{fontSize: '0.75rem', fontWeight: '700', color: 'var(--muted)'}}>BOX NUMBER</div>
            <div style={{fontSize: '0.75rem', fontWeight: '700', color: 'var(--muted)'}}>IN CONES</div>
            <div style={{fontSize: '0.75rem', fontWeight: '700', color: 'var(--muted)'}}>IN WEIGHT (KG)</div>
            <div style={{fontSize: '0.75rem', fontWeight: '700', color: 'var(--error)'}}>GR (KG)</div>
            <div style={{fontSize: '0.75rem', fontWeight: '700', color: 'var(--error)'}}>GR DATE</div>
            <div style={{width: '32px'}}></div>
          </div>

          {boxInputs.map((box, i) => (
            <div key={i} style={{display: 'grid', gridTemplateColumns: '1fr 0.8fr 1fr 1fr 1.5fr auto', gap: '0.5rem', marginBottom: '0.5rem', alignItems: 'center'}}>
              <input type="text" value={box.boxNumber} onChange={e => { let n = [...boxInputs]; n[i] = { ...n[i], boxNumber: e.target.value }; setBoxInputs(n); }} />
              <input type="number" step="1" min="0" style={inputStyle(invalidFields[`cones-${i}`])} placeholder="Cones" value={box.cones} onChange={e => { 
                let val = e.target.value;
                if (val !== '' && Number(val) < 0) return;
                let n = [...boxInputs]; 
                n[i] = { ...n[i], cones: val }; 
                setBoxInputs(n); 
              }} />
              <input type="number" min="0" style={inputStyle(invalidFields[`weight-${i}`])} placeholder="Weight" value={box.weight} onChange={e => { 
                let val = e.target.value;
                if (val !== '' && Number(val) < 0) return;
                let n = [...boxInputs]; 
                n[i] = { ...n[i], weight: val }; 
                setBoxInputs(n); 
              }} />
              <input type="number" min="0" style={inputStyle(invalidFields[`gr-${i}`])} placeholder="GR" value={box.returnedWeight} onChange={e => { 
                let val = e.target.value;
                if (val !== '' && Number(val) < 0) return;
                let n = [...boxInputs]; 
                n[i] = { ...n[i], returnedWeight: val }; 
                if (!val || Number(val) === 0) n[i].returnedDate = '';
                setBoxInputs(n); 
              }} />
              <input type="date" style={inputStyle(invalidFields[`grDate-${i}`])} value={box.returnedDate || ''} disabled={!box.returnedWeight} min={receiveDate} onChange={e => { let n = [...boxInputs]; n[i] = { ...n[i], returnedDate: e.target.value }; setBoxInputs(n); }} />
              <button 
                type="button"
                className="btn btn-outline" 
                style={{ padding: '0.4rem', color: 'var(--error)', borderColor: 'transparent', width: '32px', height: '32px', justifyContent: 'center' }}
                onClick={() => {
                  const newInputs = boxInputs.filter((_, idx) => idx !== i);
                  setBoxInputs(newInputs.length > 0 ? newInputs : [{ boxNumber: 'B1', cones: '', weight: '', returnedWeight: '', returnedDate: '' }]);
                }}
                title="Remove row"
              >
                ✖
              </button>
            </div>
          ))}
          
          <button type="button" className="btn btn-outline" style={{width: '100%', marginTop: '0.5rem'}} onClick={() => setBoxInputs([...boxInputs, { boxNumber: `B${boxInputs.length + 1}`, cones: '', weight: '', returnedWeight: '', returnedDate: '' }])}>
            + Add Box
          </button>
          
          {error && (
            <div style={{ 
              padding: '1rem', 
              background: 'rgba(239, 68, 68, 0.1)', 
              color: 'var(--error)', 
              borderRadius: '10px', 
              fontSize: '0.85rem', 
              marginTop: '1.5rem',
              border: '1px solid rgba(239, 68, 68, 0.2)',
            }}>
              <div style={{fontWeight: '700', marginBottom: '0.4rem', display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
                <span>⚠️ Error</span>
              </div>
              <div style={{opacity: 0.9, margin: 0}}>
                {Array.isArray(error) ? error.map((err, idx) => (
                  <div key={idx} style={{marginBottom: '0.2rem'}}>- {err}</div>
                )) : error}
              </div>
            </div>
          )}

          <div style={{display: 'flex', gap: '1rem', marginTop: '1.5rem'}}>
            <button className="btn btn-primary" style={{flex: 1}} onClick={handleSubmit}>Save</button>
            <button className="btn btn-outline" onClick={onCancel}>Cancel</button>
          </div>
        </div>
      );
    };

    // Component: Full Analytics View (Exact match of Weaving RM order analytics)
    const AnalyticsView = ({
      orders,
      qualities,
      suppliers,
      selectedQuality,
      setSelectedQuality,
      selectedSupplier,
      setSelectedSupplier,
      selectedCode,
      setSelectedCode,
      selectedColor,
      setSelectedColor,
      fromDate,
      setFromDate,
      toDate,
      setToDate,
      filterType,
      setFilterType,
      setOrderSort,
      highlightedOrderId,
      setHighlightedOrderId,
      isolatedOrderId,
      setIsolatedOrderId,
      setSelectedOrder,
      setOrderSearch,
      setView,
      onGRClick,
      onCardClick,
      timelineDirection,
      setTimelineDirection,
      timelineScrollPos,
      setTimelineScrollPos
    }) => {
      const chartRef = useRef(null);
      const chartInstance = useRef(null);
      const timelineRef = useRef(null);
      const savedScrollPos = useRef(timelineScrollPos);

      // Save scroll position in real-time
      useEffect(() => {
        const container = timelineRef.current;
        if (!container) return;

        const handleScroll = () => {
          setTimelineScrollPos(container.scrollLeft);
        };

        container.addEventListener('scroll', handleScroll, { passive: true });
        return () => container.removeEventListener('scroll', handleScroll);
      }, [setTimelineScrollPos]);

      const allCombinations = useMemo(() => {
        const cleanOrders = (window.VishwaSupabase && typeof window.VishwaSupabase.filterDeletedEntities === 'function')
          ? window.VishwaSupabase.filterDeletedEntities(orders)
          : orders;
        const cleanQualities = (window.VishwaSupabase && typeof window.VishwaSupabase.filterDeletedEntities === 'function')
          ? window.VishwaSupabase.filterDeletedEntities(qualities)
          : qualities;

        const combos = [];
        (cleanOrders || []).forEach(o => combos.push({ 
          quality: o.quality, 
          supplier: o.supplier, 
          code: o.code || '', 
          color: o.color || '', 
          type: o.category || o.type || 'Polyester' 
        }));
        (cleanQualities || []).forEach(q => {
          combos.push({ 
            quality: q.quality, 
            supplier: q.supplier, 
            code: q.code || '', 
            color: q.color || '', 
            type: q.type || 'Polyester' 
          });
        });

        const seen = new Set();
        let list = combos.filter(c => {
          const key = `${c.quality}|${c.supplier}|${c.code}|${c.color}|${c.type}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
        if (window.VishwaSupabase && typeof window.VishwaSupabase.filterDeletedEntities === 'function') {
          list = window.VishwaSupabase.filterDeletedEntities(list);
        }
        return list;
      }, [qualities, orders]);

      const getOptions = (field) => {
        const otherFilters = {
          quality: selectedQuality,
          supplier: selectedSupplier,
          code: selectedCode,
          color: selectedColor,
          type: filterType === 'All' ? null : filterType
        };
        delete otherFilters[field];

        const relevantCombos = allCombinations.filter(c => 
          Object.keys(otherFilters).every(k => !otherFilters[k] || c[k] === otherFilters[k])
        );
        return [...new Set(relevantCombos.map(c => c[field]).filter(Boolean))].sort();
      };

      const analyticsData = useMemo(() => {
        if (!selectedQuality && !selectedSupplier && !selectedCode && !selectedColor && filterType === 'All') return [];
        let data = orders.filter(o => {
          const itemCat = o.category || o.type || 'Polyester';
          const matchesFilters = (!selectedQuality || o.quality === selectedQuality) && 
                                 (!selectedSupplier || o.supplier === selectedSupplier) &&
                                 (!selectedCode || o.code === selectedCode) &&
                                 (!selectedColor || o.color === selectedColor) &&
                                 (filterType === 'All' || itemCat === filterType);

          if (!matchesFilters) return false;

          const oDate = o.orderDate || (o.createdAt ? o.createdAt.split('T')[0] : '');
          if (fromDate && oDate < fromDate) return false;
          if (toDate && oDate > toDate) return false;
          return true;
        });
        
        if (isolatedOrderId) {
          data = data.filter(o => o.id === isolatedOrderId);
        }

        return data.sort((a, b) => new Date(a.orderDate || a.createdAt) - new Date(b.orderDate || b.createdAt));
      }, [selectedQuality, selectedSupplier, selectedCode, selectedColor, fromDate, toDate, orders, filterType, isolatedOrderId]);

      const lifecycleStats = useMemo(() => {
        if (analyticsData.length === 0) return null;

        const calculateWeights = (orderList) => {
          let ordered = 0;
          let received = 0;
          let gr = 0;
          orderList.forEach(o => {
            ordered += Number(o.orderedWeight) || 0;
            (o.batches || []).forEach(b => {
              received += Number(b.totalWeight) || 0;
              (b.boxes || []).forEach(box => {
                gr += (Number(box.returnedWeight) || 0);
              });
            });
          });
          return { ordered, received, gr };
        };

        const active = analyticsData.filter(o => o.status === 'Active');
        const completed = analyticsData.filter(o => o.status === 'Completed');

        const activeWeights = calculateWeights(active);
        const completedWeights = calculateWeights(completed);
        const totalWeights = calculateWeights(analyticsData);

        const activePending = Math.max(0, activeWeights.ordered - activeWeights.received);

        return {
          active: {
            count: active.length,
            load: activeWeights.ordered,
            gr: activeWeights.gr,
            pending: activePending
          },
          completed: {
            count: completed.length,
            load: completedWeights.ordered,
            gr: completedWeights.gr,
            received: completedWeights.received
          },
          total: {
            count: analyticsData.length,
            load: totalWeights.ordered,
            gr: totalWeights.gr,
            received: totalWeights.received
          }
        };
      }, [analyticsData]);

      const timelineEvents = useMemo(() => {
        if (!selectedQuality && !selectedSupplier && !selectedCode && !selectedColor && filterType === 'All') return [];

        const events = [];
        const GROUP_COLORS = ['#8b5cf6', '#ec4899', '#3b82f6', '#f59e0b', '#10b981', '#6366f1'];

        const matchingOrders = orders.filter(o => {
          const itemCat = o.category || o.type || 'Polyester';
          return (!selectedQuality || o.quality === selectedQuality) && 
                 (!selectedSupplier || o.supplier === selectedSupplier) &&
                 (!selectedCode || o.code === selectedCode) &&
                 (!selectedColor || o.color === selectedColor) &&
                 (filterType === 'All' || itemCat === filterType);
        }).sort((a, b) => new Date(a.orderDate || a.createdAt) - new Date(b.orderDate || b.createdAt));

        matchingOrders.forEach((order, idx) => {
          if (isolatedOrderId && order.id !== isolatedOrderId) return;
          
          const groupColor = GROUP_COLORS[idx % GROUP_COLORS.length];
          const dealNum = idx + 1;

          const oDateStr = order.orderDate || (order.createdAt ? order.createdAt.split('T')[0] : '');
          const oDate = new Date(oDateStr);
          const isOrderInRange = (!fromDate || oDateStr >= fromDate) && (!toDate || oDateStr <= toDate);

          if (isOrderInRange) {
            events.push({
              type: 'order',
              orderId: order.id,
              groupColor,
              dealNum,
              date: oDate,
              data: { ...order, status: order.status }
            });
          }

          (order.batches || []).forEach(batch => {
            const aDateStr = batch.receiveDate || (batch.receivedAt ? batch.receivedAt.split('T')[0] : '');
            const aDate = new Date(aDateStr);
            const effectiveADate = aDate < oDate ? oDate : aDate;

            const isArrivalInRange = (!fromDate || aDateStr >= fromDate) && (!toDate || aDateStr <= toDate);
            const grossWeight = (batch.boxes || []).reduce((acc, box) => acc + (Number(box.weight) || 0), 0);

            if (isArrivalInRange) {
              events.push({
                type: 'arrival',
                orderId: order.id,
                groupColor,
                dealNum,
                date: effectiveADate,
                data: { ...batch, quality: order.quality, code: order.code, color: order.color, grossWeight }
              });
            }

            let totalBatchGRWeight = 0;
            let latestGRDateStr = null;
            (batch.boxes || []).forEach(box => {
              const rw = Number(box.returnedWeight) || 0;
              if (rw > 0 && box.returnedDate) {
                totalBatchGRWeight += rw;
                if (!latestGRDateStr || box.returnedDate > latestGRDateStr) {
                  latestGRDateStr = box.returnedDate;
                }
              }
            });

            if (totalBatchGRWeight > 0 && latestGRDateStr) {
              const grDate = new Date(latestGRDateStr);
              const effectiveGRDate = grDate < oDate ? oDate : grDate;

              const isGRInRange = (!fromDate || latestGRDateStr >= fromDate) && (!toDate || latestGRDateStr <= toDate);
              if (isGRInRange) {
                events.push({
                  type: 'gr',
                  orderId: order.id,
                  groupColor,
                  dealNum,
                  date: effectiveGRDate,
                  data: { 
                    weight: totalBatchGRWeight, 
                    quality: order.quality, 
                    code: order.code, 
                    color: order.color, 
                    challanNumber: batch.challanNumber 
                  }
                });
              }
            }
          });
        });

        return events.sort((a, b) => {
          const dateDiff = timelineDirection === 'RTL' ? b.date - a.date : a.date - b.date;
          if (dateDiff !== 0) return dateDiff;
          const priority = { 'gr': 3, 'arrival': 2, 'order': 1 };
          return timelineDirection === 'RTL' ? priority[b.type] - priority[a.type] : priority[a.type] - priority[b.type];
        });
      }, [selectedSupplier, selectedQuality, selectedCode, selectedColor, fromDate, toDate, orders, filterType, isolatedOrderId, timelineDirection]);

      // Restoration effect for scroll
      React.useLayoutEffect(() => {
        if (timelineRef.current && !isolatedOrderId && timelineScrollPos > 0) {
          const container = timelineRef.current;
          container.scrollLeft = timelineScrollPos;
          const timer = setTimeout(() => { if (container) container.scrollLeft = timelineScrollPos; }, 50);
          const frame = requestAnimationFrame(() => { if (container) container.scrollLeft = timelineScrollPos; });
          return () => { clearTimeout(timer); cancelAnimationFrame(frame); };
        }
      }, [timelineEvents, isolatedOrderId]);

      const grStats = useMemo(() => {
        if (!selectedQuality && !selectedSupplier && !selectedCode && !selectedColor && filterType === 'All') return null;

        let ordersWithGRCount = 0;
        let totalOrdered = 0;
        let grossWeight = 0;
        let returnedWeight = 0;

        analyticsData.forEach(order => {
          let hasGRInRange = false;
          let orderGrossInRange = 0;
          let orderReturnedInRange = 0;

          (order.batches || []).forEach(batch => {
            const aDate = batch.receiveDate || (batch.receivedAt ? batch.receivedAt.split('T')[0] : '');
            const isArrivalInRange = (!fromDate || aDate >= fromDate) && (!toDate || aDate <= toDate);

            if (isArrivalInRange) {
              (batch.boxes || []).forEach(box => {
                orderGrossInRange += (Number(box.weight) || 0);
                const rw = (Number(box.returnedWeight) || 0);
                orderReturnedInRange += rw;
                if (rw > 0) hasGRInRange = true;
              });
            }
          });

          if (hasGRInRange) {
            ordersWithGRCount++;
            totalOrdered += Number(order.orderedWeight) || 0;
            grossWeight += orderGrossInRange;
            returnedWeight += orderReturnedInRange;
          }
        });

        if (ordersWithGRCount === 0) return null;
        const netWeight = grossWeight - returnedWeight;
        const returnRate = grossWeight > 0 ? (returnedWeight / grossWeight) * 100 : 0;
        return { ordersWithGRCount, totalOrdered, grossWeight, returnedWeight, netWeight, returnRate };
      }, [analyticsData, fromDate, toDate]);

      const chartData = useMemo(() => {
        if (analyticsData.length === 0) return null;
        const chartLabel = selectedQuality ? `Rate (₹) for ${selectedQuality}` : 'Rate (₹)';
        return {
          labels: analyticsData.map(o => new Date(o.orderDate || o.createdAt).toLocaleDateString('en-GB')),
          datasets: [{
            label: chartLabel,
            data: analyticsData.map(o => Number(o.price) || 0),
            borderColor: '#8b5cf6',
            backgroundColor: 'rgba(139, 92, 246, 0.1)',
            borderWidth: 3,
            fill: true,
            tension: 0.3,
            pointBackgroundColor: '#ec4899',
            pointBorderColor: '#fff',
            pointRadius: 5,
            pointHoverRadius: 8
          }]
        };
      }, [analyticsData, selectedQuality]);

      useEffect(() => {
        if (chartRef.current && chartData) {
          if (chartInstance.current) chartInstance.current.destroy();
          const ctx = chartRef.current.getContext('2d');
          chartInstance.current = new Chart(ctx, {
            type: 'line',
            data: chartData,
            options: {
              responsive: true,
              maintainAspectRatio: false,
              onHover: (event, chartElement) => {
                event.native.target.style.cursor = chartElement.length ? 'pointer' : 'default';
              },
              onClick: (event, elements) => {
                if (elements.length > 0) {
                  const index = elements[0].index;
                  const order = analyticsData[index];
                  if (order) {
                    setSelectedQuality(order.quality);
                    setSelectedSupplier(order.supplier);
                    setSelectedCode(order.code || '');
                    setSelectedColor(order.color || '');
                    setFilterType(order.category || order.type || 'All');
                    setFromDate('');
                    setToDate('');
                    
                    setOrderSearch(order.id);
                    
                    setHighlightedOrderId(null);
                    setIsolatedOrderId(null);
                    setView('orders');
                  }
                }
              },
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: (context) => {
                      const order = analyticsData && analyticsData[context.dataIndex];
                      if (!order) return `Rate: ₹${context.raw}`;
                      const date = new Date(order.orderDate || order.createdAt).toLocaleDateString('en-GB');
                      return [
                        `Date: ${date}`,
                        `Quality: ${order.quality}`,
                        `Code: ${order.code || '-'}`,
                        `Color: ${order.color || '-'}`,
                        `Rate: ₹${context.raw}`
                      ];
                    }
                  }
                }
              },
              scales: {
                y: { beginAtZero: false, grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { callback: (value) => '₹' + value } },
                x: { grid: { display: false } }
              }
            }
          });
        }
        return () => { if (chartInstance.current) chartInstance.current.destroy(); };
      }, [chartData]);

      const handleEventClick = (event) => {
        const orderId = event.orderId;
        const parentOrder = orders.find(o => o.id === orderId);

        if (parentOrder) {
          setFromDate('');
          setToDate('');
          setSelectedQuality(parentOrder.quality);
          setSelectedSupplier(parentOrder.supplier);
          setSelectedCode(parentOrder.code || '');
          setSelectedColor(parentOrder.color || '');
          setFilterType(parentOrder.category || parentOrder.type || 'All');

          if (event.type === 'order') {
            setOrderSearch(parentOrder.id);
          } else {
            setOrderSearch(parentOrder.id);
            setSelectedOrder(parentOrder);
          }
          setView('orders');
        }
      };

      const handleNodeClick = (e, orderId) => {
        e.stopPropagation();
        
        if (!highlightedOrderId) {
          if (timelineRef.current) {
            savedScrollPos.current = timelineRef.current.scrollLeft;
          }
        }

        if (highlightedOrderId !== orderId) {
          setHighlightedOrderId(orderId);
          setIsolatedOrderId(null);
        } else if (!isolatedOrderId) {
          setIsolatedOrderId(orderId);
        } else {
          setIsolatedOrderId(null);
          setHighlightedOrderId(null);
        }
      };

      const handleSelect = (field, value) => {
        const newFilters = {
          quality: selectedQuality,
          supplier: selectedSupplier,
          code: selectedCode,
          color: selectedColor,
          [field]: value
        };

        let currentFiltered = allCombinations.filter(c => {
          return (!newFilters.quality || c.quality === newFilters.quality) &&
                 (!newFilters.code || c.code === newFilters.code) &&
                 (!newFilters.color || c.color === newFilters.color) &&
                 (!newFilters.supplier || c.supplier === newFilters.supplier) &&
                 (filterType === 'All' || c.type === filterType);
        });

        const updated = { ...newFilters };
        ['quality', 'supplier', 'code', 'color'].forEach(f => {
          const options = [...new Set(currentFiltered.map(item => item[f]))].filter(Boolean);
          if (options.length === 1) updated[f] = options[0];
        });

        setSelectedQuality(updated.quality || '');
        setSelectedSupplier(updated.supplier || '');
        setSelectedCode(updated.code || '');
        setSelectedColor(updated.color || '');
      };

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '2rem' }} onClick={(e) => {
          if (e.target.closest('.timeline-container, .ob-arrival-timeline')) return;
          setHighlightedOrderId(null);
          setIsolatedOrderId(null);
        }}>
          <div className="card" style={{ overflow: 'visible', zIndex: 100 }}>
            <div className="ob-filter-toolbar">
              <h3>Analytics Filters</h3>
              <div className="ob-filter-type-toggle">
                {['All', 'Polyester', 'Nylon', 'Viscose'].map(type => (
                  <button 
                    key={type}
                    className="btn" 
                    style={{
                      padding: '0.4rem 1rem', 
                      fontSize: '0.85rem',
                      background: filterType === type ? 'var(--surface)' : 'transparent',
                      boxShadow: filterType === type ? 'var(--shadow-sm)' : 'none',
                      color: filterType === type ? 'var(--accent)' : 'var(--muted)'
                    }}
                    onClick={() => {
                      const currentFilters = { quality: selectedQuality, supplier: selectedSupplier, code: selectedCode, color: selectedColor };
                      const newFilters = { ...currentFilters, type: type === 'All' ? null : type };
                      let filtered = allCombinations.filter(c => {
                        return (!newFilters.type || c.type === newFilters.type) &&
                               (!newFilters.quality || c.quality === newFilters.quality) &&
                               (!newFilters.code || c.code === newFilters.code) &&
                               (!newFilters.color || c.color === newFilters.color) &&
                               (!newFilters.supplier || c.supplier === newFilters.supplier);
                      });
                      
                      const fields = ['quality', 'supplier', 'code', 'color'];
                      fields.forEach(f => {
                        const options = [...new Set(filtered.map(item => item[f]))].filter(Boolean);
                        if (options.length === 1) {
                          if (f === 'quality') setSelectedQuality(options[0]);
                          else if (f === 'supplier') setSelectedSupplier(options[0]);
                          else if (f === 'code') setSelectedCode(options[0]);
                          else if (f === 'color') setSelectedColor(options[0]);
                        }
                      });
                      setFilterType(type);
                    }}
                  >
                    {type}
                  </button>
                ))}
              </div>
            </div>

            <div className="ob-filter-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr) auto', gap: '1.25rem', alignItems: 'end' }}>
              <SearchableDropdown 
                label="Quality"
                placeholder="Search quality..."
                options={getOptions('quality')}
                value={selectedQuality}
                onChange={val => handleSelect('quality', val)}
                emptyLabel="-- All Qualities --"
              />
              <SearchableDropdown 
                label="Code"
                placeholder="Search code..."
                options={getOptions('code')}
                value={selectedCode}
                onChange={val => handleSelect('code', val)}
                emptyLabel="-- All Codes --"
              />
              <SearchableDropdown 
                label="Color"
                placeholder="Search color..."
                options={getOptions('color')}
                value={selectedColor}
                onChange={val => handleSelect('color', val)}
                emptyLabel="-- All Colors --"
              />
              <SearchableDropdown 
                label="Supplier"
                placeholder="Search supplier..."
                options={getOptions('supplier')}
                value={selectedSupplier}
                onChange={val => handleSelect('supplier', val)}
                emptyLabel="-- All Suppliers --"
              />
              <div className="input-group" style={{ marginBottom: 0 }}>
                <label>From Date</label>
