              if (data.boxes && Array.isArray(data.boxes)) {
                setBoxInputs(data.boxes.map(b => ({
                  boxNumber: b.boxNumber || '',
                  cones: b.cones || '',
                  weight: b.weight || '',
                  returnedWeight: '',
                  returnedDate: ''
                })));
              }

              success = true;
              break;
            } catch (e) {
              lastError = e.message;
            }
          }

          if (!success) throw new Error(lastError || "All models failed to respond.");

        } catch (err) {
          setError("Failed to scan challan: " + err.message);
        } finally {
          setIsScanning(false);
        }
      };

      const handleSubmit = () => {
        const errors = [];
        const newInvalids = {};
        
        if (!challan) {
          errors.push('Challan Number is required.');
          newInvalids.challan = true;
        }
        if (!receiveDate) {
          errors.push('Received Date is required.');
          newInvalids.receiveDate = true;
        }

        const validBoxes = boxInputs.filter(b => b.weight !== '');
        if (validBoxes.length === 0) {
          errors.push('Add at least one box weight.');
        }

        boxInputs.forEach((b, i) => {
          const w = b.weight !== '' ? Number(b.weight) : null;
          const c = b.cones !== '' ? Number(b.cones) : null;

          if (w !== null || c !== null || b.returnedWeight !== '' || b.returnedDate !== '') {
            if (w === null || w <= 0) {
              errors.push(`Weight must be > 0 for ${b.boxNumber}`);
              newInvalids[`weight-${i}`] = true;
            }
            if (c === null || c <= 0) {
              errors.push(`Cones must be > 0 for ${b.boxNumber}`);
              newInvalids[`cones-${i}`] = true;
            }
            if (Number(b.returnedWeight) > 0 && !b.returnedDate) {
              errors.push(`Provide GR Date for ${b.boxNumber}`);
              newInvalids[`grDate-${i}`] = true;
            }
            if (w !== null && Number(b.returnedWeight) > w) {
              errors.push(`GR weight cannot exceed Box weight for ${b.boxNumber}`);
              newInvalids[`gr-${i}`] = true;
            }
          }
        });

        if (errors.length > 0) {
          setInvalidFields(newInvalids);
          setError(errors);
          return;
        }

        setError(null);
        setInvalidFields({});
        const boxes = validBoxes.map(b => ({ ...b, cones: Number(b.cones), weight: Number(b.weight), returnedWeight: Number(b.returnedWeight) || 0 }));
        const tw = boxes.reduce((acc, b) => acc + (b.weight - b.returnedWeight), 0);
        onSubmit({ challanNumber: challan, receiveDate, lotNumber, boxes, totalWeight: tw });
      };

      const inputStyle = (isInvalid) => ({
        border: isInvalid ? '1.5px solid var(--error)' : '1px solid var(--border)',
        background: isInvalid ? 'rgba(239, 68, 68, 0.05)' : 'var(--surface)'
      });

      return (
        <div className="card" style={{border: '1.5px solid var(--accent)', marginBottom: '1.5rem', position: 'relative'}}>
          {isScanning && (
            <div className="loading-overlay">
              <div className="spinner"></div>
              <p style={{fontWeight: '600'}}>Scanning Challan with Gemini AI...</p>
              <p style={{fontSize: '0.8rem', color: 'var(--muted)', marginTop: '0.5rem'}}>Extracting weights and details</p>
            </div>
          )}
          
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem', paddingBottom: '1rem', borderBottom: '1px solid var(--border)' }}>
            <h3 style={{ margin: 0 }}>{initialData ? 'Edit Batch' : 'Add New Batch'}</h3>
            <div style={{ display: 'flex', gap: '1rem', alignItems: 'center' }}>
              <button 
                className="btn btn-outline" 
                style={{ color: 'var(--error)', borderColor: 'var(--error)', padding: '0.4rem 0.8rem' }}
                onClick={() => {
                  setChallan('');
                  setLotNumber('');
                  setBoxInputs([{ boxNumber: 'B1', cones: '', weight: '', returnedWeight: '', returnedDate: '' }]);
                  setError(null);
                }}
              >
                🔄 Reset
              </button>
              <label className="btn btn-outline" style={{ cursor: 'pointer', margin: 0, padding: '0.4rem 0.8rem' }}>
                📷 Scan Challan
                <input 
                  type="file" 
                  accept="image/*" 
                  style={{ display: 'none' }} 
                  onChange={(e) => {
                    if (e.target.files?.[0]) {
                      const file = e.target.files[0];
                      e.target.value = '';
                      setChallan('');
                      setLotNumber('');
                      setBoxInputs([]);
                      setError(null);
                      scanChallan(file);
                    }
                  }} 
                />
              </label>
            </div>
          </div>

          <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '1rem', marginBottom: '1.25rem'}}>
            <div className="input-group" style={{marginBottom: 0}}>
              <label>Received Date</label>
              <input type="date" style={inputStyle(invalidFields.receiveDate)} value={receiveDate} onChange={e => setReceiveDate(e.target.value)} />
            </div>
            <div className="input-group" style={{marginBottom: 0}}>
              <label>Challan Number</label>
              <input type="text" style={inputStyle(invalidFields.challan)} value={challan} onChange={e => setChallan(e.target.value)} placeholder="e.g. CH-9901" />
            </div>
            <div className="input-group" style={{marginBottom: 0}}>
              <label>Lot Number</label>
              <input type="text" value={lotNumber} onChange={e => setLotNumber(e.target.value)} placeholder="e.g. LOT-24A" />
            </div>
          </div>
          
          <div style={{display: 'grid', gridTemplateColumns: '1fr 0.8fr 1fr 1fr 1.5fr auto', gap: '0.5rem', marginBottom: '0.5rem', padding: '0 0.5rem'}}>
            <div style={{fontSize: '0.75rem', fontWeight: '700', color: 'var(--muted)'}}>BOX NUMBER</div>
            <div style={{fontSize: '0.75rem', fontWeight: '700', color: 'var(--muted)'}}>IN CONES</div>
            <div style={{fontSize: '0.75rem', fontWeight: '700', color: 'var(--muted)'}}>IN WEIGHT (KG)</div>
            <div style={{fontSize: '0.75rem', fontWeight: '700', color: 'var(--error)'}}>GR (KG)</div>
            <div style={{fontSize: '0.75rem', fontWeight: '700', color: 'var(--error)'}}>GR DATE</div>
            <div style={{width: '32px'}}></div>
          </div>

          {boxInputs.map((box, i) => (
            <div key={i} style={{display: 'grid', gridTemplateColumns: '1fr 0.8fr 1fr 1fr 1.5fr auto', gap: '0.5rem', marginBottom: '0.5rem', alignItems: 'center'}}>
              <input type="text" value={box.boxNumber} onChange={e => { let n = [...boxInputs]; n[i] = { ...n[i], boxNumber: e.target.value }; setBoxInputs(n); }} />
              <input type="number" step="1" min="0" style={inputStyle(invalidFields[`cones-${i}`])} placeholder="Cones" value={box.cones} onChange={e => { 
                let val = e.target.value;
                if (val !== '' && Number(val) < 0) return;
                let n = [...boxInputs]; 
                n[i] = { ...n[i], cones: val }; 
                setBoxInputs(n); 
              }} />
              <input type="number" min="0" style={inputStyle(invalidFields[`weight-${i}`])} placeholder="Weight" value={box.weight} onChange={e => { 
                let val = e.target.value;
                if (val !== '' && Number(val) < 0) return;
                let n = [...boxInputs]; 
                n[i] = { ...n[i], weight: val }; 
                setBoxInputs(n); 
              }} />
              <input type="number" min="0" style={inputStyle(invalidFields[`gr-${i}`])} placeholder="GR" value={box.returnedWeight} onChange={e => { 
                let val = e.target.value;
                if (val !== '' && Number(val) < 0) return;
                let n = [...boxInputs]; 
                n[i] = { ...n[i], returnedWeight: val }; 
                if (!val || Number(val) === 0) n[i].returnedDate = '';
                setBoxInputs(n); 
              }} />
              <input type="date" style={inputStyle(invalidFields[`grDate-${i}`])} value={box.returnedDate || ''} disabled={!box.returnedWeight} min={receiveDate} onChange={e => { let n = [...boxInputs]; n[i] = { ...n[i], returnedDate: e.target.value }; setBoxInputs(n); }} />
              <button 
                className="btn btn-outline" 
                style={{ padding: '0.4rem', color: 'var(--error)', borderColor: 'transparent', width: '32px', height: '32px', justifyContent: 'center' }}
                onClick={() => {
                  const newInputs = boxInputs.filter((_, idx) => idx !== i);
                  setBoxInputs(newInputs.length > 0 ? newInputs : [{ boxNumber: 'B1', cones: '', weight: '', returnedWeight: '', returnedDate: '' }]);
                }}
                title="Remove row"
              >
                ✖
              </button>
            </div>
          ))}
          
          <button className="btn btn-outline" style={{width: '100%', marginTop: '0.5rem'}} onClick={() => setBoxInputs([...boxInputs, { boxNumber: `B${boxInputs.length + 1}`, cones: '', weight: '', returnedWeight: '', returnedDate: '' }])}>
            + Add Box
          </button>
          
          {error && (
            <div style={{ 
              padding: '1rem', 
              background: 'rgba(239, 68, 68, 0.1)', 
              color: 'var(--error)', 
              borderRadius: '10px', 
              fontSize: '0.85rem', 
              marginTop: '1.5rem',
              border: '1px solid rgba(239, 68, 68, 0.2)',
            }}>
              <div style={{fontWeight: '700', marginBottom: '0.4rem', display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
                <span>⚠️ Error</span>
              </div>
              <div style={{opacity: 0.9, margin: 0}}>
                {Array.isArray(error) ? error.map((err, idx) => (
                  <div key={idx} style={{marginBottom: '0.2rem'}}>- {err}</div>
                )) : error}
              </div>
            </div>
          )}

          <div style={{display: 'flex', gap: '1rem', marginTop: '1.5rem'}}>
            <button className="btn btn-primary" style={{flex: 1}} onClick={handleSubmit}>Save</button>
            <button className="btn btn-outline" onClick={onCancel}>Cancel</button>
          </div>
        </div>
      );
    };

    // Component: Analytics View
    const AnalyticsView = ({ orders }) => {
      const canvasRef = useRef(null);
      const chartInstance = useRef(null);

      const supplierTotals = useMemo(() => {
        const map = {};
        orders.forEach(o => {
          const s = o.supplier || 'Unknown';
          const wt = Number(o.orderedWeight) || 0;
          map[s] = (map[s] || 0) + wt;
        });
        return map;
      }, [orders]);

      useEffect(() => {
        if (!canvasRef.current) return;
        const ctx = canvasRef.current.getContext('2d');
        if (chartInstance.current) chartInstance.current.destroy();

        chartInstance.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: Object.keys(supplierTotals),
            datasets: [{
              label: 'Procurement Volume (Kg)',
              data: Object.values(supplierTotals),
              backgroundColor: 'rgba(139, 92, 246, 0.75)',
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } }
          }
        });

        return () => { if (chartInstance.current) chartInstance.current.destroy(); };
      }, [supplierTotals]);

      return (
        <div className="card">
          <h2 style={{marginBottom: '1.5rem'}}>Yarn Procurement Volume by Supplier</h2>
          <div style={{height: '350px'}}>
            <canvas ref={canvasRef}></canvas>
          </div>
        </div>
      );
    };

    // Component: Heat Map View
    const HeatMapView = ({ orders, onSelectOrder }) => {
      return (
        <div className="card">
          <h2 style={{marginBottom: '1rem'}}>Yarn RM Delivery Calendar</h2>
          <p style={{color: 'var(--muted)', marginBottom: '1.5rem'}}>Recent yarn order activities across suppliers.</p>
          <div className="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Order #</th>
                  <th>Date</th>
                  <th>Quality</th>
                  <th>Supplier</th>
                  <th>Type</th>
                  <th>Ordered (Kg)</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                {orders.map(o => (
                  <tr key={o.id}>
                    <td><strong>{o.orderNumber || o.id}</strong></td>
                    <td>{new Date(o.orderDate || o.createdAt).toLocaleDateString('en-GB')}</td>
                    <td>{o.quality}</td>
                    <td>{o.supplier}</td>
                    <td><span className={`badge badge-${(o.category || o.type || 'Polyester').toLowerCase()}`}>{o.category || o.type || 'Polyester'}</span></td>
                    <td>{o.orderedWeight} kg</td>
                    <td>
                      <button className="btn btn-outline" style={{padding: '0.3rem 0.6rem', fontSize: '0.8rem'}} onClick={() => onSelectOrder(o)}>
                        + Challan
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
