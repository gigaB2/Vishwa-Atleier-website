  <script>
    (function() {
      if (typeof Node !== 'undefined' && Node.prototype) {
        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child.parentNode !== this) {
            if (child.parentNode) {
              return child.parentNode.removeChild(child);
            }
            return child;
          }
          return originalRemoveChild.apply(this, arguments);
        };

        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            if (referenceNode.parentNode) {
              return referenceNode.parentNode.insertBefore(newNode, referenceNode);
            }
            return this.appendChild(newNode);
          }
          return originalInsertBefore.apply(this, arguments);
        };
      }

      const isDark = localStorage.getItem('vishwa_fashions_theme') === 'true' || 
                     (localStorage.getItem('vishwa_fashions_theme') === null && true);
      if (isDark) {
        document.documentElement.classList.add('dark-mode');
      } else {
        document.documentElement.classList.remove('dark-mode');
      }
      const isCollapsed = localStorage.getItem('vf_sidebar_collapsed') === 'true';
      if (isCollapsed) {
        document.documentElement.classList.add('vf-sidebar-collapsed');
      }
    })();
  </script>

  <style>
    :root {
      --bg:      #F8F7FC;
      --surface: #ffffff;
      --fg:      #1a1a2e;
      --muted:   #8b8fa3;
      --border:  #e8e7f1;
      --accent:  #8b5cf6;
      --accent2: #ec4899;
      --accent3: #f97316;
      --error:   #ef4444;
      --success: #10b981;
      --info:    #3b82f6;

      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono:    'JetBrains Mono', monospace;

      --radius: 16px;
      --shadow-sm:  0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md:  0 4px 16px rgba(0, 0, 0, 0.06);
      --shadow-lg:  0 8px 32px rgba(0, 0, 0, 0.08);
      --shadow-xl:  0 16px 48px rgba(0, 0, 0, 0.12);

      --transition-fast: 0.15s ease;
      --transition-base: 0.25s ease;
      --transition-slow: 0.4s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 4px;
      border: 2px solid var(--bg);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      transition: background 0.3s ease;
    }

    body.dark-mode, .dark-mode body, .dark-mode {
      background: linear-gradient(135deg, #000000 0%, #0a0a0a 50%, #0f0f1a 100%);
      --bg: #000000;
      --surface: #0a0a0a;
      --fg: #ffffff;
      --muted: #a1a1aa;
      --border: #27272a;
      --accent: #7c3aed;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .dark-mode input:not(.bg-transparent),
    .dark-mode textarea:not(.bg-transparent),
    .dark-mode select:not(.bg-transparent) {
      background-color: var(--surface) !important;
      color: var(--fg) !important;
      border-color: var(--border) !important;
    }

    .dark-mode input,
    .dark-mode select,
    .dark-mode textarea {
      color-scheme: dark !important;
    }

    .dark-mode select option {
      background-color: #0a0a0a !important;
      color: var(--fg) !important;
    }

    .dark-mode input:focus,
    .dark-mode textarea:focus,
    .dark-mode select:focus {
      background-color: var(--surface) !important;
      color: var(--fg) !important;
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15) !important;
    }

    .app-container {
      max-width: 100%;
      margin: 0 auto;
      padding: 2rem;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0 1.5rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
      opacity: 0.5;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .ob-header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      transition: transform var(--transition-base), box-shadow var(--transition-base);
      position: relative;
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-base);
      border: none;
      font-family: var(--font-body);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--fg);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.75rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.85rem 1.25rem;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      font-family: var(--font-body);
      transition: all var(--transition-fast);
      font-size: 1rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .ob-filter-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .ob-filter-type-toggle {
      display: flex;
      gap: 0.5rem;
      background: var(--bg);
      padding: 0.25rem;
      border-radius: 10px;
      flex-wrap: wrap;
    }

    .ob-filter-grid {
      display: grid;
      gap: 1rem;
      align-items: end;
      margin-bottom: 1.5rem;
      width: 100%;
      max-width: 100%;
    }

    .ob-summary-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 100%;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 1rem;
      border-radius: 8px;
      position: relative;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th {
      text-align: center;
      padding: 1rem 0.5rem;
      border-bottom: 2px solid var(--border);
      font-family: var(--font-body);
      font-weight: 700;
      color: var(--fg);
      background: linear-gradient(to bottom, rgba(139, 92, 246, 0.04), transparent);
      position: sticky;
      top: 0;
      z-index: 10;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    th:hover {
      background: linear-gradient(to bottom, rgba(139, 92, 246, 0.08), rgba(139, 92, 246, 0.02));
      color: var(--accent);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    td {
      padding: 1rem 0.5rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      text-align: center;
      overflow-wrap: break-word;
      word-wrap: break-word;
      word-break: break-word;
      max-width: 300px;
      overflow: hidden;
    }

    tr:hover td {
      background: rgba(139, 92, 246, 0.02);
    }

    .badge {
      display: inline-flex;
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-polyester { background: rgba(139, 92, 246, 0.1); color: var(--accent); }
    .badge-nylon     { background: rgba(236, 72, 153, 0.1); color: var(--accent2); }
    .badge-viscose   { background: rgba(16, 185, 129, 0.1); color: var(--success); }
    .badge-active    { background: rgba(16, 185, 129, 0.1); color: var(--success); }
    .badge-completed { background: rgba(139, 143, 163, 0.1); color: var(--muted); }
    .badge-cancelled { background: rgba(239, 68, 68, 0.1); color: var(--error); }

    .progress-mini-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .progress-mini-text {
      font-size: 0.8rem;
      display: flex;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .progress-mini-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(0,0,0,0.05);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 10, 26, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
      padding: 1.25rem;
      z-index: 100005;
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal {
      background: var(--surface);
      border-radius: 24px;
      padding: 2.5rem;
      width: 100%;
      max-width: 800px;
      max-height: calc(100dvh - 2.5rem);
      box-shadow: var(--shadow-xl);
      position: relative;
      overflow-y: auto;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(var(--surface-rgb, 255, 255, 255), 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      border-radius: var(--radius);
    }

    .ai-scan-glow-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(236, 72, 153, 0.25));
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.35);
      animation: aiPulse 2s infinite ease-in-out;
      margin-bottom: 1.25rem;
    }

    @keyframes aiPulse {
      0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.5); transform: scale(0.97); }
      70% { box-shadow: 0 0 0 16px rgba(139, 92, 246, 0); transform: scale(1.03); }
      100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); transform: scale(0.97); }
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .live-dot-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      box-shadow: 0 0 0 rgba(139, 92, 246, 0.6);
      animation: livePulse 1.5s infinite;
    }

    @keyframes livePulse {
      0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.8); }
      70% { box-shadow: 0 0 0 8px rgba(139, 92, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
    }

    .scan-progress-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      overflow: hidden;
      margin: 0.9rem 0 0.4rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .scan-progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6, #ec4899, #f97316);
      border-radius: 999px;
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 14px rgba(139, 92, 246, 0.75);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }

    /* Timeline styles */
    .timeline-container {
      position: relative;
      padding-left: 2rem;
      border-left: 2px dashed var(--border);
      margin-left: 1rem;
    }

    .ob-arrival-timeline.timeline-container {
      position: relative;
      margin-top: 1.5rem;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 7rem 0;
      display: flex;
      align-items: center;
      min-height: 520px;
      max-width: 100%;
      width: 100%;
      box-sizing: border-box;
      border-left: none !important;
      margin-left: 0 !important;
      padding-left: 0 !important;
      cursor: grab;
    }

    .ob-arrival-timeline:active {
      cursor: grabbing;
    }

    .ob-timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.85rem 1.25rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      min-width: 0;
    }

    .ob-timeline-header h3 {
      margin: 0;
      min-width: 0;
      flex: 1 1 auto;
    }

    .ob-timeline-header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      align-items: center;
      justify-content: flex-end;
      min-width: 0;
      max-width: 100%;
    }

    .ob-timeline-hint {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.35;
      max-width: 100%;
      min-width: 0;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .ob-timeline-dir-btn {
      flex: 0 1 auto;
      min-width: 0;
      max-width: 100%;
    }

    /* Heat map styles — square cells; scroll allowed when content overflows */
    .ob-heatmap-stack {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 0;
    }

    .app-container.ob-heatmap-page {
      min-height: 0 !important;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 1rem 1.5rem;
      box-sizing: border-box;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .ob-heatmap-nav {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .ob-heatmap-month-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.65rem;
      flex-wrap: wrap;
    }

    .app-container.ob-heatmap-page > header {
      flex-shrink: 0;
      margin-bottom: 0.75rem;
      padding-bottom: 0.75rem;
    }

    .app-container.ob-heatmap-page .ob-heatmap-stack {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .ob-heatmap-filters {
      flex-shrink: 0;
      padding: 0.85rem 1.1rem !important;
    }

    .ob-heatmap-filters .ob-filter-toolbar {
      margin-bottom: 0.65rem;
    }

    .ob-heatmap-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 0.85rem;
      background: var(--bg);
      border-radius: 10px;
      margin-bottom: 0.75rem;
      border: 1px solid var(--border);
      font-size: 0.78rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .heat-map-container {
      padding: 1.15rem 1.25rem;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      flex: 1;
      min-height: 0 !important;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ob-heatmap-month-row h2 {
      font-size: 1.35rem !important;
    }

    .calendar-grid-shell {
      flex: 1;
      min-height: 0;
      width: 100%;
      container-type: size;
      display: grid;
      place-items: center;
    }

    .calendar-grid {
      --gap: 8px;
      --header-h: 1.25rem;
      --weeks: 6;
      --cell: min(
        calc((100cqw - (6 * var(--gap))) / 7),
        calc((100cqh - var(--header-h) - (var(--weeks) * var(--gap))) / var(--weeks))
      );
      display: grid;
      grid-template-columns: repeat(7, var(--cell));
      grid-template-rows: var(--header-h) repeat(var(--weeks), var(--cell));
      gap: var(--gap);
      margin: 0;
      width: max-content;
      max-width: 100%;
    }

    @supports not (width: 1cqw) {
      .calendar-grid {
        --cell: min(calc((100vw - 5rem) / 7), calc((100dvh - 20rem) / 6), 108px);
      }
      .calendar-grid-shell {
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }

    .calendar-weekday {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      font-size: clamp(0.58rem, 1.1cqw, 0.78rem);
      color: var(--muted);
      letter-spacing: 0.08em;
      padding: 0;
      line-height: 1;
      user-select: none;
    }

    .calendar-day {
      min-height: 0;
      width: var(--cell);
      height: var(--cell);
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      padding: clamp(0.25rem, 0.9cqw, 0.55rem);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    .calendar-day-empty {
      min-height: 0;
      width: var(--cell);
      height: var(--cell);
      border-radius: 12px;
      border: 1px dashed transparent;
      background: transparent;
      pointer-events: none;
    }

    .calendar-day:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      z-index: 10;
      border-color: var(--accent);

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const YARN_ORDERS_STORAGE_KEY = 'yarn-rm-orders';
    const YARN_STOCK_STORAGE_KEY = 'vishwa_yarn_rm_stock_data';
    const YARN_CATEGORIES = ['Polyester', 'Nylon', 'Viscose'];


    const addTimestampToDate = (dateStr) => {
      if (!dateStr) return dateStr;
      if (dateStr.includes('T') || dateStr.includes(':') || dateStr.length > 10) {
        return dateStr;
      }
      const now = new Date();
      const pad = (num) => String(num).padStart(2, '0');
      const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}.${String(now.getMilliseconds()).padStart(3, '0')}`;
      return `${dateStr}T${timeStr}`;
    };

    // Synced storage hook (Safe multi-device cloud sync without empty-mount overwrites)
    const useSyncedStorage = (key, initialValue) => {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          if (!item) return initialValue;
          let parsed = JSON.parse(item);
          if (Array.isArray(initialValue) && !Array.isArray(parsed)) return initialValue;
          if (Array.isArray(parsed) && window.VishwaSupabase && typeof window.VishwaSupabase.filterDeletedEntities === 'function') {
            parsed = window.VishwaSupabase.filterDeletedEntities(parsed);
          }
          return parsed;
        } catch (e) {
          return initialValue;
        }
      });

      useEffect(() => {
        const handleStorageChange = (e) => {
          if (!e || e.key === key || !e.key) {
            try {
              const item = window.localStorage.getItem(key);
              if (!item) {
                if (!window.VishwaSupabase || (typeof window.VishwaSupabase.isHydrated === 'function' && window.VishwaSupabase.isHydrated())) {
                  setStoredValue(initialValue);
                }
              } else {
                let parsed = JSON.parse(item);
                if (Array.isArray(initialValue) && !Array.isArray(parsed)) {
                  setStoredValue(initialValue);
                } else {
                  if (Array.isArray(parsed) && window.VishwaSupabase && typeof window.VishwaSupabase.filterDeletedEntities === 'function') {
                    parsed = window.VishwaSupabase.filterDeletedEntities(parsed);
                  }
                  setStoredValue(parsed);
                }
              }
            } catch (error) {
              console.error('Error parsing storage change in useSyncedStorage:', error);
            }
          }
        };

        const handleSupabaseSync = (e) => {
          if (!e || !e.detail || e.detail.key === key || !e.detail.key) {
            handleStorageChange({ key });
          }
        };

        const handleSupabaseReady = () => {
          handleStorageChange({ key });
        };

        const handleItemDeleted = (e) => {
          handleStorageChange({ key });
        };

        window.addEventListener('storage', handleStorageChange);
        window.addEventListener('supabase-sync', handleSupabaseSync);
        window.addEventListener('supabase-ready', handleSupabaseReady);
        window.addEventListener('supabase-item-deleted', handleItemDeleted);

        return () => {
          window.removeEventListener('storage', handleStorageChange);
          window.removeEventListener('supabase-sync', handleSupabaseSync);
          window.removeEventListener('supabase-ready', handleSupabaseReady);
          window.removeEventListener('supabase-item-deleted', handleItemDeleted);
        };
      }, [key, initialValue]);

      const setValue = useCallback((value) => {
        try {
          setStoredValue(prevValue => {
            const valueToStore = value instanceof Function ? value(prevValue) : value;
            try {
              window.localStorage.setItem(key, JSON.stringify(valueToStore));
            } catch (err) {
              console.error('Storage set error:', err);
            }
            return valueToStore;
          });
        } catch (error) {
          console.error('setValue error:', error);
        }
      }, [key]);

      return [storedValue, setValue];
    };

    // Component: Searchable Dropdown
    const SearchableDropdown = ({ label, placeholder, options, value, onChange, emptyLabel = "-- All --" }) => {
      const [isOpen, setIsOpen] = useState(false);
      const [search, setSearch] = useState('');
      const wrapperRef = useRef(null);

      const filteredOptions = useMemo(() => {
        if (!search.trim()) return options;
        return options.filter(opt => opt.toLowerCase().includes(search.toLowerCase()));
      }, [options, search]);

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      return (
        <div className="input-group" ref={wrapperRef} style={{ position: 'relative', marginBottom: 0 }}>
          {label && <label>{label}</label>}
          <div 
            onClick={() => setIsOpen(!isOpen)} 
            style={{ 
              padding: '0.85rem 1.25rem', 
              borderRadius: '12px', 
              border: '2px solid var(--border)', 
              background: 'var(--surface)', 
              color: value ? 'var(--fg)' : 'var(--muted)', 
              cursor: 'pointer', 
              display: 'flex', 
              justifyContent: 'space-between', 
              alignItems: 'center', 
              fontSize: '0.95rem' 
            }}
          >
            <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {value || emptyLabel}
            </span>
            <span style={{ fontSize: '0.75rem', opacity: 0.6 }}>▼</span>
          </div>

          {isOpen && (
            <div style={{ 
              position: 'absolute', 
              top: '100%', 
              left: 0, 
              right: 0, 
              background: 'var(--surface)', 
              border: '2px solid var(--border)', 
              borderRadius: '12px', 
              marginTop: '4px', 
              boxShadow: 'var(--shadow-lg)', 
              zIndex: 1000, 
              maxHeight: '220px', 
              display: 'flex', 
              flexDirection: 'column', 
              overflow: 'hidden' 
            }}>
              <div style={{ padding: '0.5rem', borderBottom: '1px solid var(--border)' }}>
                <input 
                  type="text" 
                  autoFocus 
                  placeholder={placeholder} 
                  value={search} 
                  onChange={e => setSearch(e.target.value)} 
                  style={{ padding: '0.4rem 0.75rem', fontSize: '0.85rem' }} 
                  onClick={e => e.stopPropagation()} 
                />
              </div>
              <div style={{ overflowY: 'auto', flex: 1 }}>
                <div 
                  onClick={() => { onChange(''); setIsOpen(false); setSearch(''); }} 
                  style={{ 
                    padding: '0.6rem 1rem', 
                    cursor: 'pointer', 
                    borderBottom: '1px solid var(--border)', 
                    color: 'var(--muted)', 
                    fontSize: '0.85rem' 
                  }}
                >
                  {emptyLabel}
                </div>
                {filteredOptions.length === 0 ? (
                  <div style={{ padding: '0.8rem', textAlign: 'center', color: 'var(--muted)', fontSize: '0.85rem' }}>No results</div>
                ) : (
                  filteredOptions.map((opt, i) => (
                    <div 
                      key={i} 
                      onClick={() => { onChange(opt); setIsOpen(false); setSearch(''); }} 
                      style={{ 
                        padding: '0.6rem 1rem', 
                        cursor: 'pointer', 
                        background: value === opt ? 'rgba(139, 92, 246, 0.1)' : 'transparent', 
                        color: value === opt ? 'var(--accent)' : 'var(--fg)', 
                        fontWeight: value === opt ? '600' : 'normal', 
                        fontSize: '0.9rem' 
                      }}
                    >
                      {opt}
                    </div>
                  ))
                )}
              </div>
            </div>
          )}
        </div>
      );
    };

    // Main App Component
    const App = () => {
      const [orders, setOrders] = useSyncedStorage(YARN_ORDERS_STORAGE_KEY, []);
      const [qualities, setQualities] = useSyncedStorage('yarn-qualities', []);
      const [suppliers, setSuppliers] = useSyncedStorage('yarn-suppliers', []);
      const [geminiApiKey] = useSyncedStorage('gemini-api-key', '');
      const [selectedGeminiModel] = useSyncedStorage('selected-gemini-model', 'gemini-2.0-flash');

      const [view, setView] = useState(() => (new URLSearchParams(window.location.search).get('view') || 'orders'));
      const [showOrderModal, setShowOrderModal] = useState(false);
      const [selectedOrder, setSelectedOrder] = useState(null);

      // Filters
      const [filterType, setFilterType] = useState('All');
      const [qualityFilter, setQualityFilter] = useState('');
      const [supplierFilter, setSupplierFilter] = useState('');
      const [codeFilter, setCodeFilter] = useState('');
      const [colorFilter, setColorFilter] = useState('');
      const [orderSearch, setOrderSearch] = useState('');
      const [fromDate, setFromDate] = useState('');
      const [toDate, setToDate] = useState('');

      // Multi-column sorting
      const [orderSort, setOrderSort] = useState([{ key: 'orderDate', direction: 'desc' }]);

      // Analytics Timeline & Isolation States (Matching weaving order analytics)
      const [highlightedOrderId, setHighlightedOrderId] = useState(null);
      const [isolatedOrderId, setIsolatedOrderId] = useState(null);
      const [timelineDirection, setTimelineDirection] = useState('LTR');
      const [timelineScrollPos, setTimelineScrollPos] = useState(0);

      // FY Synchronization
      useEffect(() => {
        const initialFY = localStorage.getItem('vishwa_fashions_selected_fy');
        if (initialFY && typeof FYEngine !== 'undefined') {
          const { start, end } = FYEngine.getFYDateRange(initialFY);
          if (start) setFromDate(start);
          if (end) setToDate(end);
        }

        const handleFYChange = (e) => {
          const fy = e?.detail?.fy;
          if (fy && typeof FYEngine !== 'undefined') {
            const { start, end } = FYEngine.getFYDateRange(fy);
            setFromDate(start || '');
            setToDate(end || '');
          }
        };
        window.addEventListener('fyChanged', handleFYChange);
        return () => window.removeEventListener('fyChanged', handleFYChange);
      }, []);

      // Auto-heal and sync all orders and batches into Yarn RM Stock Book
      useEffect(() => {
        if (!Array.isArray(orders) || orders.length === 0) return;
        if (window.VishwaSupabase && typeof window.VishwaSupabase.isHydrated === 'function' && !window.VishwaSupabase.isHydrated()) {
          return; // Wait until cloud hydration completes
        }
        try {
          const rawStock = localStorage.getItem(YARN_STOCK_STORAGE_KEY);
          let stockList = rawStock ? JSON.parse(rawStock) : [];
          if (!Array.isArray(stockList)) stockList = [];

          let changed = false;
          const activeLotKeys = new Set();
          const activeOrderRefs = new Set();

          // Build comprehensive index of existing boxes and lots so issue statuses are 100% preserved
          const existingBoxMap = new Map();
          const existingLotMap = new Map();

          stockList.forEach(lot => {
            if (!lot) return;
            const lId = String(lot.id || '');
            const lNum = String(lot.lotNumber || '').trim();
            const lChallan = String(lot.challanNo || lot.challanNumber || '').trim();
            const bId = String(lot.batchId || '').trim();

            if (lId) existingLotMap.set(lId, lot);
            if (bId) existingLotMap.set(bId, lot);
            if (lNum && lChallan) existingLotMap.set(`${lNum}__${lChallan}`, lot);

            (lot.boxes || []).forEach(b => {
              if (!b) return;
              const boxNum = String(b.id || b.boxNumber || '').trim();
              if (boxNum) {
                if (lId) existingBoxMap.set(`${lId}__${boxNum}`, b);
                if (bId) existingBoxMap.set(`${bId}__${boxNum}`, b);
                if (lNum && lChallan) existingBoxMap.set(`${lNum}__${lChallan}__${boxNum}`, b);
                if (lNum) existingBoxMap.set(`${lNum}__${boxNum}`, b);
                if (!existingBoxMap.has(boxNum)) existingBoxMap.set(boxNum, b);
              }
            });
          });

          orders.forEach(order => {
            const orderRefId = String(order.orderNumber || order.id || '');
            if (orderRefId) {
              activeOrderRefs.add(orderRefId);
              activeOrderRefs.add(String(order.id));
              if (order.orderNumber) activeOrderRefs.add(String(order.orderNumber));
            }

            (order.batches || []).forEach((batch, bIdx) => {
              const recDateOnly = (batch.receiveDate || new Date().toISOString().split('T')[0]).split('T')[0];
              const batchChallan = String(batch.challanNumber || '').trim();
              const batchLot = String(batch.lotNumber || '').trim();
              const batchId = String(batch.id || `BATCH-${bIdx}`);
              const orderId = String(order.orderNumber || order.id || '');
              
              // Ensure unique lot ID per batch
              const lotIdVal = batch.lotNumber 
                ? (batch.lotNumber + (batchChallan ? `__${batchChallan}` : `__${batchId}`))
                : (`LOT-${batchChallan || batchId || bIdx}`);

              activeLotKeys.add(lotIdVal);
              if (batch.id) activeLotKeys.add(String(batch.id));
              if (batchLot && batchChallan) activeLotKeys.add(`${batchLot}__${batchChallan}`);
              
              // Find existing lot by exact lotIdVal, batchId, or matching lotNumber AND challanNumber
              const existingIdx = stockList.findIndex(s => 
                String(s.id) === String(lotIdVal) || 
                String(s.batchId) === String(batch.id) ||
                (batchLot && batchChallan && String(s.lotNumber).trim() === batchLot && String(s.challanNo || s.challanNumber).trim() === batchChallan) ||
                (batchLot && !batchChallan && String(s.lotNumber).trim() === batchLot && String(s.orderRef) === orderId)
              );

              const existingLot = existingIdx >= 0 ? stockList[existingIdx] : null;

              const boxes = (batch.boxes || []).map((bx, idx) => {
                const bId = String(bx.boxNumber || `B${idx + 1}`).trim();
                const grossWt = Number(bx.weight) || 0;
                const retWt = Number(bx.returnedWeight) || 0;
                const remWt = Math.max(0, grossWt - retWt);
                const isFullyGr = retWt >= grossWt && grossWt > 0;
                const isPartialGr = retWt > 0 && !isFullyGr;

                const oldB = existingBoxMap.get(`${lotIdVal}__${bId}`) || 
                             (batch.id ? existingBoxMap.get(`${batch.id}__${bId}`) : null) ||
                             (batchLot && batchChallan ? existingBoxMap.get(`${batchLot}__${batchChallan}__${bId}`) : null) ||
                             (batchLot ? existingBoxMap.get(`${batchLot}__${bId}`) : null) ||
                             (existingLot && Array.isArray(existingLot.boxes) ? existingLot.boxes.find(x => String(x.id || x.boxNumber).trim() === bId) : null);

                const isIssued = (oldB && oldB.status === 'issued') || (bx.status === 'issued');
                const issueDate = isIssued ? (oldB?.issueDate || bx.issueDate || null) : null;
                const issuedTo = isIssued ? (oldB?.issuedTo || bx.issuedTo || null) : null;
                const updatedAt = isIssued ? (oldB?.updated_at || bx.updated_at || null) : (oldB?.updated_at || null);

                return {
                  id: bId,
                  boxNumber: bId,
                  cones: Number(bx.cones) || (oldB?.cones || 0),
                  grossWeight: grossWt,
                  remainingWeight: remWt,
                  weight: isFullyGr ? grossWt : remWt,
                  status: isFullyGr ? 'gr' : (isIssued ? 'issued' : 'available'),
                  issueDate: isFullyGr ? null : (isIssued ? issueDate : null),
                  issuedTo: isFullyGr ? null : (isIssued ? issuedTo : null),
                  updated_at: updatedAt,
                  grWeight: retWt,
                  grDate: retWt > 0 ? (bx.returnedDate ? bx.returnedDate.split('T')[0] : (oldB?.grDate || '')) : null,
                  grRemarks: isFullyGr ? 'Fully Returned in Challan GR' : (isPartialGr ? `Partial GR (-${retWt.toFixed(2)} kg)` : null)
                };
              });

              const updatedLot = {
                id: existingLot?.id || lotIdVal,
                batchId: batch.id || '',
                lotNumber: batchLot || (existingLot?.lotNumber || ('LOT-' + (batchChallan || 'AUTO'))),
                challanNo: batchChallan || (existingLot?.challanNo || ''),
                challanNumber: batchChallan || (existingLot?.challanNumber || ''),
                receiveDate: recDateOnly,
                date: recDateOnly,
                supplier: order.supplier || (existingLot?.supplier || ''),
                quality: order.quality || (existingLot?.quality || ''),
                itemType: order.category || order.type || (existingLot?.itemType || 'Polyester'),
                code: order.code || (existingLot?.code || ''),
                color: order.color || (existingLot?.color || ''),
                rate: order.price || (existingLot?.rate || ''),
                orderRef: order.orderNumber || order.id,
                boxes: boxes,
                updated_at: existingLot?.updated_at || batch.updated_at || order.updated_at || new Date().toISOString()
              };

              if (existingIdx >= 0) {
                const prevSerialized = JSON.stringify(stockList[existingIdx]);
                const nextSerialized = JSON.stringify(updatedLot);
                if (prevSerialized !== nextSerialized) {
                  stockList[existingIdx] = updatedLot;
                  changed = true;
                }
              } else {
                stockList.unshift(updatedLot);
                changed = true;
              }
            });
          });

          // Clean up stock lots belonging to deleted orders or deleted batches (ONLY if orders is populated)
          if (activeOrderRefs.size > 0) {
            const initialLen = stockList.length;
            stockList = stockList.filter(lot => {
              if (!lot || !lot.orderRef) return true; // Keep manual lots not linked to orders
              if (!activeOrderRefs.has(String(lot.orderRef))) return false; // Order was deleted
              if (lot.batchId && !activeLotKeys.has(String(lot.batchId))) return false; // Batch was deleted
              const rawChallan = String(lot.challanNo || lot.challanNumber || '').trim();
              const rawLot = String(lot.lotNumber || '').trim();
              if (rawLot && rawChallan && !activeLotKeys.has(`${rawLot}__${rawChallan}`) && !activeLotKeys.has(String(lot.id))) {
                return false; // Batch with lot and challan was deleted
              }
              return true;
            });
            if (stockList.length !== initialLen) changed = true;
          }

          if (changed) {
            localStorage.setItem(YARN_STOCK_STORAGE_KEY, JSON.stringify(stockList));
          }
        } catch(e) {
          console.error("Yarn stock auto-heal sync error:", e);
        }
      }, [orders]);

      const isEmbedded = useMemo(() => new URLSearchParams(window.location.search).get('embedded') === '1', []);

      useEffect(() => {
        if (isEmbedded) {
          document.body.classList.add('is-embedded');
        }
      }, [isEmbedded]);

      // Handle opening order modal from external link (e.g. Yarn RM Stock Book right click Edit)
      useEffect(() => {
        if (!Array.isArray(orders) || orders.length === 0) return;
        const params = new URLSearchParams(window.location.search);
        const orderIdParam = params.get('orderId');
        const batchIdParam = params.get('batchId');
        const challanParam = params.get('challan');
        const lotParam = params.get('lot');
        const shouldOpenModal = params.get('openModal') === '1';

        if (orderIdParam || batchIdParam || challanParam || lotParam) {
          // Match with priority: 1. Batch ID or exact (Lot + Challan), 2. Challan or Lot, 3. Order ID
          let match = orders.find(o => 
            (o.batches || []).some(b => 
              (batchIdParam && String(b.id) === String(batchIdParam)) ||
              (challanParam && lotParam && String(b.challanNumber).trim() === String(challanParam).trim() && String(b.lotNumber).trim() === String(lotParam).trim())
            )
          );

          if (!match && orderIdParam) {
            match = orders.find(o => String(o.id) === String(orderIdParam) || String(o.orderNumber) === String(orderIdParam));
          }

          if (!match && (challanParam || lotParam)) {
            match = orders.find(o => 
              (o.batches || []).some(b => 
                (lotParam && String(b.lotNumber).trim() === String(lotParam).trim()) ||
                (challanParam && String(b.challanNumber).trim() === String(challanParam).trim())
              )
            );
          }

          if (match) {
            setSelectedOrder(match);
            if (shouldOpenModal && !isEmbedded) {
              const url = new URL(window.location.href);
              url.searchParams.delete('openModal');
              window.history.replaceState({}, '', url.pathname + '?' + url.searchParams.toString());
            }
          }
        }
      }, [orders, isEmbedded]);

      // View URL sync
      useEffect(() => {
        const titles = {
          'orders': 'Yarn RM Orders — Vishwa Fashions',
          'analytics': 'Yarn Order Analytics — Vishwa Fashions',
          'heat-map': 'Yarn Delivery Heat Map — Vishwa Fashions'
        };
        document.title = titles[view] || 'Yarn RM Orders — Vishwa Fashions';
        const url = new URL(window.location.href);
        if (url.searchParams.get('view') !== view) {
          url.searchParams.set('view', view);
          window.history.replaceState({}, '', url.pathname + '?' + url.searchParams.toString());
        }
      }, [view]);

      const allCombinations = useMemo(() => {
        const cleanOrders = (window.VishwaSupabase && typeof window.VishwaSupabase.filterDeletedEntities === 'function')
          ? window.VishwaSupabase.filterDeletedEntities(orders)
          : orders;
        const cleanQualities = (window.VishwaSupabase && typeof window.VishwaSupabase.filterDeletedEntities === 'function')
          ? window.VishwaSupabase.filterDeletedEntities(qualities)
          : qualities;

        const combos = [];
        (cleanOrders || []).forEach(o => combos.push({ quality: o.quality, supplier: o.supplier, code: o.code, color: o.color, type: o.category || o.type || 'Polyester' }));
        (cleanQualities || []).forEach(q => {
          combos.push({ quality: q.quality, supplier: q.supplier, code: q.code, color: q.color, type: q.type || 'Polyester' });
        });
        const seen = new Set();
        let list = combos.filter(c => {
          const key = `${c.quality}|${c.supplier}|${c.code}|${c.color}|${c.type}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
        if (window.VishwaSupabase && typeof window.VishwaSupabase.filterDeletedEntities === 'function') {
          list = window.VishwaSupabase.filterDeletedEntities(list);
        }
        return list;
      }, [qualities, orders]);

      const getOrderOptions = (field) => {
        const otherFilters = { quality: qualityFilter, supplier: supplierFilter, code: codeFilter, color: colorFilter, type: filterType === 'All' ? null : filterType };
        delete otherFilters[field];
        const relevantCombos = allCombinations.filter(c => Object.keys(otherFilters).every(k => !otherFilters[k] || c[k] === otherFilters[k]));
        return [...new Set(relevantCombos.map(c => c[field]).filter(Boolean))].sort();
      };

      const handleOrderFilterSelect = (field, value) => {
        const newFilters = { 
          quality: qualityFilter, 
          supplier: supplierFilter, 
          code: codeFilter, 
          color: colorFilter,
          [field]: value 
        };
        
        let filtered = allCombinations.filter(q => {
          return (!newFilters.quality || q.quality === newFilters.quality) &&
                 (!newFilters.code || q.code === newFilters.code) &&
                 (!newFilters.color || q.color === newFilters.color) &&
                 (!newFilters.supplier || q.supplier === newFilters.supplier) &&
                 (filterType === 'All' || q.type === filterType);
        });

        const fields = ['quality', 'supplier', 'code', 'color'];
        const updated = { ...newFilters };
        fields.forEach(f => {
          const options = [...new Set(filtered.map(item => item[f]))].filter(Boolean);
          if (options.length === 1) updated[f] = options[0];
        });

        setQualityFilter(updated.quality);
        setSupplierFilter(updated.supplier);
        setCodeFilter(updated.code);
        setColorFilter(updated.color);
      };

      // Filtered Orders
      const filteredOrders = useMemo(() => {
        let filtered = orders;
        if (filterType !== 'All') filtered = filtered.filter(o => (o.category || o.type) === filterType);
        if (qualityFilter) filtered = filtered.filter(o => o.quality === qualityFilter);
        if (supplierFilter) filtered = filtered.filter(o => o.supplier === supplierFilter);
        if (codeFilter) filtered = filtered.filter(o => o.code === codeFilter);
        if (colorFilter) filtered = filtered.filter(o => o.color === colorFilter);
        
        if (fromDate || toDate) {
          filtered = filtered.filter(o => {
            const d = new Date(o.orderDate || o.createdAt);
            d.setHours(0,0,0,0);
            if (fromDate && d < new Date(fromDate)) return false;
            if (toDate && d > new Date(toDate)) return false;
            return true;
          });
        }

        if (orderSearch.trim()) {
          const isExact = orderSearch.includes(',');
          const terms = orderSearch.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
          filtered = filtered.filter(o => {
            const searchParts = [
              o.id, o.orderNumber, o.quality, o.code, o.color, o.supplier, o.category || o.type, o.status, o.orderedWeight, o.price, 
              new Date(o.orderDate || o.createdAt).toLocaleDateString('en-GB')
            ];
            
            let hasActualGR = false;
            (o.batches || []).forEach(b => {
              searchParts.push(b.challanNumber, b.lotNumber, b.totalWeight);
              if (b.receiveDate) searchParts.push(new Date(b.receiveDate).toLocaleDateString('en-GB'));
              
              (b.boxes || []).forEach(box => {
                const weight = Number(box.weight) || 0;
                const retWeight = Number(box.returnedWeight) || 0;
                const netWeight = weight - retWeight;
                searchParts.push(box.boxNumber, box.cones, box.weight, box.returnedWeight, netWeight.toFixed(2));
                if (box.returnedDate) searchParts.push(new Date(box.returnedDate).toLocaleDateString('en-GB'));
                if (retWeight > 0) hasActualGR = true;
              });
            });
            
            const searchPartsLower = searchParts.map(v => (v ?? '').toString().toLowerCase());
            const finalContent = searchPartsLower.join(' ');
            
            return terms.every(term => {
              if (isExact) {
                return searchPartsLower.some(val => val === term) || (term === 'gr' && hasActualGR);
              } else {
                return finalContent.includes(term) || (term === 'gr' && hasActualGR);
              }
            });
          });
        }

        return [...filtered].sort((a, b) => {
          for (const sort of orderSort) {
            let valA, valB;
            if (sort.key === 'orderDate' || sort.key === 'createdAt') { 
              valA = new Date(a[sort.key] || a.createdAt); 
              valB = new Date(b[sort.key] || b.createdAt); 
            }
            else if (sort.key === 'received') { 
              valA = (a.batches || []).reduce((acc, b) => acc + (Number(b.totalWeight) || 0), 0); 
              valB = (b.batches || []).reduce((acc, b) => acc + (Number(b.totalWeight) || 0), 0); 
            }
            else if (sort.key === 'orderedWeight' || sort.key === 'price') { 
              valA = Number(a[sort.key] || 0); 
              valB = Number(b[sort.key] || 0); 
            }
            else { 
              valA = (a[sort.key] || "").toString().toLowerCase(); 
              valB = (b[sort.key] || "").toString().toLowerCase(); 
            }
            if (valA < valB) return sort.direction === 'asc' ? -1 : 1;
            if (valA > valB) return sort.direction === 'asc' ? 1 : -1;
          }
          const dateA = new Date(a.orderDate || a.createdAt);
          const dateB = new Date(b.orderDate || b.createdAt);
          if (dateB - dateA !== 0) return dateB - dateA;
          return new Date(b.createdAt) - new Date(a.createdAt);
        });
      }, [orders, filterType, orderSearch, fromDate, toDate, orderSort, qualityFilter, supplierFilter, codeFilter, colorFilter]);

      // Summary statistics matching order-book.html
      const stats = useMemo(() => {
        const calc = (list) => {
          let o = 0, r = 0, g = 0;
          list.forEach(item => {
            o += Number(item.orderedWeight) || 0;
            (item.batches || []).forEach(b => {
              r += Number(b.totalWeight) || 0;
              (b.boxes || []).forEach(box => g += (Number(box.returnedWeight) || 0));
            });
          });
          return { ordered: o, received: r, gr: g };
        };
        const active = filteredOrders.filter(o => o.status === 'Active');
        const completed = filteredOrders.filter(o => o.status === 'Completed');
        const sA = calc(active), sC = calc(completed), sT = calc(filteredOrders);
        return {
          active: { count: active.length, load: sA.ordered, gr: sA.gr, pending: Math.max(0, sA.ordered - sA.received) },
          completed: { count: completed.length, load: sC.ordered, gr: sC.gr, received: sC.received },
          total: { count: filteredOrders.length, load: sT.ordered, gr: sT.gr, received: sT.received }
        };
      }, [filteredOrders]);

      const requestOrderSort = (key, event) => {
        setOrderSort(prev => {
          if (event && (event.shiftKey || event.ctrlKey || event.metaKey)) {
            const existingIndex = prev.findIndex(s => s.key === key);
            if (existingIndex > -1) {
              const current = prev[existingIndex];
              if (current.direction === 'desc') {
                const next = [...prev];
                next[existingIndex] = { key, direction: 'asc' };
                return next;
              } else {
                return prev.filter(s => s.key !== key);
              }
            } else {
              return [...prev, { key, direction: 'desc' }];
            }
          } else {
            const existing = prev.find(s => s.key === key);
            if (existing) {
              return [{ key, direction: existing.direction === 'desc' ? 'asc' : 'desc' }];
            } else {
              return [{ key, direction: 'desc' }];
            }
          }
        });
      };

      const SortIndicator = ({ sortConfig, columnKey }) => {
        const config = sortConfig.find(s => s.key === columnKey);
        const index = sortConfig.findIndex(s => s.key === columnKey);
        if (!config) return <span style={{ opacity: 0.2, marginLeft: '0.4rem' }}>↕</span>;
        return (
          <span style={{ marginLeft: '0.4rem', color: 'var(--accent)', fontWeight: 'bold' }}>
            {config.direction === 'asc' ? '↑' : '↓'}
            {sortConfig.length > 1 && <small style={{fontSize: '0.6rem', marginLeft: '1px', opacity: 0.8}}>{index + 1}</small>}
          </span>
        );
      };

      const isUndoRedoActionRef = useRef(false);
      const undoStackRef = useRef([]);
      const redoStackRef = useRef([]);
      const [undoToast, setUndoToast] = useState(null);
      const toastTimerRef = useRef(null);

      const showUndoToast = (msg, actionType = 'undo') => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        setUndoToast({ msg, actionType });
        toastTimerRef.current = setTimeout(() => {
          setUndoToast(null);
        }, 3000);
      };

      const recordSnapshot = (description = 'Change') => {
        if (isUndoRedoActionRef.current) return;
        const currentOrders = JSON.parse(JSON.stringify(orders || []));
        undoStackRef.current.push({ orders: currentOrders, description });
        if (undoStackRef.current.length > 50) {
          undoStackRef.current.shift();
        }
        redoStackRef.current = [];
      };

      const performUndo = () => {
        if (undoStackRef.current.length === 0) {
          showUndoToast("Nothing to undo", "info");
          return;
        }
        isUndoRedoActionRef.current = true;
        const currentOrders = JSON.parse(JSON.stringify(orders || []));
        const prevSnapshot = undoStackRef.current.pop();
        redoStackRef.current.push({ orders: currentOrders, description: prevSnapshot.description });

        setOrders(prevSnapshot.orders);
        if (selectedOrder) {
          const matched = (prevSnapshot.orders || []).find(o => o.id === selectedOrder.id);
          setSelectedOrder(matched || null);
        }
        showUndoToast(`↩ Undone: ${prevSnapshot.description || 'Action'} (Ctrl+Z)`, "undo");
        setTimeout(() => { isUndoRedoActionRef.current = false; }, 50);
      };

      const performRedo = () => {
        if (redoStackRef.current.length === 0) {
          showUndoToast("Nothing to redo", "info");
          return;
        }
        isUndoRedoActionRef.current = true;
        const currentOrders = JSON.parse(JSON.stringify(orders || []));
        const nextSnapshot = redoStackRef.current.pop();
        undoStackRef.current.push({ orders: currentOrders, description: nextSnapshot.description });

        setOrders(nextSnapshot.orders);
        if (selectedOrder) {
          const matched = (nextSnapshot.orders || []).find(o => o.id === selectedOrder.id);
          setSelectedOrder(matched || null);
        }
        showUndoToast(`↪ Redone: ${nextSnapshot.description || 'Action'} (Ctrl+Y)`, "redo");
        setTimeout(() => { isUndoRedoActionRef.current = false; }, 50);
      };

      // Global Keyboard Shortcut Listener for Ctrl+Z and Ctrl+Y / Ctrl+Shift+Z
      useEffect(() => {
        const handleKeyDown = (e) => {
          const isCtrlOrCmd = e.ctrlKey || e.metaKey;
          if (!isCtrlOrCmd) return;

          const key = e.key.toLowerCase();
          const activeElem = document.activeElement;
          const isTextInput = activeElem && (
            activeElem.tagName === 'INPUT' || 
            activeElem.tagName === 'TEXTAREA' || 
            activeElem.isContentEditable
          );

          if (key === 'z') {
            if (e.shiftKey) {
              e.preventDefault();
              performRedo();
            } else if (!isTextInput) {
              e.preventDefault();
              performUndo();
            }
          } else if (key === 'y') {
            if (!isTextInput) {
              e.preventDefault();
              performRedo();
            }
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [orders, selectedOrder]);

      const handleAddOrder = (orderData) => {
        recordSnapshot(`Add Order ${orderData.quality || ''}`);
        const newOrder = {
          ...orderData,
          id: 'YRN-ORD-' + Date.now(),
          orderNumber: orderData.orderNumber || ('YRN-' + Math.floor(1000 + Math.random() * 9000)),
          createdAt: new Date().toISOString(),
          status: 'Active',
          batches: []
        };
        setOrders(prev => [newOrder, ...prev]);
        setShowOrderModal(false);
      };

      const updateOrder = (o) => {
        recordSnapshot(`Update Order ${o.quality || ''}`);
        const processed = { ...o, orderDate: addTimestampToDate(o.orderDate) };
        setOrders(prev => prev.map(x => x.id === o.id ? processed : x));
        if (selectedOrder?.id === o.id) setSelectedOrder(processed);
      };

      const completeOrder = (id) => {
        const target = (orders || []).find(o => o.id === id);
        recordSnapshot(`Complete Order ${target?.quality || ''}`);
        setOrders(prev => prev.map(o => o.id === id ? { ...o, status: 'Completed' } : o));
      };

      const deleteOrder = (id) => {
        const targetOrder = orders.find(o => o.id === id);
        if (!targetOrder) return;
        
        if (confirm(`Delete order for ${targetOrder.quality} (${targetOrder.supplier})? Associated inward lots will be removed from Yarn RM Stock Book.`)) {
          recordSnapshot(`Delete Order ${targetOrder.quality || ''}`);
          setOrders(prev => prev.filter(o => o.id !== id));
          
          if (window.VishwaSupabase && typeof window.VishwaSupabase.recordDeletion === 'function') {
            window.VishwaSupabase.recordDeletion('yarn-rm-orders', id);
          }

          if (window.VishwaSupabase && typeof window.VishwaSupabase.deleteYarnOrderRelational === 'function') {
            window.VishwaSupabase.deleteYarnOrderRelational(id);
          }

          // Remove linked stock lots from Yarn RM stock
          try {
            const rawStock = localStorage.getItem(YARN_STOCK_STORAGE_KEY);
            let stockList = rawStock ? JSON.parse(rawStock) : [];
            if (Array.isArray(stockList)) {
              const orderRef = targetOrder.orderNumber || targetOrder.id;
              stockList = stockList.filter(s => s.orderRef !== orderRef);
              localStorage.setItem(YARN_STOCK_STORAGE_KEY, JSON.stringify(stockList));
              if (window.VishwaSupabase && typeof window.VishwaSupabase.saveToSupabase === 'function') {
                window.VishwaSupabase.saveToSupabase(YARN_STOCK_STORAGE_KEY, stockList);
              }
            }
          } catch(e) {}
        }
      };

      const navigateToOrder = (orderId, item) => {
        setQualityFilter(item.quality);
        setSupplierFilter(item.supplier);
        setCodeFilter(item.code || '');
        setColorFilter(item.color || '');
        setFilterType(item.type || 'All');
        setHighlightedOrderId(orderId);
        setView('analytics');
      };

      return (
        <div className={`app-container${view === 'heat-map' ? ' ob-heatmap-page' : ''}`}>
          {undoToast && (
            <div 
              style={{
                position: 'fixed',
                bottom: '2rem',
                left: '50%',
                transform: 'translateX(-50%)',
                background: undoToast.actionType === 'info' ? 'rgba(15, 23, 42, 0.95)' : 'linear-gradient(135deg, var(--accent), var(--accent2))',
                color: 'white',
                padding: '0.75rem 1.5rem',
                borderRadius: '12px',
                boxShadow: 'var(--shadow-xl)',
                zIndex: 100000,
                fontFamily: 'var(--font-body)',
                fontSize: '0.88rem',
                fontWeight: '600',
                display: 'flex',
                alignItems: 'center',
                gap: '0.75rem',
                animation: 'fadeIn 0.2s ease',
                pointerEvents: 'none'
              }}
            >
              <span>{undoToast.msg}</span>
            </div>
          )}
          <header>
            <div className="logo-section">
              <span className="logo" style={{cursor: 'default'}}>
                {view === 'orders' ? 'Yarn RM Orders' : view === 'analytics' ? 'Yarn Order Analytics' : 'Yarn Delivery Heat Map'}
              </span>
            </div>
            <div className="ob-header-actions" style={{display: 'flex', gap: '0.75rem', alignItems: 'center'}}>
              {view === 'orders' && (
                <button className="btn btn-primary" onClick={() => setShowOrderModal(true)}>
                  + Add New Order
                </button>
              )}
            </div>
          </header>

          {/* VIEW: ORDERS LIST */}
          {view === 'orders' && (
            <React.Fragment>
              {/* Order Filters Card */}
              <div className="card" style={{ overflow: 'visible', zIndex: 100, marginBottom: '2rem' }}>
                <div className="ob-filter-toolbar">
                  <h3>Order Filters</h3>
                  <div className="ob-filter-type-toggle">
                    {['All', ...YARN_CATEGORIES].map(type => (
                      <button 
                        key={type}
                        className="btn" 
                        style={{
                          padding: '0.4rem 1rem', 
                          fontSize: '0.85rem',
                          background: filterType === type ? 'var(--surface)' : 'transparent',
                          boxShadow: filterType === type ? 'var(--shadow-sm)' : 'none',
                          color: filterType === type ? 'var(--accent)' : 'var(--muted)'
                        }}
                        onClick={() => {
                          const currentFilters = { quality: qualityFilter, supplier: supplierFilter, code: codeFilter, color: colorFilter };
                          const newFilters = { ...currentFilters, type: type === 'All' ? null : type };
                          let filtered = allCombinations.filter(c => {
                            return (!newFilters.type || c.type === newFilters.type) &&
                                   (!newFilters.quality || c.quality === newFilters.quality) &&
                                   (!newFilters.code || c.code === newFilters.code) &&
                                   (!newFilters.color || c.color === newFilters.color) &&
                                   (!newFilters.supplier || c.supplier === newFilters.supplier);
                          });
                          
                          const fields = ['quality', 'supplier', 'code', 'color'];
                          fields.forEach(f => {
                            const options = [...new Set(filtered.map(item => item[f]))].filter(Boolean);
                            if (options.length === 1) {
                              if (f === 'quality') setQualityFilter(options[0]);

                          </td>
                        </tr>
                      ) : (
                        filteredOrders.map(order => {
                          const netReceived = (order.batches || []).reduce((acc, b) => acc + (Number(b.totalWeight) || 0), 0);
                          const totalReturned = (order.batches || []).reduce((acc, batch) => 
                            acc + (batch.boxes || []).reduce((boxAcc, box) => boxAcc + (Number(box.returnedWeight) || 0), 0)
                          , 0);
                          const orderedWt = Number(order.orderedWeight) || 0;
                          const totalToDisplay = netReceived + totalReturned;
                          const scaleBase = Math.max(orderedWt, totalToDisplay) || 1;
                          const netWithoutSurplus = Math.min(netReceived, orderedWt);
                          const surplus = Math.max(0, netReceived - orderedWt);
                          
                          const netProgress = (netWithoutSurplus / scaleBase) * 100;
                          const returnedProgress = (totalReturned / scaleBase) * 100;
                          const surplusProgress = (surplus / scaleBase) * 100;

                          const itemCategory = order.category || order.type || 'Polyester';

                          return (
                            <tr key={order.id}>
                              <td>{new Date(order.orderDate || order.createdAt).toLocaleDateString('en-GB')}</td>
                              <td>
                                <strong>{order.quality}</strong>
                                <div style={{ fontSize: '0.75rem', color: 'var(--muted)', marginTop: '2px' }}>{itemCategory}</div>
                              </td>
                              <td>{order.code || '-'}</td>
                              <td>{order.color || '-'}</td>
                              <td>{order.supplier}</td>
                              <td><span className={`badge badge-${itemCategory.toLowerCase()}`}>{itemCategory}</span></td>
                              <td style={{fontWeight: '600'}}>{orderedWt} kg</td>
                              <td>
                                <div className="progress-mini-container">
                                  <div className="progress-mini-text" style={{fontWeight: '600', flexDirection: 'column', gap: '0'}}>
                                    <div>{netReceived.toFixed(2)} kg</div>
                                    {totalReturned > 0 && <div style={{color: 'var(--accent3)'}}>{totalReturned.toFixed(2)} Kg(GR)</div>}
                                  </div>
                                  <div className="progress-mini-bar-bg">
                                    <div style={{ width: `${netProgress}%`, height: '100%', background: 'var(--accent)', transition: 'width 0.5s ease' }}></div>
                                    {totalReturned > 0 && (
                                      <div style={{ width: `${returnedProgress}%`, height: '100%', background: 'var(--accent3)', transition: 'width 0.5s ease', borderLeft: '1px solid var(--surface)' }}></div>
                                    )}
                                    {surplusProgress > 0 && (
                                      <div style={{ width: `${surplusProgress}%`, height: '100%', background: '#3b82f6', transition: 'width 0.5s ease', borderLeft: '1px solid var(--surface)' }}></div>
                                    )}
                                  </div>
                                </div>
                              </td>
                              <td>{order.price ? `₹${Number(order.price).toFixed(2)}` : '—'}</td>
                              <td><span className={`badge badge-${(order.status || 'Active').toLowerCase()}`}>{order.status || 'Active'}</span></td>
                              <td>
                                <div style={{display: 'flex', gap: '0.4rem', justifyContent: 'center'}}>
                                  <button 
                                    className="btn btn-outline"

                              </td>

                          );

    // Component: Place New Yarn Order Modal
    const OrderFormModal = ({ onClose, onSubmit, qualities, suppliers }) => {
      const [formData, setFormData] = useState({
        orderDate: new Date().toISOString().split('T')[0],
        supplier: '',
        category: 'Polyester',
        quality: '',
        code: '',
        color: '',
        orderedWeight: '',
        price: ''
      });

      // Filter qualities based on item type
      const filteredQualities = useMemo(() => {
        return (qualities || []).filter(q => {
          const qType = q.type || q.itemType || 'Polyester';
          if (formData.category && qType !== formData.category) return false;
          return true;
        });
      }, [qualities, formData.category]);

      const availableCodes = useMemo(() => {
        const codes = (qualities || []).filter(q => {
          const qType = q.type || q.itemType || 'Polyester';
          const qQual = q.quality || q.name || '';
          if (formData.category && qType !== formData.category) return false;
          if (formData.quality && qQual !== formData.quality) return false;
          return true;
        }).map(q => q.code).filter(Boolean);
        return [...new Set(codes)];
      }, [qualities, formData.category, formData.quality]);

      const availableColors = useMemo(() => {
        const colors = (qualities || []).filter(q => {
          const qType = q.type || q.itemType || 'Polyester';
          const qQual = q.quality || q.name || '';
          if (formData.category && qType !== formData.category) return false;
          if (formData.quality && qQual !== formData.quality) return false;
          return true;
        }).map(q => q.color).filter(Boolean);
        return [...new Set(colors)];
      }, [qualities, formData.category, formData.quality]);

      const handleQualityChange = (selectedQualName) => {
        const match = filteredQualities.find(q => (q.quality || q.name) === selectedQualName);
        setFormData(prev => ({
          ...prev,
          quality: selectedQualName,
          code: match?.code || prev.code,
          color: match?.color || prev.color,
          supplier: prev.supplier || match?.supplier || ''
        }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.orderDate || !formData.supplier || !formData.category || !formData.quality || !formData.orderedWeight) {
          alert('Please fill in all mandatory fields (*)');
          return;
        }

        onSubmit({
          ...formData,
          orderedWeight: Number(formData.orderedWeight) || 0,
          price: formData.price ? Number(formData.price) : ''
        });
      };

      return (

                    type="date" 
                    value={formData.orderDate} 
                    onChange={e => setFormData({...formData, orderDate: e.target.value})} 
                    required 
                  />
                </div>

                <div className="input-group">
                  <label>RM Supplier *</label>
                  <select 
                    value={formData.supplier} 
                    onChange={e => setFormData({...formData, supplier: e.target.value})}
                    required
                  >
                    <option value="">-- Select RM Supplier --</option>
                    {suppliers.map((s, idx) => {
                      const sName = s.name || s.supplier;
                      return <option key={idx} value={sName}>{sName}</option>;
                    })}
                  </select>
                </div>
              </div>

              <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem'}}>
                <div className="input-group">
                  <label>Item (Yarn Type) *</label>
                  <select 
                    value={formData.category} 
                    onChange={e => setFormData({...formData, category: e.target.value, quality: '', code: '', color: ''})}
                    required
                  >
                    {YARN_CATEGORIES.map(cat => (
                      <option key={cat} value={cat}>{cat}</option>
                    ))}
                  </select>
                </div>

                <div className="input-group">
                  <label>Yarn Quality *</label>
                  <select 
                    value={formData.quality} 
                    onChange={e => handleQualityChange(e.target.value)}
                    required
                  >
                    <option value="">-- Select Yarn Quality --</option>
                    {filteredQualities.map((q, idx) => {
                      const qName = q.quality || q.name;
                      return <option key={idx} value={qName}>{qName}{q.color ? ` (${q.color})` : ''}</option>;
                    })}
                  </select>
                </div>
              </div>

              <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem'}}>
                <div className="input-group">
                  <label>Yarn Code</label>
                  {availableCodes.length > 0 ? (
                    <select 
                      value={formData.code} 
                      onChange={e => setFormData({...formData, code: e.target.value})}
                    >
                      <option value="">-- Select / Optional --</option>
                      {availableCodes.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  ) : (
                    <input 
                      type="text" 
                      placeholder="e.g. 7536BR" 
                      value={formData.code} 
                      onChange={e => setFormData({...formData, code: e.target.value})} 
                    />
                  )}
                </div>

                <div className="input-group">
                  <label>Color</label>
                  {availableColors.length > 0 ? (
                    <select 
                      value={formData.color} 
                      onChange={e => setFormData({...formData, color: e.target.value})}
                    >
                      <option value="">-- Select / Optional --</option>
                      {availableColors.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  ) : (
                    <input 
                      type="text" 
                      placeholder="e.g. Optic White" 
                      value={formData.color} 
                      onChange={e => setFormData({...formData, color: e.target.value})} 
                    />
                  )}
                </div>
              </div>

              <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem'}}>
                <div className="input-group">
                  <label>Total Order Qty (Kg) *</label>
                  <input 
                    type="number" 
                    step="0.01" 
                    placeholder="e.g. 1000" 
                    value={formData.orderedWeight} 
                    onChange={e => setFormData({...formData, orderedWeight: e.target.value})} 
                    required 
                  />
                </div>

                <div className="input-group">
                  <label>Rate (₹/Kg) <span style={{color: 'var(--muted)', fontWeight: 'normal'}}>(Optional)</span></label>
                  <input 
                    type="number" 
                    step="0.01" 
                    placeholder="e.g. 145.50" 
                    value={formData.price} 
                    onChange={e => setFormData({...formData, price: e.target.value})} 
                  />
                </div>
              </div>

              <div style={{display: 'flex', gap: '1rem', marginTop: '1.5rem'}}>
                <button type="submit" className="btn btn-primary" style={{flex: 1}}>Place Order</button>
                <button type="button" className="btn btn-outline" onClick={onClose}>Cancel</button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    // Component: Order Details Modal (Exact replica of order-book.html with editable specifications & rate)
    const OrderDetailsModal = ({ order, onClose, onUpdate, onComplete, qualities, suppliers, geminiApiKey, selectedGeminiModel, onOpenSettings }) => {
      const [showBatchForm, setShowBatchForm] = useState(false);
      const [editingBatch, setEditingBatch] = useState(null);
      const [orderSavedToast, setOrderSavedToast] = useState(false);

      // Order editing form state
      const [orderForm, setOrderForm] = useState({
        orderDate: (order.orderDate || order.createdAt || new Date().toISOString().split('T')[0]).split('T')[0],
        supplier: order.supplier || '',
        category: order.category || order.type || 'Polyester',
        quality: order.quality || '',
        code: order.code || '',
        color: order.color || '',
        orderedWeight: order.orderedWeight || '',
        price: order.price || ''
      });

      // Keep form in sync when order changes
      useEffect(() => {
        setOrderForm({
          orderDate: (order.orderDate || order.createdAt || new Date().toISOString().split('T')[0]).split('T')[0],
          supplier: order.supplier || '',
          category: order.category || order.type || 'Polyester',
          quality: order.quality || '',
          code: order.code || '',
          color: order.color || '',
          orderedWeight: order.orderedWeight || '',
          price: order.price || ''
        });
      }, [order.id, order.orderedWeight, order.price, order.quality, order.supplier, order.code, order.color, order.category, order.orderDate]);

      // Auto-open specific batch in edit mode if requested via URL (e.g. Right Click Edit Lot from Stock Book)
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const batchIdParam = params.get('batchId');
        const challanParam = params.get('challan');
        const lotParam = params.get('lot');

        if (batchIdParam || challanParam || lotParam) {
          const targetBatch = (order.batches || []).find(b => 
            (batchIdParam && String(b.id) === String(batchIdParam)) ||
            (challanParam && lotParam && String(b.challanNumber).trim() === String(challanParam).trim() && String(b.lotNumber).trim() === String(lotParam).trim()) ||
            (lotParam && String(b.lotNumber).trim() === String(lotParam).trim()) ||
            (challanParam && String(b.challanNumber).trim() === String(challanParam).trim())
          );
          if (targetBatch) {
            setEditingBatch(targetBatch);
            setShowBatchForm(true);
          }
        }
      }, [order.id]);

      // Cascading options for modal edit fields
      const modalFilteredQualities = useMemo(() => {
        return (qualities || []).filter(q => {
          const qType = q.type || q.itemType || 'Polyester';
          if (orderForm.category && qType !== orderForm.category) return false;
          return true;
        });
      }, [qualities, orderForm.category]);

      const modalAvailableCodes = useMemo(() => {
        const codes = (qualities || []).filter(q => {
          const qType = q.type || q.itemType || 'Polyester';
          const qQual = q.quality || q.name || '';
          if (orderForm.category && qType !== orderForm.category) return false;
          if (orderForm.quality && qQual !== orderForm.quality) return false;
          return true;
        }).map(q => q.code).filter(Boolean);
        return [...new Set(codes)];
      }, [qualities, orderForm.category, orderForm.quality]);

      const modalAvailableColors = useMemo(() => {
