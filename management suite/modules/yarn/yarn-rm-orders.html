  <script>
    (function() {
      if (typeof Node !== 'undefined' && Node.prototype) {
        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child.parentNode !== this) {
            if (child.parentNode) {
              return child.parentNode.removeChild(child);
            }
            return child;
          }
          return originalRemoveChild.apply(this, arguments);
        };

        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            if (referenceNode.parentNode) {
              return referenceNode.parentNode.insertBefore(newNode, referenceNode);
            }
            return this.appendChild(newNode);
          }
          return originalInsertBefore.apply(this, arguments);
        };
      }

      const isDark = localStorage.getItem('vishwa_fashions_theme') === 'true' || 
                     (localStorage.getItem('vishwa_fashions_theme') === null && true);
      if (isDark) {
        document.documentElement.classList.add('dark-mode');
      } else {
        document.documentElement.classList.remove('dark-mode');
      }
      const isCollapsed = localStorage.getItem('vf_sidebar_collapsed') === 'true';
      if (isCollapsed) {
        document.documentElement.classList.add('vf-sidebar-collapsed');
      }
    })();
  </script>

  <style>
    :root {

      --surface: #ffffff;
      --fg:      #1a1a2e;

      --success: #10b981;
      --info:    #3b82f6;

      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const YARN_ORDERS_STORAGE_KEY = 'yarn-rm-orders';
    const YARN_STOCK_STORAGE_KEY = 'vishwa_yarn_rm_stock_data';
    const YARN_CATEGORIES = ['Polyester', 'Nylon', 'Viscose'];

    const DEMO_QUALITIES = [
      { id: '1', quality: '75/36 Bright', type: 'Polyester', code: '7536BR', color: 'Optic White', supplier: 'Reliance Industries' },
      { id: '2', quality: '70/24 Semi Dull', type: 'Nylon', code: '7024SD', color: 'Raw White', supplier: 'Gujarat Polysol' },
      { id: '3', quality: '120/48 Bright', type: 'Viscose', code: '12048BR', color: 'Jet Black', supplier: 'Grasim Industries' }
    ];

    const DEMO_SUPPLIERS = [
      { id: '1', name: 'Reliance Industries', contact: 'Rajesh Shah', phone: '9825100001' },
      { id: '2', name: 'Gujarat Polysol', contact: 'Ketan Patel', phone: '9825100002' },
      { id: '3', name: 'Grasim Industries', contact: 'Suresh Verma', phone: '9825100003' }
    ];

    const addTimestampToDate = (dateStr) => {
      if (!dateStr) return dateStr;
      if (dateStr.includes('T') || dateStr.includes(':') || dateStr.length > 10) {
        return dateStr;
      }
      const now = new Date();
      const pad = (num) => String(num).padStart(2, '0');
      const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}.${String(now.getMilliseconds()).padStart(3, '0')}`;
      return `${dateStr}T${timeStr}`;
    };

    // Synced storage hook
    const useSyncedStorage = (key, initialValue) => {
      const [data, setData] = useState(() => {
        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (e) {
          return initialValue;
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem(key, JSON.stringify(data));
          if (window.VishwaSupabase && typeof window.VishwaSupabase.saveToSupabase === 'function') {
            window.VishwaSupabase.saveToSupabase(key, data);
          }
        } catch(e) {}
      }, [key, data]);

      return [data, setData];
    };

    // Component: Searchable Dropdown
    const SearchableDropdown = ({ label, placeholder, options, value, onChange, emptyLabel = "-- All --" }) => {
      const [isOpen, setIsOpen] = useState(false);
      const [search, setSearch] = useState('');
      const wrapperRef = useRef(null);

      const filteredOptions = useMemo(() => {
        if (!search.trim()) return options;
        return options.filter(opt => opt.toLowerCase().includes(search.toLowerCase()));
      }, [options, search]);

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      return (
        <div className="input-group" ref={wrapperRef} style={{ position: 'relative', marginBottom: 0 }}>
          {label && <label>{label}</label>}
          <div 
            onClick={() => setIsOpen(!isOpen)} 
            style={{ 
              padding: '0.85rem 1.25rem', 
              borderRadius: '12px', 
              border: '2px solid var(--border)', 
              background: 'var(--surface)', 
              color: value ? 'var(--fg)' : 'var(--muted)', 
              cursor: 'pointer', 
              display: 'flex', 
              justifyContent: 'space-between', 
              alignItems: 'center', 
              fontSize: '0.95rem' 
            }}
          >
            <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {value || emptyLabel}
            </span>
            <span style={{ fontSize: '0.75rem', opacity: 0.6 }}>▼</span>
          </div>

          {isOpen && (
            <div style={{ 
              position: 'absolute', 
              top: '100%', 
              left: 0, 
              right: 0, 
              background: 'var(--surface)', 
              border: '2px solid var(--border)', 
              borderRadius: '12px', 
              marginTop: '4px', 
              boxShadow: 'var(--shadow-lg)', 
              zIndex: 1000, 
              maxHeight: '220px', 
              display: 'flex', 
              flexDirection: 'column', 
              overflow: 'hidden' 
            }}>
              <div style={{ padding: '0.5rem', borderBottom: '1px solid var(--border)' }}>
                <input 
                  type="text" 
                  autoFocus 
                  placeholder={placeholder} 
                  value={search} 
                  onChange={e => setSearch(e.target.value)} 
                  style={{ padding: '0.4rem 0.75rem', fontSize: '0.85rem' }} 
                  onClick={e => e.stopPropagation()} 
                />
              </div>
              <div style={{ overflowY: 'auto', flex: 1 }}>
                <div 
                  onClick={() => { onChange(''); setIsOpen(false); setSearch(''); }} 
                  style={{ 
                    padding: '0.6rem 1rem', 
                    cursor: 'pointer', 
                    borderBottom: '1px solid var(--border)', 
                    color: 'var(--muted)', 
                    fontSize: '0.85rem' 
                  }}
                >
                  {emptyLabel}
                </div>
                {filteredOptions.length === 0 ? (
                  <div style={{ padding: '0.8rem', textAlign: 'center', color: 'var(--muted)', fontSize: '0.85rem' }}>No results</div>
                ) : (
                  filteredOptions.map((opt, i) => (
                    <div 
                      key={i} 
                      onClick={() => { onChange(opt); setIsOpen(false); setSearch(''); }} 
                      style={{ 
                        padding: '0.6rem 1rem', 
                        cursor: 'pointer', 
                        background: value === opt ? 'rgba(139, 92, 246, 0.1)' : 'transparent', 
                        color: value === opt ? 'var(--accent)' : 'var(--fg)', 
                        fontWeight: value === opt ? '600' : 'normal', 
                        fontSize: '0.9rem' 
                      }}
                    >
                      {opt}
                    </div>
                  ))
                )}
              </div>
            </div>
          )}
        </div>
      );
    };

    // Main App Component
    const App = () => {
      const [orders, setOrders] = useSyncedStorage(YARN_ORDERS_STORAGE_KEY, []);
      const [qualities, setQualities] = useSyncedStorage('yarn-qualities', DEMO_QUALITIES);
      const [suppliers, setSuppliers] = useSyncedStorage('yarn-suppliers', DEMO_SUPPLIERS);
      const [geminiApiKey] = useSyncedStorage('gemini-api-key', '');
      const [selectedGeminiModel] = useSyncedStorage('selected-gemini-model', 'gemini-2.0-flash');

      const [view, setView] = useState(() => (new URLSearchParams(window.location.search).get('view') || 'orders'));
      const [showOrderModal, setShowOrderModal] = useState(false);
      const [selectedOrder, setSelectedOrder] = useState(null);

      // Filters
      const [filterType, setFilterType] = useState('All');
      const [qualityFilter, setQualityFilter] = useState('');
      const [supplierFilter, setSupplierFilter] = useState('');
      const [codeFilter, setCodeFilter] = useState('');
      const [colorFilter, setColorFilter] = useState('');
      const [orderSearch, setOrderSearch] = useState('');
      const [fromDate, setFromDate] = useState('');
      const [toDate, setToDate] = useState('');

      // Multi-column sorting
      const [orderSort, setOrderSort] = useState([{ key: 'orderDate', direction: 'desc' }]);

      // FY Synchronization
      useEffect(() => {
        const initialFY = localStorage.getItem('vishwa_fashions_selected_fy');
        if (initialFY && typeof FYEngine !== 'undefined') {
          const { start, end } = FYEngine.getFYDateRange(initialFY);
          if (start) setFromDate(start);
          if (end) setToDate(end);
        }

        const handleFYChange = (e) => {
          const fy = e?.detail?.fy;
          if (fy && typeof FYEngine !== 'undefined') {
            const { start, end } = FYEngine.getFYDateRange(fy);
            setFromDate(start || '');
            setToDate(end || '');
          }
        };
        window.addEventListener('fyChanged', handleFYChange);
        return () => window.removeEventListener('fyChanged', handleFYChange);
      }, []);

      // Auto-heal and sync all orders and batches into Yarn RM Stock Book
      useEffect(() => {
        if (!Array.isArray(orders) || orders.length === 0) return;
        try {
          const rawStock = localStorage.getItem(YARN_STOCK_STORAGE_KEY);
          let stockList = rawStock ? JSON.parse(rawStock) : [];
          if (!Array.isArray(stockList)) stockList = [];

          let changed = false;
          orders.forEach(order => {
            (order.batches || []).forEach(batch => {
              const recDateOnly = (batch.receiveDate || new Date().toISOString().split('T')[0]).split('T')[0];
              const lotIdVal = batch.lotNumber || ('LOT-' + (batch.challanNumber || Date.now().toString().slice(-4)));
              
              const existingIdx = stockList.findIndex(s => String(s.id) === String(lotIdVal) || String(s.lotNumber) === String(batch.lotNumber));
              const existingLot = existingIdx >= 0 ? stockList[existingIdx] : null;
              const existingBoxMap = existingLot && Array.isArray(existingLot.boxes) 
                ? new Map(existingLot.boxes.map(b => [String(b.id || b.boxNumber), b])) 
                : new Map();

              const boxes = (batch.boxes || []).map((bx, idx) => {
                const bId = String(bx.boxNumber || `B${idx + 1}`).trim();
                const retWt = Number(bx.returnedWeight) || 0;
                const isGr = retWt > 0;
                const oldB = existingBoxMap.get(bId);

                return {
                  id: bId,
                  boxNumber: bId,
                  cones: Number(bx.cones) || 0,
                  weight: Number(bx.weight) || 0,
                  status: oldB?.status === 'issued' ? 'issued' : (isGr ? 'gr' : (oldB?.status || 'available')),
                  issueDate: oldB?.issueDate || null,
                  issuedTo: oldB?.issuedTo || null,
                  grWeight: retWt,
                  grDate: bx.returnedDate ? bx.returnedDate.split('T')[0] : (oldB?.grDate || ''),
                  grRemarks: isGr ? 'Returned in Challan GR' : (oldB?.grRemarks || null)
                };
              });

              const updatedLot = {
                id: lotIdVal,
                lotNumber: batch.lotNumber || ('LOT-' + (batch.challanNumber || 'AUTO')),
                challanNo: batch.challanNumber || (existingLot?.challanNo || ''),
                challanNumber: batch.challanNumber || (existingLot?.challanNumber || ''),
                receiveDate: recDateOnly,
                date: recDateOnly,
                supplier: order.supplier || (existingLot?.supplier || ''),
                quality: order.quality || (existingLot?.quality || ''),
                itemType: order.category || order.type || 'Polyester',
                code: order.code || (existingLot?.code || ''),
                color: order.color || (existingLot?.color || ''),
                rate: order.price || (existingLot?.rate || ''),
                orderRef: order.orderNumber || order.id,
                boxes: boxes
              };

              if (existingIdx >= 0) {
                stockList[existingIdx] = updatedLot;
              } else {
                stockList.unshift(updatedLot);
              }
              changed = true;
            });
          });

          if (changed) {
            localStorage.setItem(YARN_STOCK_STORAGE_KEY, JSON.stringify(stockList));
            if (window.VishwaSupabase && typeof window.VishwaSupabase.saveToSupabase === 'function') {
              window.VishwaSupabase.saveToSupabase(YARN_STOCK_STORAGE_KEY, stockList);
            }
          }
        } catch(e) {
          console.error("Yarn stock auto-heal sync error:", e);
        }
      }, [orders]);

      // View URL sync
      useEffect(() => {
        const titles = {
          'orders': 'Yarn RM Orders — Vishwa Fashions',
          'analytics': 'Yarn Order Analytics — Vishwa Fashions',
          'heat-map': 'Yarn Delivery Heat Map — Vishwa Fashions'
        };
        document.title = titles[view] || 'Yarn RM Orders — Vishwa Fashions';
        const url = new URL(window.location.href);
        if (url.searchParams.get('view') !== view) {
          url.searchParams.set('view', view);
          window.history.replaceState({}, '', url.pathname + '?' + url.searchParams.toString());
        }
      }, [view]);

      const allCombinations = useMemo(() => {
        const combos = [];
        orders.forEach(o => combos.push({ quality: o.quality, supplier: o.supplier, code: o.code, color: o.color, type: o.category || o.type || 'Polyester' }));
        qualities.forEach(q => {
          combos.push({ quality: q.quality, supplier: q.supplier, code: q.code, color: q.color, type: q.type || 'Polyester' });
        });
        const seen = new Set();
        return combos.filter(c => {
          const key = `${c.quality}|${c.supplier}|${c.code}|${c.color}|${c.type}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }, [qualities, orders]);

      const getOrderOptions = (field) => {
        const otherFilters = { quality: qualityFilter, supplier: supplierFilter, code: codeFilter, color: colorFilter, type: filterType === 'All' ? null : filterType };
        delete otherFilters[field];
        const relevantCombos = allCombinations.filter(c => Object.keys(otherFilters).every(k => !otherFilters[k] || c[k] === otherFilters[k]));
        return [...new Set(relevantCombos.map(c => c[field]).filter(Boolean))].sort();
      };

      const handleOrderFilterSelect = (field, value) => {
        const newFilters = { 
          quality: qualityFilter, 
          supplier: supplierFilter, 
          code: codeFilter, 
          color: colorFilter,
          [field]: value 
        };
        
        let filtered = allCombinations.filter(q => {
          return (!newFilters.quality || q.quality === newFilters.quality) &&
                 (!newFilters.code || q.code === newFilters.code) &&
                 (!newFilters.color || q.color === newFilters.color) &&
                 (!newFilters.supplier || q.supplier === newFilters.supplier) &&
                 (filterType === 'All' || q.type === filterType);
        });

        const fields = ['quality', 'supplier', 'code', 'color'];
        const updated = { ...newFilters };
        fields.forEach(f => {
          const options = [...new Set(filtered.map(item => item[f]))].filter(Boolean);
          if (options.length === 1) updated[f] = options[0];
        });

        setQualityFilter(updated.quality);
        setSupplierFilter(updated.supplier);
        setCodeFilter(updated.code);
        setColorFilter(updated.color);
      };

      // Filtered Orders
      const filteredOrders = useMemo(() => {
        let filtered = orders;
        if (filterType !== 'All') filtered = filtered.filter(o => (o.category || o.type) === filterType);
        if (qualityFilter) filtered = filtered.filter(o => o.quality === qualityFilter);
        if (supplierFilter) filtered = filtered.filter(o => o.supplier === supplierFilter);
        if (codeFilter) filtered = filtered.filter(o => o.code === codeFilter);
        if (colorFilter) filtered = filtered.filter(o => o.color === colorFilter);
        
        if (fromDate || toDate) {
          filtered = filtered.filter(o => {
            const d = new Date(o.orderDate || o.createdAt);
            d.setHours(0,0,0,0);
            if (fromDate && d < new Date(fromDate)) return false;
            if (toDate && d > new Date(toDate)) return false;
            return true;
          });
        }

        if (orderSearch.trim()) {
          const isExact = orderSearch.includes(',');
          const terms = orderSearch.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
          filtered = filtered.filter(o => {
            const searchParts = [
              o.id, o.orderNumber, o.quality, o.code, o.color, o.supplier, o.category || o.type, o.status, o.orderedWeight, o.price, 
              new Date(o.orderDate || o.createdAt).toLocaleDateString('en-GB')
            ];
            
            let hasActualGR = false;
            (o.batches || []).forEach(b => {
              searchParts.push(b.challanNumber, b.lotNumber, b.totalWeight);
              if (b.receiveDate) searchParts.push(new Date(b.receiveDate).toLocaleDateString('en-GB'));
              
              (b.boxes || []).forEach(box => {
                const weight = Number(box.weight) || 0;
                const retWeight = Number(box.returnedWeight) || 0;
                const netWeight = weight - retWeight;
                searchParts.push(box.boxNumber, box.cones, box.weight, box.returnedWeight, netWeight.toFixed(1));
                if (box.returnedDate) searchParts.push(new Date(box.returnedDate).toLocaleDateString('en-GB'));
                if (retWeight > 0) hasActualGR = true;
              });
            });
            
            const searchPartsLower = searchParts.map(v => (v ?? '').toString().toLowerCase());
            const finalContent = searchPartsLower.join(' ');
            
            return terms.every(term => {
              if (isExact) {
                return searchPartsLower.some(val => val === term) || (term === 'gr' && hasActualGR);
              } else {
                return finalContent.includes(term) || (term === 'gr' && hasActualGR);
              }
            });
          });
        }

        return [...filtered].sort((a, b) => {
          for (const sort of orderSort) {
            let valA, valB;
            if (sort.key === 'orderDate' || sort.key === 'createdAt') { 
              valA = new Date(a[sort.key] || a.createdAt); 
              valB = new Date(b[sort.key] || b.createdAt); 
            }
            else if (sort.key === 'received') { 
              valA = (a.batches || []).reduce((acc, b) => acc + (Number(b.totalWeight) || 0), 0); 
              valB = (b.batches || []).reduce((acc, b) => acc + (Number(b.totalWeight) || 0), 0); 
            }
            else if (sort.key === 'orderedWeight' || sort.key === 'price') { 
              valA = Number(a[sort.key] || 0); 
              valB = Number(b[sort.key] || 0); 
            }
            else { 
              valA = (a[sort.key] || "").toString().toLowerCase(); 
              valB = (b[sort.key] || "").toString().toLowerCase(); 
            }
            if (valA < valB) return sort.direction === 'asc' ? -1 : 1;
            if (valA > valB) return sort.direction === 'asc' ? 1 : -1;
          }
          const dateA = new Date(a.orderDate || a.createdAt);
          const dateB = new Date(b.orderDate || b.createdAt);
          if (dateB - dateA !== 0) return dateB - dateA;
          return new Date(b.createdAt) - new Date(a.createdAt);
        });
      }, [orders, filterType, orderSearch, fromDate, toDate, orderSort, qualityFilter, supplierFilter, codeFilter, colorFilter]);

      // Summary statistics matching order-book.html
      const stats = useMemo(() => {
        const calc = (list) => {
          let o = 0, r = 0, g = 0;
          list.forEach(item => {
            o += Number(item.orderedWeight) || 0;
            (item.batches || []).forEach(b => {
              r += Number(b.totalWeight) || 0;
              (b.boxes || []).forEach(box => g += (Number(box.returnedWeight) || 0));
            });
          });
          return { ordered: o, received: r, gr: g };
        };
        const active = filteredOrders.filter(o => o.status === 'Active');
        const completed = filteredOrders.filter(o => o.status === 'Completed');
        const sA = calc(active), sC = calc(completed), sT = calc(filteredOrders);
        return {
          active: { count: active.length, load: sA.ordered, gr: sA.gr, pending: Math.max(0, sA.ordered - sA.received) },
          completed: { count: completed.length, load: sC.ordered, gr: sC.gr, received: sC.received },
          total: { count: filteredOrders.length, load: sT.ordered, gr: sT.gr, received: sT.received }
        };
      }, [filteredOrders]);

      const requestOrderSort = (key, event) => {
        setOrderSort(prev => {
          if (event && (event.shiftKey || event.ctrlKey || event.metaKey)) {
            const existingIndex = prev.findIndex(s => s.key === key);
            if (existingIndex > -1) {
              const current = prev[existingIndex];
              if (current.direction === 'desc') {
                const next = [...prev];
                next[existingIndex] = { key, direction: 'asc' };
                return next;
              } else {
                return prev.filter(s => s.key !== key);
              }
            } else {
              return [...prev, { key, direction: 'desc' }];
            }
          } else {
            const existing = prev.find(s => s.key === key);
            if (existing) {
              return [{ key, direction: existing.direction === 'desc' ? 'asc' : 'desc' }];
            } else {
              return [{ key, direction: 'desc' }];
            }
          }
        });
      };

      const SortIndicator = ({ sortConfig, columnKey }) => {
        const config = sortConfig.find(s => s.key === columnKey);
        const index = sortConfig.findIndex(s => s.key === columnKey);
        if (!config) return <span style={{ opacity: 0.2, marginLeft: '0.4rem' }}>↕</span>;
        return (
          <span style={{ marginLeft: '0.4rem', color: 'var(--accent)', fontWeight: 'bold' }}>
            {config.direction === 'asc' ? '↑' : '↓'}
            {sortConfig.length > 1 && <small style={{fontSize: '0.6rem', marginLeft: '1px', opacity: 0.8}}>{index + 1}</small>}
          </span>
        );
      };

      const handleAddOrder = (orderData) => {
        const newOrder = {
          ...orderData,
          id: 'YRN-ORD-' + Date.now(),
          orderNumber: orderData.orderNumber || ('YRN-' + Math.floor(1000 + Math.random() * 9000)),
          createdAt: new Date().toISOString(),
          status: 'Active',
          batches: []
        };
        setOrders(prev => [newOrder, ...prev]);
        setShowOrderModal(false);
      };

      const updateOrder = (o) => {
        const processed = { ...o, orderDate: addTimestampToDate(o.orderDate) };
        setOrders(prev => prev.map(x => x.id === o.id ? processed : x));
        if (selectedOrder?.id === o.id) setSelectedOrder(processed);
      };

      const completeOrder = (id) => {
        setOrders(prev => prev.map(o => o.id === id ? { ...o, status: 'Completed' } : o));
      };

      const deleteOrder = (id) => {
        const targetOrder = orders.find(o => o.id === id);
        if (!targetOrder) return;
        
        if (confirm(`Delete order for ${targetOrder.quality} (${targetOrder.supplier})? Associated inward lots will be removed from Yarn RM Stock Book.`)) {
          setOrders(prev => prev.filter(o => o.id !== id));
          
          // Remove linked stock lots from Yarn RM stock
          try {
            const rawStock = localStorage.getItem(YARN_STOCK_STORAGE_KEY);
            let stockList = rawStock ? JSON.parse(rawStock) : [];
            if (Array.isArray(stockList)) {
              const orderRef = targetOrder.orderNumber || targetOrder.id;
              stockList = stockList.filter(s => s.orderRef !== orderRef);
              localStorage.setItem(YARN_STOCK_STORAGE_KEY, JSON.stringify(stockList));
              if (window.VishwaSupabase && typeof window.VishwaSupabase.saveToSupabase === 'function') {
                window.VishwaSupabase.saveToSupabase(YARN_STOCK_STORAGE_KEY, stockList);
              }
            }
          } catch(e) {}
        }
      };

      return (
        <div className="app-container">
          <header>
            <div className="logo-section">
              <span className="logo" style={{cursor: 'default'}}>
                {view === 'orders' ? 'Yarn RM Orders' : view === 'analytics' ? 'Yarn Order Analytics' : 'Yarn Delivery Heat Map'}
              </span>
            </div>
            <div className="ob-header-actions">
              {view === 'orders' && (
                <button className="btn btn-primary" onClick={() => setShowOrderModal(true)}>
                  + Add New Order
                </button>
              )}
            </div>
          </header>

          {/* VIEW: ORDERS LIST */}
          {view === 'orders' && (
            <React.Fragment>
              {/* Order Filters Card */}
              <div className="card" style={{ overflow: 'visible', zIndex: 100, marginBottom: '2rem' }}>
                <div className="ob-filter-toolbar">
                  <h3>Order Filters</h3>
                  <div className="ob-filter-type-toggle">
                    {['All', ...YARN_CATEGORIES].map(type => (
                      <button 
                        key={type}
                        className="btn" 
                        style={{
                          padding: '0.4rem 1rem', 
                          fontSize: '0.85rem',
                          background: filterType === type ? 'var(--surface)' : 'transparent',
                          boxShadow: filterType === type ? 'var(--shadow-sm)' : 'none',
                          color: filterType === type ? 'var(--accent)' : 'var(--muted)'
                        }}
                        onClick={() => {
                          const currentFilters = { quality: qualityFilter, supplier: supplierFilter, code: codeFilter, color: colorFilter };
                          const newFilters = { ...currentFilters, type: type === 'All' ? null : type };
                          let filtered = allCombinations.filter(c => {
                            return (!newFilters.type || c.type === newFilters.type) &&
                                   (!newFilters.quality || c.quality === newFilters.quality) &&
                                   (!newFilters.code || c.code === newFilters.code) &&
                                   (!newFilters.color || c.color === newFilters.color) &&
                                   (!newFilters.supplier || c.supplier === newFilters.supplier);
                          });
                          
                          const fields = ['quality', 'supplier', 'code', 'color'];
                          fields.forEach(f => {
                            const options = [...new Set(filtered.map(item => item[f]))].filter(Boolean);
                            if (options.length === 1) {
                              if (f === 'quality') setQualityFilter(options[0]);
                              else if (f === 'supplier') setSupplierFilter(options[0]);
                              else if (f === 'code') setCodeFilter(options[0]);
                              else if (f === 'color') setColorFilter(options[0]);
                            }
                          });
                          setFilterType(type);
                        }}
                      >
                        {type}
                      </button>
                    ))}
                  </div>
                </div>

                <div style={{ marginBottom: '1.5rem' }}>
                  <div className="ob-filter-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr) auto', gap: '1rem', alignItems: 'end', marginBottom: '1.5rem' }}>
                    <SearchableDropdown 
                      label="Quality"
                      placeholder="Search quality..."
                      options={getOrderOptions('quality')}
                      value={qualityFilter}
                      onChange={val => handleOrderFilterSelect('quality', val)}
                      emptyLabel="-- All Qualities --"
                    />
                    <SearchableDropdown 
                      label="Code"
                      placeholder="Search code..."
                      options={getOrderOptions('code')}
                      value={codeFilter}
                      onChange={val => handleOrderFilterSelect('code', val)}
                      emptyLabel="-- All Codes --"
                    />
                    <SearchableDropdown 
                      label="Color"
                      placeholder="Search color..."
                      options={getOrderOptions('color')}
                      value={colorFilter}
                      onChange={val => handleOrderFilterSelect('color', val)}
                      emptyLabel="-- All Colors --"
                    />
                    <SearchableDropdown 
                      label="Supplier"
                      placeholder="Search supplier..."
                      options={getOrderOptions('supplier')}
                      value={supplierFilter}
                      onChange={val => handleOrderFilterSelect('supplier', val)}
                      emptyLabel="-- All Suppliers --"
                    />
                    <div className="input-group" style={{ marginBottom: 0 }}>
                      <label>From Date</label>
                      <input type="date" value={fromDate} onChange={e => setFromDate(e.target.value)} style={{ borderRadius: '12px' }} />
                    </div>
                    <div className="input-group" style={{ marginBottom: 0 }}>
                      <label>To Date</label>
                      <input type="date" value={toDate} onChange={e => setToDate(e.target.value)} style={{ borderRadius: '12px' }} />
                    </div>
                    <button 
                      className="btn btn-outline" 
                      style={{padding: '0.75rem', borderRadius: '12px', alignSelf: 'end'}}
                      onClick={() => { 
                        setFromDate(''); setToDate(''); setOrderSearch(''); 
                        setQualityFilter(''); setSupplierFilter(''); setCodeFilter(''); setColorFilter('');
                        setFilterType('All');
                      }}
                      title="Clear Filters"
                    >
                      🔄 Filters
                    </button>
                  </div>

                  <div className="input-group" style={{ marginBottom: 0 }}>
                    <label>Search Orders</label>
                    <input 
                      type="text" 
                      placeholder="Search quality, code, challan, lot, box... (use comma for multiple)" 
                      value={orderSearch}
                      onChange={e => setOrderSearch(e.target.value)}
                      style={{ borderRadius: '12px' }}
                    />
                  </div>
                </div>
              </div>

              {/* 3 Summary Cards matching order-book.html */}
              <div className="ob-summary-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '1.5rem', marginBottom: '2rem' }}>
                <div className="card">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.25rem' }}>
                    <h3 style={{ fontSize: '1rem' }}>Active orders</h3>
                    <div style={{ fontSize: '0.8rem', color: 'var(--muted)' }}>Current deals</div>
                  </div>
                  <div className="dashboard-grid" style={{ gridTemplateColumns: 'repeat(2, 1fr)', gap: '1rem', marginBottom: 0 }}>
                    <div className="stat-card" style={{ boxShadow: 'none', border: '1px solid var(--border)', padding: '1rem', borderRadius: '12px' }}>
                      <h3 style={{fontSize: '0.8rem', color: 'var(--muted)', textTransform: 'uppercase'}}>Count</h3>
                      <div className="value" style={{ fontSize: '1.5rem', color: 'var(--success)', fontWeight: '700' }}>{stats.active.count}</div>
                    </div>
                    <div className="stat-card" style={{ boxShadow: 'none', border: '1px solid var(--border)', padding: '1rem', borderRadius: '12px' }}>
                      <h3 style={{fontSize: '0.8rem', color: 'var(--muted)', textTransform: 'uppercase'}}>Load (kg)</h3>
                      <div className="value" style={{ fontSize: '1.5rem', color: 'var(--accent2)', fontWeight: '700' }}>{stats.active.load.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 })}</div>
                    </div>
                    <div className="stat-card" style={{ boxShadow: 'none', border: '1px solid var(--border)', padding: '1rem', borderRadius: '12px' }}>
                      <h3 style={{ color: 'var(--accent3)', fontSize: '0.8rem', textTransform: 'uppercase' }}>GR (kg)</h3>
                      <div className="value" style={{ fontSize: '1.2rem', color: 'var(--accent3)', fontWeight: '700' }}>{stats.active.gr.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 })}</div>
                    </div>
                    <div className="stat-card" style={{ boxShadow: 'none', border: '1px solid var(--border)', padding: '1rem', borderRadius: '12px' }}>
                      <h3 style={{fontSize: '0.8rem', color: 'var(--muted)', textTransform: 'uppercase'}}>Pending (kg)</h3>
                      <div className="value" style={{ fontSize: '1.5rem', color: 'var(--fg)', fontWeight: '700' }}>{stats.active.pending.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 })}</div>
                    </div>
                  </div>
                </div>

                <div className="card">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.25rem' }}>
                    <h3 style={{ fontSize: '1rem' }}>Completed orders</h3>
                    <div style={{ fontSize: '0.8rem', color: 'var(--muted)' }}>History</div>
                  </div>
                  <div className="dashboard-grid" style={{ gridTemplateColumns: 'repeat(2, 1fr)', gap: '1rem', marginBottom: 0 }}>
                    <div className="stat-card" style={{ boxShadow: 'none', border: '1px solid var(--border)', padding: '1rem', borderRadius: '12px' }}>
                      <h3 style={{fontSize: '0.8rem', color: 'var(--muted)', textTransform: 'uppercase'}}>Count</h3>
                      <div className="value" style={{ fontSize: '1.5rem', color: 'var(--muted)', fontWeight: '700' }}>{stats.completed.count}</div>
                    </div>
                    <div className="stat-card" style={{ boxShadow: 'none', border: '1px solid var(--border)', padding: '1rem', borderRadius: '12px' }}>
                      <h3 style={{fontSize: '0.8rem', color: 'var(--muted)', textTransform: 'uppercase'}}>Load (kg)</h3>
                      <div className="value" style={{ fontSize: '1.5rem', color: 'var(--accent)', fontWeight: '700' }}>{stats.completed.load.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 })}</div>
                    </div>
                    <div className="stat-card" style={{ boxShadow: 'none', border: '1px solid var(--border)', padding: '1rem', borderRadius: '12px' }}>
                      <h3 style={{ color: 'var(--accent3)', fontSize: '0.8rem', textTransform: 'uppercase' }}>GR (kg)</h3>
                      <div className="value" style={{ fontSize: '1.2rem', color: 'var(--accent3)', fontWeight: '700' }}>{stats.completed.gr.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 })}</div>
                    </div>
                    <div className="stat-card" style={{ boxShadow: 'none', border: '1px solid var(--border)', padding: '1rem', borderRadius: '12px' }}>
                      <h3 style={{fontSize: '0.8rem', color: 'var(--muted)', textTransform: 'uppercase'}}>Delivered (kg)</h3>
                      <div className="value" style={{ fontSize: '1.5rem', color: 'var(--success)', fontWeight: '700' }}>{stats.completed.received.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 })}</div>
                    </div>
                  </div>
                </div>

                <div className="card">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.25rem' }}>
                    <h3 style={{ fontSize: '1rem' }}>Procurement Total</h3>
                    <div style={{ fontSize: '0.8rem', color: 'var(--muted)' }}>Combined</div>
                  </div>
                  <div className="dashboard-grid" style={{ gridTemplateColumns: 'repeat(2, 1fr)', gap: '1rem', marginBottom: 0 }}>
                    <div className="stat-card" style={{ boxShadow: 'none', border: '1px solid var(--border)', padding: '1rem', borderRadius: '12px' }}>
                      <h3 style={{fontSize: '0.8rem', color: 'var(--muted)', textTransform: 'uppercase'}}>Total Orders</h3>
                      <div className="value" style={{ fontSize: '1.5rem', color: 'var(--fg)', fontWeight: '700' }}>{stats.total.count}</div>
                    </div>
                    <div className="stat-card" style={{ boxShadow: 'none', border: '1px solid var(--border)', padding: '1rem', borderRadius: '12px' }}>
                      <h3 style={{fontSize: '0.8rem', color: 'var(--muted)', textTransform: 'uppercase'}}>Total Load</h3>
                      <div className="value" style={{ fontSize: '1.5rem', color: 'var(--accent)', fontWeight: '700' }}>{stats.total.load.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 })}</div>
                    </div>
                    <div className="stat-card" style={{ boxShadow: 'none', border: '1px solid var(--border)', padding: '1rem', borderRadius: '12px' }}>
                      <h3 style={{ color: 'var(--accent3)', fontSize: '0.8rem', textTransform: 'uppercase' }}>Total GR</h3>
                      <div className="value" style={{ fontSize: '1.2rem', color: 'var(--accent3)', fontWeight: '700' }}>{stats.total.gr.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 })}</div>
                    </div>
                    <div className="stat-card" style={{ boxShadow: 'none', border: '1px solid var(--border)', padding: '1rem', borderRadius: '12px' }}>
                      <h3 style={{fontSize: '0.8rem', color: 'var(--muted)', textTransform: 'uppercase'}}>Delivered</h3>
                      <div className="value" style={{ fontSize: '1.5rem', color: 'var(--success)', fontWeight: '700' }}>{stats.total.received.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 })}</div>
                    </div>
                  </div>
                </div>
              </div>

              {/* Table Card */}
              <div className="card">
                <div className="table-responsive">
                  <table>
                    <thead>
                      <tr>
                        <th onClick={(e) => requestOrderSort('orderDate', e)}><div className="header-content">Date <SortIndicator sortConfig={orderSort} columnKey="orderDate" /></div></th>
                        <th onClick={(e) => requestOrderSort('quality', e)}><div className="header-content">Quality <SortIndicator sortConfig={orderSort} columnKey="quality" /></div></th>
                        <th onClick={(e) => requestOrderSort('code', e)}><div className="header-content">Code <SortIndicator sortConfig={orderSort} columnKey="code" /></div></th>
                        <th onClick={(e) => requestOrderSort('color', e)}><div className="header-content">Color <SortIndicator sortConfig={orderSort} columnKey="color" /></div></th>
                        <th onClick={(e) => requestOrderSort('supplier', e)}><div className="header-content">Supplier <SortIndicator sortConfig={orderSort} columnKey="supplier" /></div></th>
                        <th onClick={(e) => requestOrderSort('category', e)}><div className="header-content">Type <SortIndicator sortConfig={orderSort} columnKey="category" /></div></th>
                        <th onClick={(e) => requestOrderSort('orderedWeight', e)}><div className="header-content">Ordered <SortIndicator sortConfig={orderSort} columnKey="orderedWeight" /></div></th>
                        <th onClick={(e) => requestOrderSort('received', e)}><div className="header-content">Received <SortIndicator sortConfig={orderSort} columnKey="received" /></div></th>
                        <th onClick={(e) => requestOrderSort('price', e)}><div className="header-content">Rate <SortIndicator sortConfig={orderSort} columnKey="price" /></div></th>
                        <th onClick={(e) => requestOrderSort('status', e)}><div className="header-content">Status <SortIndicator sortConfig={orderSort} columnKey="status" /></div></th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredOrders.length === 0 ? (
                        <tr>
                          <td colSpan="11" style={{padding: '2.5rem', textAlign: 'center', color: 'var(--muted)'}}>
                            No yarn orders found matching the filter criteria.
                          </td>
                        </tr>
                      ) : (
                        filteredOrders.map(order => {
                          const netReceived = (order.batches || []).reduce((acc, b) => acc + (Number(b.totalWeight) || 0), 0);
                          const totalReturned = (order.batches || []).reduce((acc, batch) => 
                            acc + (batch.boxes || []).reduce((boxAcc, box) => boxAcc + (Number(box.returnedWeight) || 0), 0)
                          , 0);
                          const orderedWt = Number(order.orderedWeight) || 0;
                          const totalToDisplay = netReceived + totalReturned;
                          const scaleBase = Math.max(orderedWt, totalToDisplay) || 1;
                          const netWithoutSurplus = Math.min(netReceived, orderedWt);
                          const surplus = Math.max(0, netReceived - orderedWt);
                          
                          const netProgress = (netWithoutSurplus / scaleBase) * 100;
                          const returnedProgress = (totalReturned / scaleBase) * 100;
                          const surplusProgress = (surplus / scaleBase) * 100;

                          const itemCategory = order.category || order.type || 'Polyester';

                          return (
                            <tr key={order.id}>
                              <td>{new Date(order.orderDate || order.createdAt).toLocaleDateString('en-GB')}</td>
                              <td>
                                <strong>{order.quality}</strong>
                                <div style={{ fontSize: '0.75rem', color: 'var(--muted)', marginTop: '2px' }}>{itemCategory}</div>
                              </td>
                              <td>{order.code || '-'}</td>
                              <td>{order.color || '-'}</td>
                              <td>{order.supplier}</td>
                              <td><span className={`badge badge-${itemCategory.toLowerCase()}`}>{itemCategory}</span></td>
                              <td style={{fontWeight: '600'}}>{orderedWt} kg</td>
                              <td>
                                <div className="progress-mini-container">
                                  <div className="progress-mini-text" style={{fontWeight: '600', flexDirection: 'column', gap: '0'}}>
                                    <div>{netReceived.toFixed(1)} kg</div>
                                    {totalReturned > 0 && <div style={{color: 'var(--accent3)'}}>{totalReturned.toFixed(1)} Kg(GR)</div>}
                                  </div>
                                  <div className="progress-mini-bar-bg">
                                    <div style={{ width: `${netProgress}%`, height: '100%', background: 'var(--accent)', transition: 'width 0.5s ease' }}></div>
                                    {totalReturned > 0 && (
                                      <div style={{ width: `${returnedProgress}%`, height: '100%', background: 'var(--accent3)', transition: 'width 0.5s ease', borderLeft: '1px solid var(--surface)' }}></div>
                                    )}
                                    {surplusProgress > 0 && (
                                      <div style={{ width: `${surplusProgress}%`, height: '100%', background: '#3b82f6', transition: 'width 0.5s ease', borderLeft: '1px solid var(--surface)' }}></div>
                                    )}
                                  </div>
                                </div>
                              </td>
                              <td>{order.price ? `₹${Number(order.price).toFixed(2)}` : '—'}</td>
                              <td><span className={`badge badge-${(order.status || 'Active').toLowerCase()}`}>{order.status || 'Active'}</span></td>
                              <td>
                                <div style={{display: 'flex', gap: '0.4rem', justifyContent: 'center'}}>
                                  <button 
                                    className="btn btn-outline" 
                                    style={{padding: '0.3rem 0.6rem', fontSize: '0.8rem', whiteSpace: 'nowrap'}} 
                                    onClick={() => setSelectedOrder(order)}
                                  >
                                    + Challan
                                  </button>
                                  <button 
                                    className="btn btn-outline" 
                                    style={{padding: '0.3rem 0.6rem', color: 'var(--error)', borderColor: 'transparent'}} 
                                    onClick={() => deleteOrder(order.id)}
                                  >
                                    🗑️
                                  </button>
                                </div>
                              </td>
                            </tr>
                          );
                        })
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </React.Fragment>
          )}

          {/* VIEW: ANALYTICS */}
          {view === 'analytics' && (
            <AnalyticsView orders={orders} qualities={qualities} suppliers={suppliers} />
          )}

          {/* VIEW: HEAT MAP */}
          {view === 'heat-map' && (
            <HeatMapView orders={orders} onSelectOrder={order => setSelectedOrder(order)} />
          )}

          {/* Place New Order Modal (8 Essential Fields) */}
          {showOrderModal && (
            <OrderFormModal 
              onClose={() => setShowOrderModal(false)}
              onSubmit={handleAddOrder}
              qualities={qualities}
              suppliers={suppliers}
            />
          )}

          {/* Popup Order Details & Inward Challans Modal (Matching order-book.html) */}
          {selectedOrder && (
            <OrderDetailsModal 
              order={selectedOrder}
              onClose={() => setSelectedOrder(null)}
              onUpdate={updateOrder}
              onComplete={completeOrder}
              geminiApiKey={geminiApiKey}
              selectedGeminiModel={selectedGeminiModel}
              onOpenSettings={() => window.location.href = '../settings.html#gemini-settings'}
            />
          )}
        </div>
      );
    };

    // Component: Place New Yarn Order Modal
    const OrderFormModal = ({ onClose, onSubmit, qualities, suppliers }) => {
      const [formData, setFormData] = useState({
        orderDate: new Date().toISOString().split('T')[0],
        supplier: '',
        category: 'Polyester',
        quality: '',
        code: '',
        color: '',
        orderedWeight: '',
        price: ''
      });

      // Filter qualities based on item type
      const filteredQualities = useMemo(() => {
        return (qualities || []).filter(q => {
          const qType = q.type || q.itemType || 'Polyester';
          if (formData.category && qType !== formData.category) return false;
          return true;
        });
      }, [qualities, formData.category]);

      const availableCodes = useMemo(() => {
        const codes = (qualities || []).filter(q => {
          const qType = q.type || q.itemType || 'Polyester';
          const qQual = q.quality || q.name || '';
          if (formData.category && qType !== formData.category) return false;
          if (formData.quality && qQual !== formData.quality) return false;
          return true;
        }).map(q => q.code).filter(Boolean);
        return [...new Set(codes)];
      }, [qualities, formData.category, formData.quality]);

      const availableColors = useMemo(() => {
        const colors = (qualities || []).filter(q => {
          const qType = q.type || q.itemType || 'Polyester';
          const qQual = q.quality || q.name || '';
          if (formData.category && qType !== formData.category) return false;
          if (formData.quality && qQual !== formData.quality) return false;
          return true;
        }).map(q => q.color).filter(Boolean);
        return [...new Set(colors)];
      }, [qualities, formData.category, formData.quality]);

      const handleQualityChange = (selectedQualName) => {
        const match = filteredQualities.find(q => (q.quality || q.name) === selectedQualName);
        setFormData(prev => ({
          ...prev,
          quality: selectedQualName,
          code: match?.code || prev.code,
          color: match?.color || prev.color,
          supplier: prev.supplier || match?.supplier || ''
        }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.orderDate || !formData.supplier || !formData.category || !formData.quality || !formData.orderedWeight) {
          alert('Please fill in all mandatory fields (*)');
          return;
        }

        onSubmit({
          ...formData,
          orderedWeight: Number(formData.orderedWeight) || 0,
          price: formData.price ? Number(formData.price) : ''
        });
      };

      return (
        <div className="modal-overlay">
          <div className="modal" style={{maxWidth: '720px'}}>
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem'}}>
              <h2>Place New Yarn RM Order</h2>
              <button className="btn btn-outline" style={{padding: '0.4rem 0.8rem'}} onClick={onClose}>✕</button>
            </div>

            <form onSubmit={handleSubmit}>
              <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem'}}>
                <div className="input-group">
                  <label>Order Date *</label>
                  <input 
                    type="date" 
                    value={formData.orderDate} 
                    onChange={e => setFormData({...formData, orderDate: e.target.value})} 
                    required 
                  />
                </div>

                <div className="input-group">
                  <label>RM Supplier *</label>
                  <select 
                    value={formData.supplier} 
                    onChange={e => setFormData({...formData, supplier: e.target.value})}
                    required
                  >
                    <option value="">-- Select RM Supplier --</option>
                    {suppliers.map((s, idx) => {
                      const sName = s.name || s.supplier;
                      return <option key={idx} value={sName}>{sName}</option>;
                    })}
                  </select>
                </div>
              </div>

              <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem'}}>
                <div className="input-group">
                  <label>Item (Yarn Type) *</label>
                  <select 
                    value={formData.category} 
                    onChange={e => setFormData({...formData, category: e.target.value, quality: '', code: '', color: ''})}
                    required
                  >
                    {YARN_CATEGORIES.map(cat => (
                      <option key={cat} value={cat}>{cat}</option>
                    ))}
                  </select>
                </div>

                <div className="input-group">
                  <label>Yarn Quality *</label>
                  <select 
                    value={formData.quality} 
                    onChange={e => handleQualityChange(e.target.value)}
                    required
                  >
                    <option value="">-- Select Yarn Quality --</option>
                    {filteredQualities.map((q, idx) => {
                      const qName = q.quality || q.name;
                      return <option key={idx} value={qName}>{qName}{q.color ? ` (${q.color})` : ''}</option>;
                    })}
                  </select>
                </div>
              </div>

              <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem'}}>
                <div className="input-group">
                  <label>Yarn Code</label>
                  {availableCodes.length > 0 ? (
                    <select 
                      value={formData.code} 
                      onChange={e => setFormData({...formData, code: e.target.value})}
                    >
                      <option value="">-- Select / Optional --</option>
                      {availableCodes.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  ) : (
                    <input 
                      type="text" 
                      placeholder="e.g. 7536BR" 
                      value={formData.code} 
                      onChange={e => setFormData({...formData, code: e.target.value})} 
                    />
                  )}
                </div>

                <div className="input-group">
                  <label>Color</label>
                  {availableColors.length > 0 ? (
                    <select 
                      value={formData.color} 
                      onChange={e => setFormData({...formData, color: e.target.value})}
                    >
                      <option value="">-- Select / Optional --</option>
                      {availableColors.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  ) : (
                    <input 
                      type="text" 
                      placeholder="e.g. Optic White" 
                      value={formData.color} 
                      onChange={e => setFormData({...formData, color: e.target.value})} 
                    />
                  )}
                </div>
              </div>

              <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem'}}>
                <div className="input-group">
                  <label>Total Order Qty (Kg) *</label>
                  <input 
                    type="number" 
                    step="0.01" 
                    placeholder="e.g. 1000" 
                    value={formData.orderedWeight} 
                    onChange={e => setFormData({...formData, orderedWeight: e.target.value})} 
                    required 
                  />
                </div>

                <div className="input-group">
                  <label>Rate (₹/Kg) <span style={{color: 'var(--muted)', fontWeight: 'normal'}}>(Optional)</span></label>
                  <input 
                    type="number" 
                    step="0.01" 
                    placeholder="e.g. 145.50" 
                    value={formData.price} 
                    onChange={e => setFormData({...formData, price: e.target.value})} 
                  />
                </div>
              </div>

              <div style={{display: 'flex', gap: '1rem', marginTop: '1.5rem'}}>
                <button type="submit" className="btn btn-primary" style={{flex: 1}}>Place Order</button>
                <button type="button" className="btn btn-outline" onClick={onClose}>Cancel</button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    // Component: Order Details Modal (Exact replica of order-book.html)
    const OrderDetailsModal = ({ order, onClose, onUpdate, onComplete, geminiApiKey, selectedGeminiModel, onOpenSettings }) => {
      const [showBatchForm, setShowBatchForm] = useState(false);
      const [editingBatch, setEditingBatch] = useState(null);
      const received = (order.batches || []).reduce((acc, b) => acc + (Number(b.totalWeight) || 0), 0);
      const gr = (order.batches || []).reduce((acc, batch) => acc + (batch.boxes || []).reduce((boxAcc, box) => boxAcc + (Number(box.returnedWeight) || 0), 0), 0);
      const grossReceived = received + gr;
      
      const isCompleted = order.status === 'Completed';
      const netDiff = received - Number(order.orderedWeight || 0);

      const handleBatchSubmit = (batchData) => {
        const processed = {
          ...batchData,
          receiveDate: addTimestampToDate(batchData.receiveDate),
          boxes: batchData.boxes ? batchData.boxes.map(box => ({
            ...box,
            returnedDate: box.returnedDate ? addTimestampToDate(box.returnedDate) : ''
          })) : []
        };
        
        let updatedBatches = editingBatch 
          ? order.batches.map(x => x.id === editingBatch.id ? { ...x, ...processed } : x) 
          : [...(order.batches || []), { ...processed, id: Date.now().toString(), receivedAt: new Date().toISOString() }];

        // Sync directly into Yarn RM Stock Book
        try {
          const rawStock = localStorage.getItem(YARN_STOCK_STORAGE_KEY);
          let stockList = rawStock ? JSON.parse(rawStock) : [];
          if (!Array.isArray(stockList)) stockList = [];

          const recDateOnly = (batchData.receiveDate || new Date().toISOString().split('T')[0]).split('T')[0];
          const lotIdVal = batchData.lotNumber || ('LOT-' + (batchData.challanNumber || Date.now().toString().slice(-4)));

          const stockLot = {
            id: lotIdVal,
            lotNumber: batchData.lotNumber || ('LOT-' + (batchData.challanNumber || 'AUTO')),
            challanNo: batchData.challanNumber || '',
            challanNumber: batchData.challanNumber || '',
            receiveDate: recDateOnly,
            date: recDateOnly,
            supplier: order.supplier || '',
            quality: order.quality || '',
            itemType: order.category || order.type || 'Polyester',
            code: order.code || '',
            color: order.color || '',
            rate: order.price || '',
            orderRef: order.orderNumber || order.id,
            boxes: (batchData.boxes || []).map((bx, idx) => {
              const bId = String(bx.boxNumber || `B${idx + 1}`).trim();
              const retWt = Number(bx.returnedWeight) || 0;
              const isGr = retWt > 0;
              return {
                id: bId,
                boxNumber: bId,
                cones: Number(bx.cones) || 0,
                weight: Number(bx.weight) || 0,
                status: isGr ? 'gr' : 'available',
                issueDate: null,
                issuedTo: null,
                grWeight: retWt,
                grDate: bx.returnedDate ? bx.returnedDate.split('T')[0] : '',
                grRemarks: isGr ? 'Returned in Challan GR' : null
              };
            })
          };

          // If lot exists, preserve existing box issue/status records
          const existingLot = stockList.find(s => String(s.id) === String(stockLot.id) || String(s.lotNumber) === String(stockLot.lotNumber));
          if (existingLot && Array.isArray(existingLot.boxes)) {
            const existingBoxMap = new Map(existingLot.boxes.map(b => [String(b.id || b.boxNumber), b]));
            stockLot.boxes = stockLot.boxes.map(b => {
              const oldB = existingBoxMap.get(String(b.id));
              if (oldB && oldB.status === 'issued') {
                return {
                  ...b,
                  status: 'issued',
                  issueDate: oldB.issueDate,
                  issuedTo: oldB.issuedTo
                };
              }
              return b;
            });
          }

          stockList = stockList.filter(s => String(s.id) !== String(stockLot.id) && String(s.lotNumber) !== String(stockLot.lotNumber));
          stockList.unshift(stockLot);
          localStorage.setItem(YARN_STOCK_STORAGE_KEY, JSON.stringify(stockList));
          if (window.VishwaSupabase && typeof window.VishwaSupabase.saveToSupabase === 'function') {
            window.VishwaSupabase.saveToSupabase(YARN_STOCK_STORAGE_KEY, stockList);
          }
        } catch(e) {
          console.error("Stock sync error:", e);
        }

        onUpdate({ ...order, batches: updatedBatches }); 
        setShowBatchForm(false); 
        setEditingBatch(null);
      };

      const handleDeleteBatch = (batchId) => {
        if (confirm('Delete this batch?')) {
          const delBatch = (order.batches || []).find(x => x.id === batchId);
          const updatedBatches = (order.batches || []).filter(x => x.id !== batchId);

          // Clean from stock book
          if (delBatch) {
            try {
              const rawStock = localStorage.getItem(YARN_STOCK_STORAGE_KEY);
              let stockList = rawStock ? JSON.parse(rawStock) : [];
              if (Array.isArray(stockList)) {
                stockList = stockList.filter(s => String(s.id) !== String(delBatch.lotNumber) && String(s.lotNumber) !== String(delBatch.lotNumber) && String(s.challanNo || s.challanNumber) !== String(delBatch.challanNumber));
                localStorage.setItem(YARN_STOCK_STORAGE_KEY, JSON.stringify(stockList));
                if (window.VishwaSupabase && typeof window.VishwaSupabase.saveToSupabase === 'function') {
                  window.VishwaSupabase.saveToSupabase(YARN_STOCK_STORAGE_KEY, stockList);
                }
              }
            } catch(e) {}
          }

          onUpdate({ ...order, batches: updatedBatches });
        }
      };

      return (
        <div className="modal-overlay">
          <div className="modal" style={{maxWidth: '1200px'}}>
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
              <div>
                <h2>{order.quality} — {order.supplier}</h2>
                <p style={{color: 'var(--muted)'}}>
                  {order.code || '-'} | {order.color || '-'} | {order.category || order.type || 'Polyester'} {order.price ? `| ₹${Number(order.price).toFixed(2)}/kg` : ''}
                </p>
              </div>
              <button className="btn btn-outline" onClick={onClose}>Close</button>
            </div>

            <div className="dashboard-grid" style={{marginTop: '2rem', gridTemplateColumns: isCompleted ? 'repeat(6, 1fr)' : 'repeat(5, 1fr)', gap: '1rem', marginBottom: '2rem'}}>
              <div className="card" style={{padding: '1.25rem'}}>
                <h3 style={{fontSize: '0.8rem', color: 'var(--muted)', textTransform: 'uppercase'}}>Ordered</h3>
                <div className="value" style={{fontSize: '1.5rem', fontWeight: '700'}}>{order.orderedWeight} kg</div>
              </div>
              <div className="card" style={{padding: '1.25rem'}}>
                <h3 style={{fontSize: '0.8rem', color: 'var(--muted)', textTransform: 'uppercase'}}>Gross Received</h3>
                <div className="value" style={{fontSize: '1.5rem', fontWeight: '700'}}>{grossReceived.toFixed(1)}</div>
              </div>
              <div className="card" style={{padding: '1.25rem'}}>
                <h3 style={{fontSize: '0.8rem', color: 'var(--accent3)', textTransform: 'uppercase'}}>GR</h3>
                <div className="value" style={{fontSize: '1.5rem', color: 'var(--accent3)', fontWeight: '700'}}>{gr.toFixed(1)}</div>
              </div>
              <div className="card" style={{padding: '1.25rem'}}>
                <h3 style={{fontSize: '0.8rem', color: 'var(--success)', textTransform: 'uppercase'}}>Net Received</h3>
                <div className="value" style={{fontSize: '1.5rem', color: 'var(--success)', fontWeight: '700'}}>{received.toFixed(1)}</div>
              </div>
              {isCompleted && (
                <div className="card" style={{ padding: '1.25rem', borderColor: netDiff >= 0 ? '#3b82f6' : 'var(--error)', background: netDiff >= 0 ? 'rgba(59, 130, 246, 0.05)' : 'rgba(239, 68, 68, 0.02)' }}>
                  <h3 style={{ color: netDiff >= 0 ? '#3b82f6' : 'var(--error)', fontSize: '0.8rem', textTransform: 'uppercase' }}>{netDiff >= 0 ? 'Surplus' : 'Shortfall'}</h3>
                  <div className="value" style={{ fontSize: '1.5rem', color: netDiff >= 0 ? '#3b82f6' : 'var(--error)', fontWeight: '700' }}>
                    {Math.abs(netDiff).toFixed(1)} kg
                  </div>
                </div>
              )}
              <div className="card" style={{padding: '1.25rem'}}>
                <h3 style={{fontSize: '0.8rem', color: 'var(--muted)', textTransform: 'uppercase'}}>Status</h3>
                <div className="value" style={{fontSize: '1.5rem', color: 'var(--success)', fontWeight: '700'}}>{order.status || 'Active'}</div>
              </div>
            </div>

            <div style={{marginTop: '2rem'}}>
              <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem'}}>
                <h3>Received Batches</h3>
                {order.status === 'Active' && (
                  <button className="btn btn-primary" onClick={() => { setEditingBatch(null); setShowBatchForm(true); }}>
                    + Add Batch
                  </button>
                )}
              </div>

              {showBatchForm && (
                <BatchForm 
                  order={order} 
                  onCancel={() => setShowBatchForm(false)} 
                  onSubmit={handleBatchSubmit} 
                  initialData={editingBatch} 
                  geminiApiKey={geminiApiKey}
                  selectedGeminiModel={selectedGeminiModel}
                  onOpenSettings={onOpenSettings}
                />
              )}

              <div className="table-responsive">
                <table>
                  <thead>
                    <tr>
                      <th>Received Date</th>
                      <th>Challan #</th>
                      <th>Lot #</th>
                      <th style={{color: 'var(--accent)'}}>Box Number</th>
                      <th style={{color: 'var(--accent)'}}>In cones</th>
                      <th style={{color: 'var(--accent)'}}>In weight(Kg)</th>
                      <th style={{color: 'var(--error)'}}>GR Cones<br/><span style={{fontSize: '0.7rem', fontWeight: 400, opacity: 0.8}}>(Calculated)</span></th>
                      <th style={{color: 'var(--error)'}}>GR (kg)</th>
                      <th style={{color: 'var(--error)'}}>GR Date</th>
                      <th>Net Weight</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {(order.batches || []).length === 0 ? (
                      <tr>
                        <td colSpan="11" style={{textAlign: 'center', padding: '2rem', color: 'var(--muted)'}}>
                          No batches recorded yet. Click "+ Add Batch" to add incoming delivery boxes.
                        </td>
                      </tr>
                    ) : (
                      [...(order.batches || [])].sort((a, b) => new Date(b.receiveDate) - new Date(a.receiveDate)).map((b, bIdx, bArr) => {
                        const grossTotal = (b.boxes || []).reduce((acc, box) => acc + (Number(box.weight) || 0), 0);
                        const grTotal = (b.boxes || []).reduce((acc, box) => acc + (Number(box.returnedWeight) || 0), 0);
                        const conesTotal = (b.boxes || []).reduce((acc, box) => acc + (Number(box.cones) || 0), 0);
                        
                        const calcGRCones = (box) => {
                          if (!box.returnedWeight || !box.weight || !box.cones) return 0;
                          return Math.round(Number(box.returnedWeight) / (Number(box.weight) / Number(box.cones)));
                        };
                        
                        const grConesTotal = (b.boxes || []).reduce((acc, box) => acc + calcGRCones(box), 0);

                        return (
                          <React.Fragment key={b.id}>
                            {(b.boxes || []).map((box, idx) => (
                              <tr key={`${b.id}-${idx}`}>
                                {idx === 0 && (
                                  <React.Fragment>
                                    <td rowSpan={b.boxes.length + 1}>{new Date(b.receiveDate).toLocaleDateString('en-GB')}</td>
                                    <td rowSpan={b.boxes.length + 1}><strong>{b.challanNumber}</strong></td>
                                    <td rowSpan={b.boxes.length + 1}><span style={{fontFamily: 'var(--font-mono)'}}>{b.lotNumber || '-'}</span></td>
                                  </React.Fragment>
                                )}
                                <td style={{fontWeight: '600'}}>{box.boxNumber}</td>
                                <td>{box.cones || '-'}</td>
                                <td>{Number(box.weight || 0).toFixed(1)}</td>
                                <td style={{color: 'var(--error)', fontWeight: '600'}}>{calcGRCones(box) || '-'}</td>
                                <td style={{color: Number(box.returnedWeight) > 0 ? 'var(--error)' : 'inherit'}}>{box.returnedWeight || '0.0'}</td>
                                <td style={{color: 'var(--error)'}}>{box.returnedDate ? new Date(box.returnedDate).toLocaleDateString('en-GB') : '-'}</td>
                                <td>{(Number(box.weight || 0) - (Number(box.returnedWeight) || 0)).toFixed(1)}</td>
                                {idx === 0 && (
                                  <td rowSpan={b.boxes.length + 1}>
                                    <div style={{display: 'flex', gap: '0.4rem', justifyContent: 'center'}}>
                                      <button className="btn btn-outline" style={{padding: '0.3rem 0.6rem'}} onClick={() => { setEditingBatch(b); setShowBatchForm(true); }}>✏️</button>
                                      <button className="btn btn-outline" style={{padding: '0.3rem 0.6rem', color: 'var(--error)', borderColor: 'transparent'}} onClick={() => handleDeleteBatch(b.id)}>🗑️</button>
                                    </div>
                                  </td>
                                )}
                              </tr>
                            ))}
                            <tr key={`${b.id}-total`} style={{background: 'var(--bg)', fontWeight: '700', fontSize: '0.85rem', borderTop: '2px solid var(--border)'}}>
                              <td style={{color: 'var(--muted)', textAlign: 'right', paddingRight: '1rem'}}>BATCH TOTAL</td>
                              <td>{conesTotal || '-'}</td>
                              <td style={{color: 'var(--accent)'}}>{grossTotal.toFixed(1)}</td>
                              <td style={{color: 'var(--error)'}}>{grConesTotal || '-'}</td>
                              <td style={{color: 'var(--error)'}}>{grTotal.toFixed(1)}</td>
                              <td style={{color: 'var(--muted)'}}>-</td>
                              <td style={{color: 'var(--success)', fontSize: '0.95rem'}}>{Number(b.totalWeight || (grossTotal - grTotal)).toFixed(1)} kg</td>
                            </tr>
                            {bIdx < bArr.length - 1 && (
                              <tr key={`${b.id}-sep`}><td colSpan="11" style={{padding: 0, border: 'none', height: '5px', background: '#000000', lineHeight: '0'}}></td></tr>
                            )}
                          </React.Fragment>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>

            {order.status === 'Active' && (
              <div style={{marginTop: '2rem', textAlign: 'right'}}>
                <button 
                  className="btn btn-primary" 
                  style={{background: 'var(--success)'}} 
                  onClick={() => { 
                    if(confirm('Mark this Yarn RM order as Completed?')) { 
                      onComplete(order.id); 
                      onClose(); 
                    } 
                  }}
                >
                  Mark as Completed
                </button>
              </div>
            )}
          </div>
        </div>
      );
    };

    // Component: Batch Form with AI Scan (Exact replica of order-book.html)
    const BatchForm = ({ order, onCancel, onSubmit, initialData, geminiApiKey, selectedGeminiModel, onOpenSettings }) => {
      const [challan, setChallan] = useState(initialData?.challanNumber || '');
      const [receiveDate, setReceiveDate] = useState(initialData?.receiveDate?.split('T')[0] || new Date().toISOString().split('T')[0]);
      const [lotNumber, setLotNumber] = useState(initialData?.lotNumber || '');
      const [boxInputs, setBoxInputs] = useState(initialData?.boxes ? initialData.boxes.map(b => ({...b})) : [{ boxNumber: 'B1', cones: '', weight: '', returnedWeight: '', returnedDate: '' }]);
      const [error, setError] = useState(null);
      const [invalidFields, setInvalidFields] = useState({});
      const [isScanning, setIsScanning] = useState(false);

      const scanChallan = async (file) => {
        if (!geminiApiKey) {
          setError(
            <span>
              API Key missing. Please configure it in <a href="#" onClick={(e) => { e.preventDefault(); onOpenSettings(); }} style={{ color: 'var(--accent)', textDecoration: 'underline' }}>Settings</a>.
            </span>
          );
          return;
        }

        setIsScanning(true);
        setError(null);

        try {
          const base64 = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.readAsDataURL(file);
          });

          const prompt = `Extract details from this yarn challan image. Return ONLY a JSON object with: 
            {
              "supplier": "Name of supplier",
              "quality": "Quality/Yarn details",
              "challanNumber": "Challan number",
              "receiveDate": "Date in dd-mm-yyyy format",
              "lotNumber": "Lot number",
              "boxes": [{"boxNumber": "B1", "cones": 24, "weight": 60.5}, ...]
            }`;

          const modelConfigs = [
            { id: selectedGeminiModel || 'gemini-2.0-flash', ver: 'v1beta' },
            { id: 'gemini-2.0-flash', ver: 'v1beta' },
            { id: 'gemini-2.5-flash', ver: 'v1beta' },
            { id: 'gemini-flash-latest', ver: 'v1' }
          ];
          
          const uniqueConfigs = [];
          const seenIds = new Set();
          for (const config of modelConfigs) {
            const key = `${config.id}-${config.ver}`;
            if (!seenIds.has(key)) {
              uniqueConfigs.push(config);
              seenIds.add(key);
            }
          }

          let success = false;
          let lastError = "";

          for (const config of uniqueConfigs) {
            try {
              const response = await fetch(`https://generativelanguage.googleapis.com/${config.ver}/models/${config.id}:generateContent?key=${geminiApiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{
                    parts: [
                      { text: prompt },
                      { inline_data: { mime_type: file.type, data: base64 } }
                    ]
                  }]
                })
              });

              const result = await response.json();
              if (result.error) {
                lastError = `${config.id} (${config.ver}): ${result.error.message}`;
                continue;
              }

              if (!result.candidates || !result.candidates[0]) {
                lastError = `${config.id}: No candidates returned.`;
                continue;
              }

              const text = result.candidates[0].content.parts[0].text;
              const jsonMatch = text.match(/\{[\s\S]*\}/);
              if (!jsonMatch) throw new Error("Could not parse data from image.");
              
              const data = JSON.parse(jsonMatch[0]);

              setChallan(data.challanNumber || '');
              setLotNumber(data.lotNumber || '');
              
              if (data.receiveDate) {
                const parts = data.receiveDate.split('-');
                if (parts.length === 3) {
                  setReceiveDate(`${parts[2]}-${parts[1]}-${parts[0]}`);
                }
              }
