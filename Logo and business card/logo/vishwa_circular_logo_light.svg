<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,700;0,6..96,900;1,6..96,400;1,6..96,600&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap');
      .bg-circle { fill: #faf9f5; }
      .outer-ring { fill: none; stroke: #C5A059; stroke-width: 3.5; }
      .inner-ring { fill: none; stroke: #C5A059; stroke-width: 1; stroke-opacity: 0.6; }
      .dashed-ring { fill: none; stroke: #C5A059; stroke-width: 1; stroke-dasharray: 4,6; stroke-opacity: 0.4; }
      .monogram-v { font-family: 'Bodoni Moda', Georgia, serif; font-size: 148px; font-weight: 900; fill: #111213; letter-spacing: -2px; }
      .monogram-a { font-family: 'Bodoni Moda', Georgia, serif; font-size: 148px; font-weight: 400; font-style: italic; fill: #C5A059; letter-spacing: -2px; }
      .arc-text { font-family: 'Montserrat', sans-serif; font-size: 21px; font-weight: 700; fill: #111213; letter-spacing: 9px; text-anchor: middle; }
      .arc-text-sub { font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 600; fill: #8a6d2b; letter-spacing: 8px; text-anchor: middle; }
      .gold-accent { fill: #C5A059; }
    </style>
    
    <!-- Circular Path for Curved Text -->
    <path id="textArcTop" d="M 96,256 A 160,160 0 0,1 416,256" fill="none" />
    <path id="textArcBottom" d="M 416,256 A 160,160 0 0,1 96,256" fill="none" />
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" class="bg-circle" />

  <!-- Luxury Circular Borders -->
  <circle cx="256" cy="256" r="240" class="outer-ring" />
  <circle cx="256" cy="256" r="230" class="inner-ring" />
  <circle cx="256" cy="256" r="195" class="dashed-ring" />
  <circle cx="256" cy="256" r="125" class="inner-ring" />

  <!-- Top Arc Text: VISHWA -->
  <text>
    <textPath href="#textArcTop" startOffset="50%" class="arc-text">
      VISHWA
    </textPath>
  </text>

  <!-- Bottom Arc Text: ATELIER -->
  <text>
    <textPath href="#textArcBottom" startOffset="50%" class="arc-text-sub">
      ATELIER
    </textPath>
  </text>

  <!-- Left & Right Gold Star / Diamond Accents -->
  <polygon points="76,256 80,250 86,256 80,262" class="gold-accent" />
  <polygon points="436,256 432,250 426,256 432,262" class="gold-accent" />

  <!-- Center Monogram: V A -->
  <g transform="translate(256, 272)" text-anchor="middle">
    <!-- Center Horizontal Gold Accent Line -->
    <rect x="-38" y="24" width="76" height="3" rx="1.5" class="gold-accent" />
    
    <text x="-26" y="8" class="monogram-v">V</text>
    <text x="26" y="8" class="monogram-a">A</text>
  </g>
</svg>
